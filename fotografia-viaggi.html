  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    #map-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 500;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
      border-bottom: 1px solid var(--border);
    }
    .header-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-family: inherit;
      font-size: .58rem;
      letter-spacing: .1em;
      padding: 5px 8px;
      cursor: pointer;
      display: flex; flex-direction: column;
      align-items: center; gap: 2px;
      flex-shrink: 0; width: 52px;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .header-center-travel {
      flex: 1; text-align: center;
      display: flex; flex-direction: column;
      align-items: center; gap: 2px;
    }
    .map-title { font-size: .95rem; letter-spacing: .18em; color: var(--gold); font-weight: 700; }
    .map-sub { font-size: .46rem; letter-spacing: .2em; color: var(--muted); text-transform: uppercase; }
    .theme-toggle {
      background: none; border: 1.5px solid var(--border);
      border-radius: 50%; width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Mappa ── */
    #world-map {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 1;
    }

    /* ── Stats badge ── */
    #stats-badge {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 400;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 7px 18px;
      font-size: .62rem;
      letter-spacing: .12em;
      color: var(--muted);
      text-transform: uppercase;
      display: flex; gap: 14px;
      transition: opacity .3s, transform .3s;
      box-shadow: 0 2px 12px rgba(0,0,0,.12);
    }
    #stats-badge.hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(10px); }
    .stat-val { color: var(--gold); font-weight: 700; font-size: .75rem; margin-right: 3px; }

    /* ── Bottom Sheet ── */
    #bottom-sheet {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 600;
      background: var(--bg);
      border-radius: 22px 22px 0 0;
      border-top: 1.5px solid var(--border);
      transform: translateY(100%);
      transition: transform .35s cubic-bezier(.4,0,.2,1);
      max-height: 82vh;
      display: flex; flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    #bottom-sheet.open { transform: translateY(0); }

    #sheet-handle {
      width: 38px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 12px auto 0;
      flex-shrink: 0;
    }

    #sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 10px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    #sheet-flag { font-size: 2.2rem; line-height: 1; }
    #sheet-country-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: .04em;
      flex: 1; margin: 0 12px;
    }
    #sheet-close {
      background: none; border: none;
      font-size: 1.4rem; color: var(--muted);
      cursor: pointer; padding: 4px;
      -webkit-tap-highlight-color: transparent;
      line-height: 1;
    }

    #sheet-body {
      overflow-y: auto;
      flex: 1;
      padding: 0 18px 20px;
      -webkit-overflow-scrolling: touch;
    }

    /* ── Info paese ── */
    .info-chips {
      display: flex; gap: 8px; flex-wrap: wrap;
      padding: 12px 0 6px;
    }
    .info-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 4px 10px;
      font-size: .62rem;
      letter-spacing: .06em;
      color: var(--muted);
    }
    .info-chip span { color: var(--text); font-weight: 600; }

    /* ── Sezioni ── */
    .section-title {
      font-size: .62rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin: 18px 0 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .section-badge {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 2px 8px;
      font-size: .56rem;
      color: var(--muted);
      font-weight: 500;
    }

    /* ── UNESCO List ── */
    .unesco-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
    }
    .unesco-item:last-child { border-bottom: none; }
    .unesco-check {
      width: 22px; height: 22px;
      border: 2px solid var(--border);
      border-radius: 6px;
      background: var(--card);
      flex-shrink: 0;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: .9rem;
      -webkit-tap-highlight-color: transparent;
      transition: border-color .2s, background .2s;
      margin-top: 1px;
    }
    .unesco-check.checked {
      background: var(--gold);
      border-color: var(--gold);
    }
    .unesco-info { flex: 1; min-width: 0; }
    .unesco-name { font-size: .78rem; font-weight: 600; color: var(--text); line-height: 1.3; }
    .unesco-year { font-size: .58rem; color: var(--muted); letter-spacing: .06em; margin-top: 2px; }

    /* ── Trips ── */
    .trip-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .trip-header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .trip-title {
      font-size: .82rem; font-weight: 700;
      color: var(--text);
    }
    .trip-dates {
      font-size: .58rem; color: var(--muted);
      letter-spacing: .06em; margin-top: 2px;
    }
    .trip-notes {
      font-size: .74rem; color: var(--text);
      line-height: 1.5; margin-top: 6px;
      white-space: pre-wrap;
    }
    .trip-drive {
      display: inline-flex; align-items: center; gap: 5px;
      margin-top: 8px;
      font-size: .65rem;
      color: var(--gold);
      text-decoration: none;
      border: 1px solid var(--gold);
      border-radius: 8px;
      padding: 4px 10px;
    }
    .trip-actions {
      display: flex; gap: 6px; margin-top: 8px;
    }
    .btn-sm {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: .6rem;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-sm.danger { color: var(--red); border-color: var(--red); }
    .btn-sm.primary { color: var(--gold); border-color: var(--gold); }

    /* ── Add Trip Form ── */
    #add-trip-btn {
      width: 100%;
      background: none;
      border: 1.5px dashed var(--border);
      border-radius: 14px;
      padding: 12px;
      font-size: .72rem;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
      letter-spacing: .06em;
      -webkit-tap-highlight-color: transparent;
      margin-bottom: 10px;
    }
    #add-trip-btn:active { border-color: var(--gold); color: var(--gold); }

    .trip-form {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
      display: none;
    }
    .trip-form.open { display: block; }

    .form-row {
      margin-bottom: 10px;
    }
    .form-label {
      display: block;
      font-size: .58rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .form-input, .form-textarea {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: .78rem;
      color: var(--text);
      font-family: inherit;
    }
    .form-textarea { resize: vertical; min-height: 70px; }
    .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form-btns { display: flex; gap: 8px; margin-top: 10px; }
    .btn-form-save {
      flex: 1;
      background: var(--gold);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 9px;
      font-size: .74rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-form-cancel {
      background: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: .74rem;
      font-family: inherit;
      color: var(--muted);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Overlay per chiudere sheet ── */
    #sheet-overlay {
      position: fixed;
      inset: 0;
      z-index: 590;
      background: rgba(0,0,0,0);
      pointer-events: none;
      transition: background .3s;
    }
    #sheet-overlay.active {
      background: rgba(0,0,0,.3);
      pointer-events: all;
    }

    /* Leaflet — rimuovi attribuzioni */
    .leaflet-control-attribution { display: none !important; }
    .leaflet-control-zoom {
      margin-bottom: calc(env(safe-area-inset-bottom, 0px) + 80px) !important;
    }

    // Mappa codice ISO-2 → alpha-3 per GeoJSON
    const ISO2_TO_3 = {
      AT:'AUT',HR:'HRV',DK:'DNK',FI:'FIN',FR:'FRA',VA:'VAT',
      DE:'DEU',GR:'GRC',IT:'ITA',LI:'LIE',MT:'MLT',MC:'MCO',
      NL:'NLD',PL:'POL',CZ:'CZE',TH:'THA',SM:'SMR',JP:'JPN',
      ES:'ESP',SE:'SWE',CH:'CHE',
    };
    const ISO3_TO_2 = Object.fromEntries(Object.entries(ISO2_TO_3).map(([a,b])=>[b,a]));
    const VISITED_CODES = Object.keys(ISO2_TO_3); // i miei paesi visitati

    // ── Mappa ────────────────────────────────────────────────────────────────
    let map, geoLayer;
    let allCountriesData = {};
    let currentCode = null;
    let unsubCountry = null, unsubTrips = null;
    let editingTripId = null;

    function getMapStyles() {
      return {
        visited:   { color: '#25739E', weight: 1, fillColor: '#25739E', fillOpacity: .55 },
        visitedDk: { color: '#74C7E1', weight: 1, fillColor: '#74C7E1', fillOpacity: .45 },
        normal:    { color: '#888', weight: .4, fillColor: '#aaa', fillOpacity: .12 },
        normalDk:  { color: '#555', weight: .4, fillColor: '#334', fillOpacity: .25 },
        hover:     { fillOpacity: .75, weight: 1.5 },
        selected:  { weight: 2, color: '#F5A9BC' },
      };
    }

    function styleForFeature(feat) {
      const iso3 = feat.properties.ISO_A3 || feat.properties.iso_a3 || feat.properties.ADM0_A3;
      const iso2 = ISO3_TO_2[iso3];
      const s = getMapStyles();
      const isVisited = iso2 && VISITED_CODES.includes(iso2);
      return isDark
        ? (isVisited ? s.visitedDk : s.normalDk)
        : (isVisited ? s.visited : s.normal);
    }

    function updateMapStyles() {
      if (!geoLayer) return;
      geoLayer.eachLayer(l => {
        const iso3 = l.feature.properties.ISO_A3 || l.feature.properties.iso_a3 || l.feature.properties.ADM0_A3;
        const iso2 = ISO3_TO_2[iso3];
        const base = styleForFeature(l.feature);
        const isSel = iso2 && iso2 === currentCode;
        l.setStyle(isSel ? { ...base, ...getMapStyles().selected } : base);
      });
    }

    function initMap() {
      // Calcola top offset header
      const headerH = document.getElementById('map-header').offsetHeight;
      document.getElementById('world-map').style.paddingTop = headerH + 'px';

      map = L.map('world-map', {
        center: [20, 10],
        zoom: 2,
        minZoom: 1,
        maxZoom: 8,
        zoomControl: true,
        attributionControl: false,
        worldCopyJump: true,
      });
      window._map = map;

      // Tile layer neutro
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        id: 'light-tiles',
      }).addTo(map);

      const darkTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        id: 'dark-tiles',
      });

      // GeoJSON paesi mondiali via jsDelivr (no CORS, affidabile)
      const NUMERIC_TO_ISO3 = {
        '004':'AFG','008':'ALB','012':'DZA','024':'AGO','032':'ARG','036':'AUS','040':'AUT',
        '050':'BGD','056':'BEL','068':'BOL','076':'BRA','100':'BGR','124':'CAN','152':'CHL',
        '156':'CHN','170':'COL','191':'HRV','192':'CUB','203':'CZE','208':'DNK','218':'ECU',
        '818':'EGY','231':'ETH','246':'FIN','250':'FRA','276':'DEU','288':'GHA','300':'GRC',
        '320':'GTM','332':'HTI','340':'HND','348':'HUN','356':'IND','360':'IDN','364':'IRN',
        '368':'IRQ','372':'IRL','376':'ISR','380':'ITA','388':'JAM','392':'JPN','400':'JOR',
        '404':'KEN','410':'KOR','414':'KWT','418':'LAO','422':'LBN','434':'LBY','438':'LIE',
        '440':'LTU','442':'LUX','470':'MLT','484':'MEX','504':'MAR','508':'MOZ','516':'NAM',
        '524':'NPL','528':'NLD','540':'NCL','554':'NZL','558':'NIC','566':'NGA','578':'NOR',
        '586':'PAK','591':'PAN','604':'PER','608':'PHL','616':'POL','620':'PRT','630':'PRI',
        '634':'QAT','642':'ROU','643':'RUS','682':'SAU','674':'SMR','694':'SLE','703':'SVK',
        '705':'SVN','706':'SOM','710':'ZAF','724':'ESP','144':'LKA','729':'SDN','752':'SWE',
        '756':'CHE','760':'SYR','158':'TWN','762':'TJK','764':'THA','780':'TTO','788':'TUN',
        '792':'TUR','800':'UGA','804':'UKR','784':'ARE','826':'GBR','840':'USA','858':'URY',
        '862':'VEN','704':'VNM','887':'YEM','894':'ZMB','716':'ZWE','336':'VAT','492':'MCO',
      };

      function buildGeoLayer(data) {
        // data può essere GeoJSON diretto oppure TopoJSON
        let geojson = data;
        if (data.type === 'Topology') {
          // TopoJSON → GeoJSON tramite topojson-client già caricato
          const objKey = Object.keys(data.objects)[0];
          geojson = window.topojson.feature(data, data.objects[objKey]);
          // Aggiunge ISO_A3 dal numeric id
          geojson.features.forEach(f => {
            const num = String(f.id).padStart(3,'0');
            f.properties = f.properties || {};
            if (!f.properties.ISO_A3) f.properties.ISO_A3 = NUMERIC_TO_ISO3[num] || '';
          });
        }

        geoLayer = L.geoJSON(geojson, {
          style: styleForFeature,
          onEachFeature(feat, layer) {
            const iso3 = feat.properties.ISO_A3 || feat.properties.iso_a3 || feat.properties.ADM0_A3 || '';
            const iso2 = ISO3_TO_2[iso3];
            if (!iso2) return;
            layer.on({
              click(e) { L.DomEvent.stopPropagation(e); openSheet(iso2); },
              mouseover() { if (iso2 !== currentCode) layer.setStyle({ fillOpacity: isDark ? .6 : .75, weight: 1.5 }); },
              mouseout()  { if (iso2 !== currentCode) layer.setStyle(styleForFeature(feat)); },
            });
          },
        }).addTo(map);
        updateMapStyles();
      }

      // Carica TopoJSON (jsDelivr, affidabile, no CORS)
      const topoScript = document.createElement('script');
      topoScript.src = 'https://unpkg.com/topojson-client@3/dist/topojson.min.js';
      topoScript.onload = () => {
        fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
          .then(r => r.json())
          .then(buildGeoLayer)
          .catch(() => {
            // Fallback GeoJSON diretto
            fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
              .then(r => r.json())
              .then(buildGeoLayer);
          });
      };
      document.head.appendChild(topoScript);

      // Aggiorna tile per dark mode
      window._updateTileLayer = () => {
        if (isDark) {
          map.eachLayer(l => { if (l.options.id === 'light-tiles') map.removeLayer(l); });
          if (!map.hasLayer(darkTile)) darkTile.addTo(map);
        } else {
          map.eachLayer(l => { if (l.options.id === 'dark-tiles') map.removeLayer(l); });
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { id: 'light-tiles' }).addTo(map);
        }
      };
    }

    // ── Bottom Sheet ─────────────────────────────────────────────────────────
    const sheet      = document.getElementById('bottom-sheet');
    const overlay    = document.getElementById('sheet-overlay');
    const btnClose   = document.getElementById('sheet-close');
    const flagEl     = document.getElementById('sheet-flag');
    const nameEl     = document.getElementById('sheet-country-name');
    const chipsEl    = document.getElementById('sheet-chips');
    const unescoBadge= document.getElementById('unesco-badge');
    const tripsBadge = document.getElementById('trips-badge');
    const statsBadge = document.getElementById('stats-badge');

    function openSheet(iso2) {
      currentCode = iso2;
      const info = UNESCO_DATA[iso2] || { name: iso2, flag:'🌍', capital:'—', continent:'—', sites:[] };
      flagEl.textContent  = info.flag;
      nameEl.textContent  = info.name;

      chipsEl.innerHTML = `
        <div class="info-chip">🏛 <span>${info.capital}</span></div>
        <div class="info-chip">🌍 <span>${info.continent}</span></div>
        <div class="info-chip">🏛️ <span>${info.sites.length}</span> siti UNESCO</div>
      `;

      sheet.classList.add('open');
      overlay.classList.add('active');
      statsBadge.classList.add('hidden');

      updateMapStyles(); // evidenzia il paese selezionato

      // Unsub precedenti
      if (unsubCountry) unsubCountry();
      if (unsubTrips)   unsubTrips();

      // UNESCO
      unsubCountry = subscribeCountry(iso2, countryData => {
        const visited = countryData?.visitedUnescoIds || [];
        renderUnesco(info.sites, visited, iso2);
        unescoBadge.textContent = `${visited.length}/${info.sites.length}`;
      });

      // Viaggi
      unsubTrips = subscribeTrips(iso2, trips => {
        renderTrips(trips, iso2);
        tripsBadge.textContent = trips.length;
      });

      // Sposta la mappa sul paese
      if (geoLayer) {
        geoLayer.eachLayer(l => {
          const iso3 = l.feature.properties.ISO_A3 || l.feature.properties.iso_a3 || l.feature.properties.ADM0_A3;
          if (ISO3_TO_2[iso3] === iso2) {
            const bounds = l.getBounds();
            if (bounds.isValid()) map.flyToBounds(bounds, { padding: [40, 40], maxZoom: 5, duration: 0.8 });
          }
        });
      }
    }

    function closeSheet() {
      sheet.classList.remove('open');
      overlay.classList.remove('active');
      statsBadge.classList.remove('hidden');
      currentCode = null;
      if (unsubCountry) { unsubCountry(); unsubCountry = null; }
      if (unsubTrips)   { unsubTrips();   unsubTrips = null; }
      if (geoLayer) updateMapStyles();
      closeTripForm();
    }

    btnClose.addEventListener('click', closeSheet);
    overlay.addEventListener('click', closeSheet);

    // ── UNESCO render ─────────────────────────────────────────────────────────
    function renderUnesco(sites, visited, iso2) {
      const list = document.getElementById('unesco-list');
      if (!sites.length) {
        list.innerHTML = '<div style="font-size:.72rem;color:var(--muted);padding:8px 0;">Nessun sito UNESCO registrato.</div>';
        return;
      }
      list.innerHTML = sites.map(s => {
        const isChecked = visited.includes(s.id);
        return `<div class="unesco-item">
          <div class="unesco-check ${isChecked ? 'checked' : ''}" data-id="${s.id}" data-iso="${iso2}">
            ${isChecked ? '✓' : ''}
          </div>
          <div class="unesco-info">
            <div class="unesco-name">${s.name}</div>
            <div class="unesco-year">📅 Iscritto ${s.year}</div>
          </div>
        </div>`;
      }).join('');

      list.querySelectorAll('.unesco-check').forEach(el => {
        el.addEventListener('click', async () => {
          const siteId = el.dataset.id;
          const code   = el.dataset.iso;
          const info   = UNESCO_DATA[code] || { sites: [] };
          // Leggi stato corrente da Firestore tramite l'unsub attivo
          // Usiamo ottimistic UI: toggle localmente poi salviamo
          const isNow = el.classList.contains('checked');
          el.classList.toggle('checked');
          el.textContent = !isNow ? '✓' : '';

          // Ottieni lista corrente
          const allItems = list.querySelectorAll('.unesco-check');
          const newVisited = [...allItems]
            .filter(e => e.classList.contains('checked'))
            .map(e => e.dataset.id);

          await saveCountryData(code, { visitedUnescoIds: newVisited });
        });
      });
    }

    // ── Trips render ──────────────────────────────────────────────────────────
    function renderTrips(trips, iso2) {
      const list = document.getElementById('trips-list');
      if (!trips.length) {
        list.innerHTML = '<div style="font-size:.72rem;color:var(--muted);padding:4px 0 10px;">Nessun viaggio registrato.</div>';
        return;
      }
      list.innerHTML = trips.map(t => `
        <div class="trip-card" data-id="${t._docId}">
          <div class="trip-header">
            <div>
              <div class="trip-title">✈️ ${escHtml(t.title || 'Viaggio')}</div>
              ${t.dateStart ? `<div class="trip-dates">📅 ${t.dateStart}${t.dateEnd ? ' → ' + t.dateEnd : ''}</div>` : ''}
            </div>
          </div>
          ${t.notes ? `<div class="trip-notes">${escHtml(t.notes)}</div>` : ''}
          ${t.driveUrl ? `<a class="trip-drive" href="${escHtml(t.driveUrl)}" target="_blank" rel="noopener">📁 Foto su Google Drive</a>` : ''}
          <div class="trip-actions">
            <button class="btn-sm primary" data-edit="${t._docId}">✏️ Modifica</button>
            <button class="btn-sm danger" data-del="${t._docId}">🗑 Elimina</button>
          </div>
        </div>
      `).join('');

      list.querySelectorAll('[data-del]').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Eliminare questo viaggio?')) return;
          await deleteTripDoc(iso2, btn.dataset.del);
        });
      });

      list.querySelectorAll('[data-edit]').forEach(btn => {
        btn.addEventListener('click', () => {
          const trip = trips.find(t => t._docId === btn.dataset.edit);
          if (!trip) return;
          openTripForm(trip);
        });
      });
    }

    // ── Trip Form ─────────────────────────────────────────────────────────────
    const addTripBtn = document.getElementById('add-trip-btn');
    const tripForm   = document.getElementById('trip-form');
    const tfTitle    = document.getElementById('tf-title');
    const tfStart    = document.getElementById('tf-start');
    const tfEnd      = document.getElementById('tf-end');
    const tfNotes    = document.getElementById('tf-notes');
    const tfDrive    = document.getElementById('tf-drive');
    const tfSave     = document.getElementById('tf-save');
    const tfCancel   = document.getElementById('tf-cancel');

    addTripBtn.addEventListener('click', () => openTripForm(null));
    tfCancel.addEventListener('click', closeTripForm);

    function openTripForm(trip) {
      editingTripId = trip ? trip._docId : null;
      tfTitle.value = trip?.title || '';
      tfStart.value = trip?.dateStart || '';
      tfEnd.value   = trip?.dateEnd || '';
      tfNotes.value = trip?.notes || '';
      tfDrive.value = trip?.driveUrl || '';
      tfSave.textContent = trip ? 'Aggiorna Viaggio' : 'Salva Viaggio';
      tripForm.classList.add('open');
      addTripBtn.style.display = 'none';
      setTimeout(() => tfTitle.focus(), 100);
    }

    function closeTripForm() {
      tripForm.classList.remove('open');
      addTripBtn.style.display = '';
      editingTripId = null;
    }

    tfSave.addEventListener('click', async () => {
      if (!currentCode) return;
      const data = {
        title:     tfTitle.value.trim() || 'Viaggio',
        dateStart: tfStart.value || '',
        dateEnd:   tfEnd.value || '',
        notes:     tfNotes.value.trim(),
        driveUrl:  tfDrive.value.trim(),
      };
      if (editingTripId) {
        await updateTripDoc(currentCode, editingTripId, data);
      } else {
        await addTripDoc(currentCode, data);
      }
      closeTripForm();
    });

    // ── Stats globali ─────────────────────────────────────────────────────────
    let _totalTripsCount = 0;
    function updateStats(countriesData) {
      let totalUnesco = 0;
      VISITED_CODES.forEach(code => {
        const visited = countriesData[code]?.visitedUnescoIds?.length || 0;
        totalUnesco += visited;
      });
      document.getElementById('stat-countries').textContent = VISITED_CODES.length;
      document.getElementById('stat-unesco').textContent = totalUnesco;
      document.getElementById('stat-trips').textContent = _totalTripsCount;
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function escHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    waitForAuth().then(() => {
      document.body.style.visibility = '';
      initMap();

      subscribeAllCountries(data => {
        allCountriesData = data;
        updateStats(data);
      });
    });
  </script>
</body>
</html>
