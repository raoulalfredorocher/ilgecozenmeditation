    // ISO2 → coordinate centro paese per flyTo
    const CENTERS = {
      AT:[47.5,14.5],HR:[45.1,15.2],DK:[56.0,10.0],FI:[61.9,25.7],
      FR:[46.2,2.2],VA:[41.9,12.45],DE:[51.1,10.4],GR:[39.0,22.0],
      IT:[41.9,12.5],LI:[47.1,9.5],MT:[35.9,14.5],MC:[43.73,7.4],
      NL:[52.3,5.3],PL:[51.9,19.1],CZ:[49.8,15.5],TH:[15.9,100.9],
      SM:[43.94,12.46],JP:[36.2,138.3],ES:[40.5,-3.7],SE:[60.1,18.6],CH:[46.8,8.2],
    };

    // ── Leaflet ───────────────────────────────────────────────────────────────
    const map = L.map('leaflet-map', {zoomControl:true, attributionControl:false});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:18}).addTo(map);
    map.setView([30, 15], 2);

    // GeoJSON dei paesi visitati (da file locale già nel repo)
    const VISITED_ISO2 = new Set(Object.values(COUNTRIES).flatMap(c => Object.keys(c)));
    // Mappa numeric → iso2
    const NUM2ISO = {
      '040':'AT','191':'HR','208':'DK','246':'FI','250':'FR','336':'VA',
      '276':'DE','300':'GR','380':'IT','438':'LI','470':'MT','492':'MC',
      '528':'NL','616':'PL','203':'CZ','764':'TH','674':'SM','392':'JP',
      '724':'ES','752':'SE','756':'CH',
    };

    window._geoLayer = null;

    function paintGeo() {
      if (!window._geoLayer) return;
      window._geoLayer.setStyle(f => {
        const iso2 = NUM2ISO[String(f.id).padStart(3,'0')] || NUM2ISO[f.id];
        if (!iso2) return {fillOpacity:0, weight:0};
        return {
          color: isDark ? '#9DDDE8' : '#1a5f80',
          weight: 2,
          fillColor: isDark ? '#74C7E1' : '#25739E',
          fillOpacity: 0.55,
        };
      });
    }

    fetch('./countries-110m.json')
      .then(r => r.json())
      .then(topo => {
        // Converti TopoJSON → GeoJSON manualmente senza libreria
        // Usiamo solo i bounding box come cerchi — no, usiamo un approccio diverso:
        // Leaflet può leggere GeoJSON direttamente, ma il nostro file è TopoJSON.
        // Usiamo topojson-client via script tag
        const s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js';
        s.onload = () => {
          const geojson = topojson.feature(topo, topo.objects.countries);
          window._geoLayer = L.geoJSON(geojson, {
            style: f => {
              const iso2 = NUM2ISO[String(f.id).padStart(3,'0')] || NUM2ISO[f.id];
              if (!iso2) return {fillOpacity:0, weight:0.2, color:'#ccc'};
              return {
                color: isDark ? '#9DDDE8' : '#1a5f80',
                weight: 2,
                fillColor: isDark ? '#74C7E1' : '#25739E',
                fillOpacity: 0.55,
              };
            },
            onEachFeature(f, layer) {
              const iso2 = NUM2ISO[String(f.id).padStart(3,'0')] || NUM2ISO[f.id];
              if (!iso2) return;
              layer.on('click', () => {
                map.flyTo(CENTERS[iso2] || layer.getBounds().getCenter(), 5, {duration:1});
                // Scorri alla card del paese
                const card = document.getElementById('card-'+iso2);
                if (card) {
                  card.classList.add('open');
                  setTimeout(() => card.scrollIntoView({behavior:'smooth',block:'start'}), 400);
                }
              });
            }
          }).addTo(map);
        };
        document.head.appendChild(s);
      })
      .catch(() => {/* se fallisce la mappa funziona comunque senza colori */});

    // ── Render lista paesi ────────────────────────────────────────────────────
    const section = document.getElementById('countries-section');
    const unsubs = {};

    function buildCountriesList() {
      section.innerHTML = '';
      Object.entries(COUNTRIES).forEach(([continent, countries]) => {
        const block = document.createElement('div');
        block.className = 'continent-block';
        block.innerHTML = `<div class="continent-title">🌍 ${continent}</div>`;

        Object.entries(countries).forEach(([iso2, info]) => {
          const card = document.createElement('div');
          card.className = 'country-card';
          card.id = 'card-' + iso2;

          card.innerHTML = `
            <div class="country-header">
              <div class="country-flag">${info.flag}</div>
              <div class="country-name">${info.name}</div>
              <div class="country-chevron">▾</div>
            </div>
            <div class="country-body">
              <div class="section-title">🏛️ Patrimoni UNESCO <span class="section-badge" id="ub-${iso2}">0/${info.sites.length}</span></div>
              <div id="ul-${iso2}"></div>
              <div class="section-title">✈️ I Miei Viaggi <span class="section-badge" id="tb-${iso2}">0</span></div>
              <div id="tl-${iso2}"></div>
              <button class="add-trip-btn" id="atb-${iso2}">＋ Aggiungi viaggio</button>
              <div class="trip-form" id="tf-${iso2}">
                <div class="form-row"><label class="form-label">Titolo</label><input class="form-input" id="tf-title-${iso2}" type="text" placeholder="es. Giappone Aprile 2019"/></div>
                <div class="form-row form-row-2">
                  <div><label class="form-label">Inizio</label><input class="form-input" id="tf-s-${iso2}" type="date"/></div>
                  <div><label class="form-label">Fine</label><input class="form-input" id="tf-e-${iso2}" type="date"/></div>
                </div>
                <div class="form-row"><label class="form-label">Note</label><textarea class="form-textarea" id="tf-n-${iso2}" placeholder="Appunti di viaggio…"></textarea></div>
                <div class="form-row"><label class="form-label">Link Google Drive</label><input class="form-input" id="tf-d-${iso2}" type="url" placeholder="https://drive.google.com/…"/></div>
                <div class="form-btns">
                  <button class="btn-cancel" id="tf-cancel-${iso2}">Annulla</button>
                  <button class="btn-save" id="tf-save-${iso2}">Salva</button>
                </div>
              </div>
            </div>`;

          // Toggle apertura
          let editingId = null;
          card.querySelector('.country-header').addEventListener('click', () => {
            const wasOpen = card.classList.contains('open');
            card.classList.toggle('open');
            if (!wasOpen) startSubs(iso2, info);
          });

          // Fly to su mappa quando si apre
          card.querySelector('.country-header').addEventListener('click', () => {
            if (CENTERS[iso2]) map.flyTo(CENTERS[iso2], 5, {duration:1});
          });

          // Add trip
          card.querySelector(`#atb-${iso2}`).addEventListener('click', () => {
            editingId = null;
            clearForm(iso2);
            card.querySelector(`#tf-${iso2}`).classList.add('open');
            card.querySelector(`#atb-${iso2}`).style.display = 'none';
          });
          card.querySelector(`#tf-cancel-${iso2}`).addEventListener('click', () => closeForm(iso2, card));
          card.querySelector(`#tf-save-${iso2}`).addEventListener('click', async () => {
            const data = {
              title:    document.getElementById(`tf-title-${iso2}`).value.trim() || 'Viaggio',
              dateStart:document.getElementById(`tf-s-${iso2}`).value,
              dateEnd:  document.getElementById(`tf-e-${iso2}`).value,
              notes:    document.getElementById(`tf-n-${iso2}`).value.trim(),
              driveUrl: document.getElementById(`tf-d-${iso2}`).value.trim(),
            };
            if (editingId) await updateTripDoc(iso2, editingId, data);
            else           await addTripDoc(iso2, data);
            closeForm(iso2, card);
          });

          function clearForm(c) {
            ['title','s','e','n','d'].forEach(k => {
              const el = document.getElementById(`tf-${k}-${c}`);
              if (el) el.value = '';
            });
            document.getElementById(`tf-save-${c}`).textContent = 'Salva';
          }
          function closeForm(c, cd) {
            cd.querySelector(`#tf-${c}`).classList.remove('open');
            cd.querySelector(`#atb-${c}`).style.display = '';
            editingId = null;
          }

          block.appendChild(card);
        });

        section.appendChild(block);
      });
    }

    // ── Subscriptions Firebase ────────────────────────────────────────────────
    let globalUnsubs = {};
    let totalTrips = 0;

    function startSubs(iso2, info) {
      if (globalUnsubs[iso2]) return; // già attive

      globalUnsubs[iso2+'_c'] = subscribeCountry(iso2, data => {
        const visited = data?.visitedUnescoIds || [];
        renderUnesco(iso2, info.sites, visited);
        document.getElementById(`ub-${iso2}`).textContent = `${visited.length}/${info.sites.length}`;
        updateUnescoStats();
      });

      globalUnsubs[iso2+'_t'] = subscribeTrips(iso2, trips => {
        renderTrips(iso2, trips);
        document.getElementById(`tb-${iso2}`).textContent = trips.length;
        updateTripStats();
      });
    }

    function updateUnescoStats() {
      // ricalcola da DOM
      let tot = 0;
      document.querySelectorAll('.unesco-check.checked').forEach(() => tot++);
      document.getElementById('sv-unesco').textContent = tot;
    }
    function updateTripStats() {
      let tot = 0;
      document.querySelectorAll('.section-badge[id^="tb-"]').forEach(el => { tot += parseInt(el.textContent)||0; });
      document.getElementById('sv-trips').textContent = tot;
    }

    function renderUnesco(iso2, sites, visited) {
      const el = document.getElementById(`ul-${iso2}`);
      if (!el) return;
      if (!sites.length) { el.innerHTML = '<div style="font-size:.7rem;color:var(--muted);padding:6px 0">Nessun sito UNESCO registrato.</div>'; return; }
      el.innerHTML = sites.map(s => `
        <div class="unesco-item">
          <div class="unesco-check ${visited.includes(s.id)?'checked':''}" data-id="${s.id}" data-iso="${iso2}">${visited.includes(s.id)?'✓':''}</div>
          <div><div class="unesco-name">${s.name}</div><div class="unesco-year">📅 ${s.year}</div></div>
        </div>`).join('');
      el.querySelectorAll('.unesco-check').forEach(cb => {
        cb.addEventListener('click', async () => {
          cb.classList.toggle('checked');
          cb.textContent = cb.classList.contains('checked') ? '✓' : '';
          const newV = [...el.querySelectorAll('.unesco-check.checked')].map(e => e.dataset.id);
          await saveCountryData(iso2, {visitedUnescoIds: newV});
          updateUnescoStats();
        });
      });
    }

    function renderTrips(iso2, trips) {
      const el = document.getElementById(`tl-${iso2}`);
      if (!el) return;
      if (!trips.length) { el.innerHTML = '<div style="font-size:.7rem;color:var(--muted);padding:4px 0 8px">Nessun viaggio registrato.</div>'; return; }
      el.innerHTML = trips.map(t => `
        <div class="trip-card">
          <div class="trip-title">✈️ ${esc(t.title||'Viaggio')}</div>
          ${t.dateStart?`<div class="trip-dates">📅 ${t.dateStart}${t.dateEnd?' → '+t.dateEnd:''}</div>`:''}
          ${t.notes?`<div class="trip-notes">${esc(t.notes)}</div>`:''}
          ${t.driveUrl?`<a class="trip-drive" href="${esc(t.driveUrl)}" target="_blank" rel="noopener">📁 Foto su Google Drive</a>`:''}
          <div class="trip-actions">
            <button class="btn-sm primary" data-edit="${t._docId}" data-iso="${iso2}">✏️</button>
            <button class="btn-sm danger" data-del="${t._docId}" data-iso="${iso2}">🗑</button>
          </div>
        </div>`).join('');
      el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
        if (confirm('Eliminare?')) await deleteTripDoc(iso2, b.dataset.del);
      }));
      el.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => {
        const trip = trips.find(t => t._docId === b.dataset.edit);
        if (!trip) return;
        const card = document.getElementById('card-'+iso2);
        document.getElementById(`tf-title-${iso2}`).value = trip.title||'';
        document.getElementById(`tf-s-${iso2}`).value = trip.dateStart||'';
        document.getElementById(`tf-e-${iso2}`).value = trip.dateEnd||'';
        document.getElementById(`tf-n-${iso2}`).value = trip.notes||'';
        document.getElementById(`tf-d-${iso2}`).value = trip.driveUrl||'';
        document.getElementById(`tf-save-${iso2}`).textContent = 'Aggiorna';
        // editingId è nella closure del card — usiamo dataset
        b.closest('.country-body').querySelector(`#tf-save-${iso2}`).dataset.editId = trip._docId;
        card.querySelector(`#tf-${iso2}`).classList.add('open');
        card.querySelector(`#atb-${iso2}`).style.display = 'none';
      }));
    }

    function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    // ── Init ──────────────────────────────────────────────────────────────────
    waitForAuth().then(() => {
      document.body.style.visibility = '';
      buildCountriesList();
      // Pre-carica subscriptions per tutti i paesi (per stats globali)
      Object.entries(COUNTRIES).forEach(([, countries]) => {
        Object.entries(countries).forEach(([iso2, info]) => {
          startSubs(iso2, info);
        });
      });
    });
  </script>
</body>
</html>
