<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Il Geco Zen — Direzione"/>
  <meta name="theme-color" content="#FAF7F2"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" href="assets/icons/favicon-48.png"/>
  <title>Il Geco Zen — Direzione</title>
  <script src="js/ui/theme-boot.js"></script>
  <link rel="stylesheet" href="styles/tokens.css"/>
  <link rel="stylesheet" href="styles/zen.css"/>
  <style>
    /* ── Direction: minimalismo giapponese ─────────────────────────────────
       Molto vuoto, linee sottili, un solo accento (sakura) e il blu del geco.
       Ogni testo è toccabile per essere modificato: niente icone di modifica. */

    .dir-main { gap: var(--space-8); }

    /* Pezzi toccabili: testo che si modifica con un tap */
    .editable {
      display: block; width: 100%; text-align: inherit;
      background: none; border: 0; padding: 0; margin: 0; cursor: pointer;
      color: inherit; font: inherit; letter-spacing: inherit;
      border-radius: 10px;
      transition: background-color .15s;
    }
    .editable:active { background: var(--surface); }
    .editable.is-empty { color: var(--muted); opacity: .75; font-style: italic; }

    /* ── Barra della vita ── */
    .life { text-align: center; padding-top: var(--space-2); }
    .life-eyebrow { margin-bottom: var(--space-3); }
    .life-value {
      font-size: 3.25rem; font-weight: 200; letter-spacing: -.04em; line-height: 1;
      font-variant-numeric: tabular-nums; color: var(--text);
    }
    .life-value small { font-size: 1.25rem; font-weight: 300; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
    .life-note { font-size: var(--fs-xs); opacity: .8; }
    .life-sub { margin-top: var(--space-2); font-size: var(--fs-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
    .life-track {
      position: relative; height: 4px; border-radius: 2px;
      background: var(--border); margin: var(--space-6) 0 var(--space-3);
    }
    .life-fill {
      position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 2px;
      background: linear-gradient(90deg, var(--geco-sky), var(--geco-blue));
      transition: width .9s var(--ease);
    }
    .life-dot {
      position: absolute; top: 50%; left: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px;
      border-radius: 50%; background: var(--sakura); border: 3px solid var(--bg);
      box-shadow: 0 0 0 1px var(--sakura);
      transition: left .9s var(--ease);
    }
    .life-scale {
      display: flex; justify-content: space-between;
      font-size: var(--fs-xs); color: var(--muted); font-variant-numeric: tabular-nums;
    }

    /* ── Bussola dei valori ── */
    .compass-card { text-align: center; }
    .compass-card .zen-eyebrow { margin-bottom: var(--space-4); }
    .compass {
      position: relative; width: 100%; max-width: 340px; aspect-ratio: 1 / 1; margin: 0 auto;
      display: grid; grid-template: 1fr 1fr 1fr / 1fr 1fr 1fr;
    }
    .compass-rings { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .compass-rings .ring-line { fill: none; stroke: var(--border); stroke-width: .8; }
    .compass-rings .ring-soft { fill: var(--geco-mist); stroke: none; opacity: .55; }
    .compass-rings .cross { stroke: var(--border); stroke-width: .8; }
    .compass-rings .needle { fill: var(--sakura); }
    .compass-pt {
      position: relative; z-index: 1; align-self: center; justify-self: center;
      padding: var(--space-2) var(--space-3); min-width: 0; max-width: 100%;
    }
    .compass-pt.n { grid-area: 1 / 2; }
    .compass-pt.w { grid-area: 2 / 1; }
    .compass-pt.e { grid-area: 2 / 3; }
    .compass-pt.s { grid-area: 3 / 2; }
    .compass-pt .dir {
      display: block; font-size: .625rem; letter-spacing: .24em; text-transform: uppercase;
      color: var(--cat-label); margin-bottom: 2px;
    }
    .compass-pt .val {
      display: block; font-family: var(--font-serif); font-size: var(--fs-lg); font-weight: 500;
      color: var(--text); overflow-wrap: anywhere; line-height: 1.25;
    }

    .mission { margin-top: var(--space-6); padding: 0 var(--space-2); }
    .mission .zen-eyebrow { margin-bottom: var(--space-3); }
    .mission-text {
      font-family: var(--font-serif); font-style: italic; font-size: var(--fs-md);
      line-height: 1.7; color: var(--text); padding: var(--space-3) var(--space-4);
      border-left: 2px solid var(--sakura); text-align: left; border-radius: 0 12px 12px 0;
    }

    /* ── Sezioni ── */
    .sections { display: flex; flex-direction: column; gap: var(--space-3); }
    .sec { background: var(--card); border: .5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
    .sec-head {
      display: flex; align-items: center; gap: var(--space-3); width: 100%;
      padding: var(--space-4) var(--space-4) var(--space-3); background: none; border: 0; cursor: pointer; text-align: left;
    }
    .sec-head:active { background: var(--surface); }
    .sec-ico { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; flex-shrink: 0; }
    .sec-ico.blue   { background: var(--geco-mist);   color: var(--geco-blue); }
    .sec-ico.sakura { background: var(--sakura-soft); color: color-mix(in srgb, var(--sakura) 70%, var(--bark)); }
    .sec-title { flex: 1; min-width: 0; font-size: var(--fs-lg); font-weight: 600; letter-spacing: -.01em; }
    .sec-count { font-size: var(--fs-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
    .sec-chev { width: 18px; height: 18px; color: var(--muted); flex-shrink: 0; transition: transform .3s var(--ease); }
    .sec.open .sec-chev { transform: rotate(180deg); }

    .sec-goal { padding: 0 var(--space-4) var(--space-4); }
    .sec-goal .editable { padding: var(--space-2) var(--space-3); font-size: var(--fs-sm); line-height: 1.6; color: var(--muted); }
    .sec-goal .editable:not(.is-empty) { color: var(--text); }
    .sec-goal .lbl { display: block; font-size: .625rem; letter-spacing: .2em; text-transform: uppercase; color: var(--cat-label); margin-bottom: 2px; font-style: normal; }

    .sec-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s var(--ease); }
    .sec.open .sec-body { grid-template-rows: 1fr; }
    .sec-body > div { overflow: hidden; min-height: 0; }
    .area { padding: var(--space-4); border-top: .5px solid var(--border); }
    .area-name { font-size: var(--fs-md); font-weight: 600; letter-spacing: -.005em; padding: 2px var(--space-2); margin-bottom: var(--space-2); }
    .area-lbl { display: block; padding: 0 var(--space-3); font-size: .625rem; letter-spacing: .2em; text-transform: uppercase; color: var(--sakura); font-weight: 600; margin-bottom: 2px; }
    .area-text {
      font-family: var(--font-serif); font-style: italic; font-size: var(--fs-md); line-height: 1.7;
      padding: var(--space-2) var(--space-3); white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .area-text.is-empty { font-family: var(--font); font-size: var(--fs-sm); }

    .sec-actions { display: flex; gap: var(--space-2); padding: var(--space-3) var(--space-4) var(--space-4); border-top: .5px solid var(--border); background: var(--surface); }
    .sec-actions button {
      flex: 1; min-height: 38px; border-radius: 999px; border: .5px solid var(--border); background: var(--card);
      color: var(--muted); font-size: var(--fs-sm); cursor: pointer;
    }
    .sec-actions button:active { transform: scale(.97); color: var(--text); }
    .sec-actions button:disabled { opacity: .35; pointer-events: none; }

    /* ── Foglio di modifica ── */
    .edit-sheet-body { display: flex; flex-direction: column; gap: var(--space-4); }
    .edit-sheet-body textarea { min-height: 56px; }

    .dir-footer { text-align: center; font-size: var(--fs-xs); letter-spacing: .12em; color: var(--muted); }
    .dir-footer a { color: var(--geco-blue); }
  </style>
</head>
<body class="zen zen-native" data-title="Direction" data-back="index.html">
  <script type="module" src="js/core/auth-guard.js"></script>
  <script type="module" src="js/ui/shell.js"></script>

  <main class="zen-main dir-main">

    <!-- ── Barra della vita ── -->
    <section class="life" aria-label="Barra della vita">
      <div class="zen-eyebrow life-eyebrow">Barra della vita</div>
      <div class="life-value" id="life-value">0<small>%</small></div>
      <div class="life-sub" id="life-sub"></div>
      <div class="life-track" role="img" aria-label="Avanzamento della vita">
        <div class="life-fill" id="life-fill"></div>
        <div class="life-dot" id="life-dot"></div>
      </div>
      <div class="life-scale"><span>0</span><span></span><span></span><span></span></div>
    </section>

    <!-- ── Bussola dei valori ── -->
    <section class="compass-card" aria-label="Bussola dei valori">
      <div class="zen-eyebrow">Bussola dei valori</div>
      <div class="compass">
        <svg class="compass-rings" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="ring-soft" cx="50" cy="50" r="46"/>
          <circle class="ring-line" cx="50" cy="50" r="46"/>
          <circle class="ring-line" cx="50" cy="50" r="30"/>
          <line class="cross" x1="50" y1="8" x2="50" y2="92"/>
          <line class="cross" x1="8" y1="50" x2="92" y2="50"/>
          <circle class="needle" cx="50" cy="50" r="2.4"/>
        </svg>
        <button class="editable compass-pt n" type="button" data-compass="north"><span class="dir">Nord</span><span class="val" id="compass-north"></span></button>
        <button class="editable compass-pt w" type="button" data-compass="west"><span class="dir">Ovest</span><span class="val" id="compass-west"></span></button>
        <button class="editable compass-pt e" type="button" data-compass="east"><span class="dir">Est</span><span class="val" id="compass-east"></span></button>
        <button class="editable compass-pt s" type="button" data-compass="south"><span class="dir">Sud</span><span class="val" id="compass-south"></span></button>
      </div>

      <div class="mission">
        <div class="zen-eyebrow">La mia missione</div>
        <button class="editable mission-text" id="mission-text" type="button"></button>
      </div>
    </section>

    <!-- ── Sezioni (renderizzate da JS) ── -->
    <section class="zen-section" aria-label="Aree di vita">
      <div class="zen-eyebrow" style="text-align:center">Aree di vita</div>
      <div class="sections" id="sections-container"></div>
    </section>

    <div class="dir-footer">
      <a href="https://www.ilgecozen.it" target="_blank" rel="noopener">www.ilgecozen.it</a> · Il Geco Zen
    </div>
  </main>

  <!-- ── Foglio di modifica ── -->
  <div class="zen-sheet-overlay" id="edit-overlay">
    <div class="zen-sheet" role="dialog" aria-modal="true" aria-labelledby="edit-label">
      <div class="zen-sheet-handle"></div>
      <div class="zen-sheet-title" id="edit-label">Modifica</div>
      <div class="edit-sheet-body">
        <textarea class="input" id="edit-input" rows="4"></textarea>
        <div class="grid-2">
          <button class="btn" type="button" id="edit-cancel">Annulla</button>
          <button class="btn accent" type="button" id="edit-save">Salva</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { waitForAuth } from './js/core/db.js';
    import {
      doc, getDoc, setDoc,
    } from './js/core/firestore.js';
    import { db as _db, auth as _auth } from './js/core/firebase.js';
    import { icon } from './js/ui/icons.js';
    import { openSheet, closeSheet } from './js/ui/shell.js';
    import { ageFromBirth, lifeExpectancy, countryName } from './js/core/vita.js';

    function _directionDoc() {
      const uid = _auth?.currentUser?.uid;
      if (!_db || !uid) return null;
      return doc(_db, 'users', uid, 'direction', 'data');
    }

    async function _loadRemote() {
      const ref = _directionDoc();
      if (!ref) return null;
      try {
        const snap = await getDoc(ref);
        if (snap.exists()) return snap.data();
      } catch (e) { console.error('loadData error', e); }
      return null;
    }

    /** Profilo (Alimentazione): data di nascita, nazionalità e sesso per la barra della vita. */
    async function loadProfile() {
      const uid = _auth?.currentUser?.uid;
      if (!_db || !uid) return;
      try {
        const snap = await getDoc(doc(_db, 'users', uid, 'macros', 'profiles'));
        renderLife(snap.exists() ? snap.data().tdeeForm : null);
      } catch (e) { console.error('profilo', e); }
    }

    async function _saveRemote() {
      const ref = _directionDoc();
      if (!ref) return;
      try { await setDoc(ref, { sections: DATA, compass: COMPASS, mission: MISSION }); }
      catch (e) { console.error('saveData error', e); }
    }

    /* ═══════════════════════════════════════════
       BARRA DELLA VITA
       Età dalla data di nascita del profilo (Alimentazione → Il mio profilo);
       lunghezza della barra = speranza di vita del Paese e del sesso scelti nel profilo.
    ═══════════════════════════════════════════ */
    const fmt = n => n.toFixed(1).replace('.', ',');
    function renderLife(profile) {
      const val = document.getElementById('life-value'), sub = document.getElementById('life-sub');
      const track = document.querySelector('.life-track'), scale = document.querySelector('.life-scale');
      const age = ageFromBirth(profile?.nascita);
      if (!age) {
        val.innerHTML = '–<small>%</small>';
        sub.innerHTML = 'Aggiungi la tua data di nascita nel profilo per vedere la barra. <a href="alimentazione.html?profilo=1#risultati">Apri il profilo</a>';
        document.getElementById('life-fill').style.width = '0%';
        document.getElementById('life-dot').style.left = '0%';
        scale.innerHTML = '<span>0</span><span></span><span></span><span></span>';
        return;
      }
      const years = lifeExpectancy(profile.nazione, profile.sesso);
      const pct = Math.min((age / years) * 100, 100);
      val.innerHTML = `${fmt(pct)}<small>%</small>`;
      sub.innerHTML = `${fmt(age)} anni vissuti · ${fmt(Math.max(years - age, 0))} davanti a te<br><span class="life-note">Speranza di vita ${fmt(years)} anni · ${countryName(profile.nazione)}${profile.sesso === 'M' ? ', uomini' : profile.sesso === 'F' ? ', donne' : ''}</span>`;
      track.setAttribute('aria-label', `Avanzamento della vita su ${fmt(years)} anni`);
      const r = Math.round(years);
      scale.innerHTML = `<span>0</span><span>${Math.round(r / 3)}</span><span>${Math.round(r * 2 / 3)}</span><span>${r} anni</span>`;
      requestAnimationFrame(() => {
        document.getElementById('life-fill').style.width = `${pct}%`;
        document.getElementById('life-dot').style.left = `${pct}%`;
      });
    }
    renderLife(null);

    /* ═══════════════════════════════════════════
       DATI DEFAULT
    ═══════════════════════════════════════════ */
    const SEC_STYLE = {
      'sec-salute-fisica':  ['dumbbell',  'blue'],
      'sec-salute-mentale': ['flower',    'sakura'],
      'sec-relazioni':      ['heart',     'sakura'],
      'sec-contributo':     ['globe',     'blue'],
      'sec-connessione':    ['sparkles',  'blue'],
      'sec-passioni':       ['star',      'sakura'],
      'sec-note':           ['compass',   'blue'],
    };

    const DEFAULT_DATA = [
      { id: 'sec-salute-fisica', icon: '💪', title: 'Salute Fisica', goal: '', areas: [
          { name: 'Allenamento',     label: 'direction', text: '' },
          { name: 'Alimentazione',   label: 'direction', text: '' },
          { name: 'Sonno',           label: 'direction', text: '' },
          { name: 'Check-up Medico', label: 'direction', text: '' } ] },
      { id: 'sec-salute-mentale', icon: '🧘', title: 'Salute Mentale', goal: '', areas: [
          { name: 'Benessere Psicologico',   label: 'direction', text: '' },
          { name: 'Gestione delle Emozioni', label: 'direction', text: '' },
          { name: 'Journaling',              label: 'direction', text: '' } ] },
      { id: 'sec-relazioni', icon: '❤️', title: 'Relazioni', goal: '', areas: [
          { name: 'Io',              label: 'direction', text: '' },
          { name: 'Partner',         label: 'direction', text: '' },
          { name: 'Figli',           label: 'direction', text: '' },
          { name: 'Famiglia',        label: 'direction', text: '' },
          { name: 'Amici & Network', label: 'direction', text: '' } ] },
      { id: 'sec-contributo', icon: '🌍', title: 'Contributo al Mondo', goal: '', areas: [
          { name: 'Lavoro',      label: 'direction', text: '' },
          { name: 'Progetti',    label: 'direction', text: '' },
          { name: 'Finanza',     label: 'direction', text: '' },
          { name: 'Competenze',  label: 'direction', text: '' } ] },
      { id: 'sec-connessione', icon: '☯️', title: 'Connessione con il Tutto', goal: '', areas: [
          { name: 'Spiritualità', label: 'direction', text: '' },
          { name: 'Meditazione', label: 'direction', text: '' } ] },
      { id: 'sec-passioni', icon: '✨', title: 'Passioni & Anima', goal: '', areas: [
          { name: 'Nutrimento dell\'anima', label: 'direction', text: '' } ] },
      { id: 'sec-note', icon: '🔭', title: 'Note per il Futuro', goal: '', areas: [
          { name: 'Difesa del Perimetro',           label: 'memento', text: '' },
          { name: 'Non Attaccamento alla Serenità', label: 'memento', text: '' },
          { name: 'Purezza dell\'Impatto',          label: 'memento', text: '' } ] },
    ];

    const DEFAULT_COMPASS = { north: '', east: '', south: '', west: '' };
    const DEFAULT_MISSION = '';

    let DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
    let COMPASS = { ...DEFAULT_COMPASS };
    let MISSION = DEFAULT_MISSION;

    // saveData è sync per il codice di rendering, ma salva su Firestore in background
    function saveData() { _saveRemote(); }

    /* ═══════════════════════════════════════════
       FOGLIO DI MODIFICA (tocchi su qualsiasi testo)
    ═══════════════════════════════════════════ */
    const overlay    = document.getElementById('edit-overlay');
    const editLabel  = document.getElementById('edit-label');
    const editInput  = document.getElementById('edit-input');
    let _onSave = null;
    let _allowEmpty = false;

    function openEdit(label, value, { rows = 3, allowEmpty = false, onSave }) {
      editLabel.textContent = label;
      editInput.value = value;
      editInput.rows = rows;
      _onSave = onSave;
      _allowEmpty = allowEmpty;
      openSheet('edit-overlay');
      setTimeout(() => { editInput.focus(); editInput.setSelectionRange(editInput.value.length, editInput.value.length); }, 120);
    }
    function closeEdit() { closeSheet(overlay); _onSave = null; }

    document.getElementById('edit-save').addEventListener('click', () => {
      const val = editInput.value.trim();
      if (!val && !_allowEmpty) { editInput.focus(); return; }
      const cb = _onSave;
      closeEdit();
      if (cb) cb(val);
    });
    document.getElementById('edit-cancel').addEventListener('click', closeEdit);

    /* ═══════════════════════════════════════════
       BUSSOLA + MISSIONE
    ═══════════════════════════════════════════ */
    const DIR_NAMES = { north: 'Nord', east: 'Est', south: 'Sud', west: 'Ovest' };

    function renderCompass() {
      Object.entries(COMPASS).forEach(([d, v]) => {
        const el = document.getElementById(`compass-${d}`);
        if (!el) return;
        el.textContent = v || 'Aggiungi';
        el.closest('button')?.classList.toggle('is-empty', !v);
      });
      const m = document.getElementById('mission-text');
      m.textContent = MISSION || 'Tocca per scrivere la tua missione';
      m.classList.toggle('is-empty', !MISSION);
    }

    document.querySelectorAll('[data-compass]').forEach(btn => {
      btn.addEventListener('click', () => {
        const d = btn.dataset.compass;
        openEdit(`Valore · ${DIR_NAMES[d]}`, COMPASS[d], {
          rows: 1, allowEmpty: true,
          onSave: v => { COMPASS[d] = v; renderCompass(); saveData(); },
        });
      });
    });

    document.getElementById('mission-text').addEventListener('click', () => {
      openEdit('La mia missione', MISSION, {
        rows: 6, allowEmpty: true,
        onSave: v => { MISSION = v; renderCompass(); saveData(); },
      });
    });

    /* ═══════════════════════════════════════════
       SEZIONI
    ═══════════════════════════════════════════ */
    const CHEV = `<svg class="sec-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>`;

    /** Crea un testo toccabile: mostra il segnaposto in grigio se è vuoto. */
    function editable(cls, value, placeholder) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = `editable ${cls}${value ? '' : ' is-empty'}`;
      b.textContent = value || placeholder;
      return b;
    }

    function renderAll() {
      const openIds = new Set(
        [...document.querySelectorAll('.sec.open')].map(el => el.id)
      );
      const container = document.getElementById('sections-container');
      container.innerHTML = '';

      DATA.forEach((sec, si) => {
        const [ico, tone] = SEC_STYLE[sec.id] || ['circle', 'blue'];
        const wrap = document.createElement('article');
        wrap.className = 'sec' + (openIds.has(sec.id) ? ' open' : '');
        wrap.id = sec.id;

        /* Testata: tocca per aprire/chiudere */
        const head = document.createElement('button');
        head.type = 'button';
        head.className = 'sec-head';
        head.setAttribute('aria-expanded', String(openIds.has(sec.id)));
        head.innerHTML = `
          <span class="sec-ico ${tone}">${icon(ico)}</span>
          <span class="sec-title"></span>
          <span class="sec-count">${sec.areas.length}</span>
          ${CHEV}`;
        head.querySelector('.sec-title').textContent = sec.title;
        head.addEventListener('click', () => {
          const open = wrap.classList.toggle('open');
          head.setAttribute('aria-expanded', String(open));
        });

        /* Obiettivo: tocca per modificare */
        const goalWrap = document.createElement('div');
        goalWrap.className = 'sec-goal';
        const goalBtn = editable('', sec.goal, 'Tocca per aggiungere un obiettivo');
        goalBtn.insertAdjacentHTML('afterbegin', '<span class="lbl">Obiettivo</span>');
        goalBtn.addEventListener('click', () => openEdit('Obiettivo', sec.goal, {
          rows: 4, allowEmpty: true,
          onSave: v => { DATA[si].goal = v; saveData(); renderAll(); },
        }));
        goalWrap.appendChild(goalBtn);

        /* Aree */
        const body = document.createElement('div');
        body.className = 'sec-body';
        const inner = document.createElement('div');
        sec.areas.forEach((area, ai) => {
          const card = document.createElement('div');
          card.className = 'area';

          const name = editable('area-name', area.name, '');
          name.addEventListener('click', () => openEdit('Nome area', area.name, {
            rows: 1,
            onSave: v => { DATA[si].areas[ai].name = v; saveData(); renderAll(); },
          }));

          const lbl = document.createElement('span');
          lbl.className = 'area-lbl';
          lbl.textContent = area.label;

          const text = editable('area-text', area.text, 'Tocca per scrivere la tua direzione');
          text.addEventListener('click', () => openEdit(`${area.name} · ${area.label}`, area.text, {
            rows: 6, allowEmpty: true,
            onSave: v => { DATA[si].areas[ai].text = v; saveData(); renderAll(); },
          }));

          card.append(name, lbl, text);
          inner.appendChild(card);
        });

        /* Azioni sulla sezione: rinomina e sposta */
        const actions = document.createElement('div');
        actions.className = 'sec-actions';
        actions.innerHTML = `
          <button type="button" data-act="rename">Rinomina</button>
          <button type="button" data-act="up"${si === 0 ? ' disabled' : ''}>Sposta su</button>
          <button type="button" data-act="down"${si === DATA.length - 1 ? ' disabled' : ''}>Sposta giù</button>`;
        actions.addEventListener('click', e => {
          const act = e.target.closest('[data-act]')?.dataset.act;
          if (!act) return;
          if (act === 'rename') {
            openEdit('Nome sezione', sec.title, {
              rows: 1,
              onSave: v => { DATA[si].title = v; saveData(); renderAll(); },
            });
          } else {
            const to = act === 'up' ? si - 1 : si + 1;
            if (to < 0 || to >= DATA.length) return;
            [DATA[si], DATA[to]] = [DATA[to], DATA[si]];
            saveData(); renderAll();
          }
        });
        inner.appendChild(actions);
        body.appendChild(inner);

        wrap.append(head, goalWrap, body);
        container.appendChild(wrap);
      });
    }

    /* ═══════════════════════════════════════════
       INIT
    ═══════════════════════════════════════════ */
    // Per ogni sezione remota con areas:[] ripristina le aree dal DEFAULT_DATA (testo vuoto)
    function mergeDefaultAreas(remote) {
      return remote.map(sec => {
        if (!sec.areas || sec.areas.length === 0) {
          const def = DEFAULT_DATA.find(d => d.id === sec.id);
          if (def && def.areas.length > 0) {
            return { ...sec, areas: JSON.parse(JSON.stringify(def.areas)) };
          }
        }
        return sec;
      });
    }

    renderCompass();
    renderAll();

    // Attende auth, poi carica da Firestore (o usa i dati di default)
    (async () => {
      await waitForAuth();
      loadProfile();
      const remote = await _loadRemote();
      if (remote) {
        COMPASS = { ...DEFAULT_COMPASS, ...remote.compass };
        if (typeof remote.mission === 'string' && remote.mission.trim()) MISSION = remote.mission;
        if (Array.isArray(remote.sections)) {
          const merged = mergeDefaultAreas(remote.sections);
          const changed = JSON.stringify(merged) !== JSON.stringify(remote.sections);
          DATA = merged;
          if (changed) saveData();
        }
      }
      renderCompass();
      renderAll();
    })();
  </script>
</body>
</html>
