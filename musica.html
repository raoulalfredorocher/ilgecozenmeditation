<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Il Geco Zen"/>
  <meta name="theme-color" content="#FAF7F2"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" href="assets/icons/favicon-48.png"/>
  <title>Il Geco Zen — Musica</title>
  <script src="js/ui/theme-boot.js"></script>
  <link rel="stylesheet" href="styles/tokens.css"/>
  <link rel="stylesheet" href="styles/zen.css"/>
  <link rel="stylesheet" href="styles/giochi.css"/>
  <link rel="stylesheet" href="styles/musica.css"/>
</head>
<!-- Musica: brani con accordi, libreria accordi (chitarra · ukulele · piano), video e podcast, strumenti. Logica in js/pages/musica/ -->
<body class="zen zen-native" data-title="Musica" data-back="passioni.html" data-add="#mu-add">
  <script type="module" src="js/core/auth-guard.js"></script>
  <script type="module" src="js/ui/shell.js"></script>

  <main class="zen-main" style="gap:var(--space-4)">
    <div class="page-tabs">
      <div class="segmented scroll" role="group" aria-label="Sezioni">
        <button type="button" data-tab="brani" aria-pressed="true">Brani</button>
        <button type="button" data-tab="accordi" aria-pressed="false">Accordi</button>
        <button type="button" data-tab="ascolta" aria-pressed="false">Ascolta</button>
        <button type="button" data-tab="strumenti" aria-pressed="false">Strumenti</button>
      </div>
    </div>
    <section class="tab-panel" id="p-brani"></section>
    <section class="tab-panel" id="p-accordi" hidden></section>
    <section class="tab-panel" id="p-ascolta" hidden></section>
    <section class="tab-panel" id="p-strumenti" hidden></section>
    <button type="button" id="mu-add" hidden aria-hidden="true" tabindex="-1"></button>
  </main>

  <!-- Lettore dei podcast -->
  <div class="player" id="mu-player" hidden>
    <div class="pl-info"><span class="pl-t" id="pl-t"></span><span class="pl-s" id="pl-s"></span></div>
    <div class="pl-bar"><i id="pl-fill"></i></div>
    <div class="pl-btns">
      <button type="button" id="pl-back" aria-label="Indietro di 15 secondi">⟲15</button>
      <button type="button" id="pl-play" class="main" aria-label="Play o pausa">▶</button>
      <button type="button" id="pl-fwd" aria-label="Avanti di 30 secondi">30⟳</button>
      <button type="button" id="pl-close" aria-label="Chiudi">✕</button>
    </div>
    <audio id="mu-audio" preload="none"></audio>
  </div>

  <script type="module" src="js/pages/musica/main.js"></script>
</body>
</html>
