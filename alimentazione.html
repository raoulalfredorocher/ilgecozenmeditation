<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Il Geco Zen"/>
  <meta name="theme-color" content="#FAF7F2"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" href="assets/icons/favicon-48.png"/>
  <title>Il Geco Zen — Alimentazione</title>
  <script src="js/ui/theme-boot.js"></script>
  <link rel="stylesheet" href="styles/tokens.css"/>
  <link rel="stylesheet" href="styles/zen.css"/>
  <style>
    .tab-panel { display: flex; flex-direction: column; gap: var(--space-5); }
    .tab-panel[hidden] { display: none; }
  </style>
</head>
<!--
  Alimentazione: quattro schede.
    Oggi       → js/pages/alimentazione/oggi.js
    Settimana  → js/pages/alimentazione/settimana.js
    Ricette    → js/pages/alimentazione/ricette.js
    Spesa      → js/pages/alimentazione/spesa.js
  Il + della barra in basso preme #alim-add, che esegue l'azione della scheda attiva.
-->
<body class="zen zen-native" data-title="Alimentazione" data-add="#alim-add" style="visibility:hidden">
  <script type="module" src="js/core/auth-guard.js"></script>
  <template id="zen-header-actions">
    <button class="icon-btn" type="button" id="alim-more" aria-label="Altre azioni">
      <svg class="icon" aria-hidden="true"><use href="#i-more"/></svg>
    </button>
  </template>
  <script type="module" src="js/ui/shell.js"></script>

  <main class="zen-main">
    <div class="page-tabs">
      <div class="segmented" role="group" aria-label="Sezioni di Alimentazione">
        <button type="button" data-tab-btn="oggi" aria-pressed="true">Oggi</button>
        <button type="button" data-tab-btn="settimana">Settimana</button>
        <button type="button" data-tab-btn="ricette">Ricette</button>
        <button type="button" data-tab-btn="spesa">Spesa</button>
      </div>
    </div>

    <section class="tab-panel" id="tab-oggi" aria-label="Oggi"></section>
    <section class="tab-panel" id="tab-settimana" aria-label="Settimana" hidden></section>
    <section class="tab-panel" id="tab-ricette" aria-label="Ricette" hidden></section>
    <section class="tab-panel" id="tab-spesa" aria-label="Spesa" hidden></section>

    <button type="button" id="alim-add" hidden aria-hidden="true" tabindex="-1"></button>
  </main>

  <script type="module" src="js/pages/alimentazione/main.js"></script>
</body>
</html>
