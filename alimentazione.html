<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Il Geco Zen"/>
  <meta name="theme-color" content="#FAF7F2"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" href="assets/icons/favicon-48.png"/>
  <title>Il Geco Zen — Alimentazione</title>
  <script src="js/ui/theme-boot.js"></script>
  <link rel="stylesheet" href="styles/tokens.css"/>
  <link rel="stylesheet" href="styles/zen.css"/>
  <style>
    .tab-panel { display: flex; flex-direction: column; gap: var(--space-5); }
    .tab-panel[hidden] { display: none; }
    .s { font-size: var(--fs-xs); color: var(--muted); }
    .m { font-size: var(--fs-md); }
    .cap { font-size: .6875rem; letter-spacing: .2em; text-transform: uppercase; color: var(--cat-label); margin: var(--space-4) 0 var(--space-2); }
    .field-lbl { font-size: .625rem; letter-spacing: .2em; text-transform: uppercase; color: var(--cat-label); margin-bottom: var(--space-2); }
    .text-btn { background: none; border: 0; padding: 4px 2px; cursor: pointer; font-size: var(--fs-sm); color: var(--geco-blue); font-weight: 500; }
    .text-btn:active { opacity: .6; }
    .text-btn.danger { color: var(--danger); }
    .note { font-size: var(--fs-xs); color: var(--muted); line-height: 1.5; }
    .empty-line { font-size: var(--fs-sm); color: var(--muted); font-style: italic; padding: var(--space-2) 0; line-height: 1.6; }
    .chips-wrap { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .pill { height: 36px; padding: 0 var(--space-4); border-radius: 999px; cursor: pointer; background: var(--surface); border: 0; color: var(--text); font-size: var(--fs-sm); display: inline-flex; align-items: center; transition: background-color .2s, color .2s; }
    .pill:active { transform: scale(.96); }
    .pill[aria-pressed="true"] { background: var(--text); color: var(--bg); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
    .mc { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: var(--fs-xs); color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
    .mc > span::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; background: var(--c); vertical-align: 1px; }
    .back-link { align-self: flex-start; }
    .radio { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border); flex-shrink: 0; display: inline-block; position: relative; }
    .radio.on { border-color: var(--geco-blue); }
    .radio.on::after { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--geco-blue); }
    .note-box { border: 1px solid var(--border); background: var(--card); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); }
    .zen .note-box textarea { width: 100%; border: 0 !important; background: none !important; outline: none; resize: none; min-height: 0; padding: 0; border-radius: 0; font: 400 var(--fs-md)/1.6 var(--font); color: var(--text); display: block; }

    .editor { position: fixed; top: 0; left: 0; right: 0; bottom: 0; height: 100vh; height: calc(100dvh + var(--deficit, 0px)); z-index: 300; background: var(--bg); display: none; flex-direction: column; }
    .editor.on { display: flex; }
    .ed-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--space-2); padding: calc(var(--safe-top) + var(--space-2)) var(--space-5) var(--space-2); }
    .ed-bar .l { justify-self: start; } .ed-bar .r { justify-self: end; }
    .ed-bar .text-btn { padding: var(--space-3) 0; font-size: var(--fs-md); }
    .ed-date { position: relative; font-size: var(--fs-sm); color: var(--muted); padding: var(--space-3) var(--space-2); }
    .ed-date span { display: inline-block; } .ed-date span::first-letter { text-transform: uppercase; }
    .ed-date input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    .ed-date:not(.pick) input { display: none; }
    .ed-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: var(--space-4) var(--space-6) calc(var(--safe-bottom) + var(--space-8)); max-width: 640px; width: 100%; margin: 0 auto; }
    .zen input.ed-title { width: 100%; border: 0 !important; background: none !important; outline: none; border-radius: 0; padding: 0; margin: var(--space-4) 0; font: 600 1.625rem/1.3 var(--font-serif); letter-spacing: -.015em; color: var(--text); }
    .ed-title::placeholder { color: var(--muted); opacity: .6; }

    .de-sum { display: flex; flex-direction: column; gap: 2px; margin-bottom: var(--space-4); }
    .de-kcal { font-size: 2.25rem; font-weight: 200; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
    .de-meal { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-3); }
    .de-meal-head { display: flex; align-items: baseline; gap: var(--space-3); margin-bottom: var(--space-1); }
    .de-slot { font-weight: 600; font-size: var(--fs-md); }
    .de-item { display: flex; align-items: baseline; gap: var(--space-3); width: 100%; text-align: left; background: none; border: 0; border-top: .5px solid var(--border); padding: var(--space-3) 0; cursor: pointer; color: inherit; }
    .de-item:active { opacity: .6; }
    .de-name { flex: 1; min-width: 0; font-size: var(--fs-md); }
    .de-ikc { font-size: var(--fs-sm); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
    .de-addmeal { width: 100%; background: none; border: 1px dashed var(--border); border-radius: var(--radius-md); padding: var(--space-4); color: var(--muted); font-size: var(--fs-md); cursor: pointer; }
    .de-addfood { display: flex; align-items: center; justify-content: center; gap: var(--space-2); width: 100%; margin-top: var(--space-3); min-height: 44px; border: 1.5px dashed var(--geco-blue); border-radius: var(--radius-md); background: var(--geco-mist); color: var(--geco-blue); font-size: var(--fs-md); font-weight: 600; cursor: pointer; }
    .de-addfood:active { opacity: .6; }
    .de-supp { margin-top: var(--space-6); }
    .de-check { display: flex; align-items: center; gap: var(--space-2); font-size: var(--fs-sm); color: var(--muted); }

    .diet-pill { align-self: flex-start; background: var(--text); color: var(--bg); border: 0; border-radius: 999px; padding: 8px 16px; font-size: var(--fs-md); font-weight: 500; cursor: pointer; letter-spacing: -.01em; }
    .wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--space-2); align-items: end; background: var(--card); border: .5px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-3) var(--space-3); box-shadow: var(--shadow-sm); }
    .wk-col { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; cursor: pointer; padding: 0; color: inherit; justify-content: flex-end; }
    .wk-bar { display: flex; flex-direction: column; width: 100%; max-width: 30px; border-radius: 6px; overflow: hidden; transition: outline-color .2s; outline: 2px solid transparent; outline-offset: 2px; }
    .wk-bar i { display: block; }
    .wk-bar i.empty { flex: 1; background: var(--border); }
    .wk-col.sel .wk-bar { outline-color: var(--text); }
    .wk-d { font-size: var(--fs-sm); color: var(--muted); font-weight: 500; }
    .wk-d.today { color: var(--geco-blue); }
    .wk-col.sel .wk-d { color: var(--text); }
    .wk-k { font-size: .625rem; letter-spacing: -.02em; color: var(--muted); font-variant-numeric: tabular-nums; }
    .dt-day { background: var(--card); border: .5px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5); box-shadow: var(--shadow-sm); }
    .dt-dayhead { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-3); margin-bottom: var(--space-2); }
    .dt-dayname { font: 600 1.375rem/1.2 var(--font-serif); letter-spacing: -.015em; }
    .dt-meal { padding: var(--space-3) 0; border-top: .5px solid var(--border); }
    .dt-meal .row { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
    .dt-slot { font-weight: 600; font-size: var(--fs-md); }
    .dt-desc { font-size: var(--fs-sm); color: var(--muted); line-height: 1.5; margin-top: 2px; }
    .dt-supp { font-size: var(--fs-xs); color: var(--muted); font-style: italic; margin-top: var(--space-3); }

    .rs-card { background: var(--card); border: .5px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5) var(--space-5); box-shadow: var(--shadow-sm); }
    .rs-card .cap { margin-top: 0; }
    .rs-banner { background: var(--geco-mist); border-color: transparent; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
    .rs-head { font-size: 2rem; font-weight: 200; letter-spacing: -.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .rs-head .s { font-size: var(--fs-sm); letter-spacing: 0; font-weight: 400; }
    .rs-body { margin-top: var(--space-3); }
    .ch { display: block; width: 100%; height: auto; overflow: visible; }
    .ch-t { font-size: 10.5px; fill: var(--muted); font-family: var(--font); }
    .ch-big { font-size: 28px; font-weight: 200; fill: var(--text); font-family: var(--font); letter-spacing: -.02em; }
    .ch-on { font-size: 11px; fill: #fff; font-weight: 600; font-family: var(--font); }
    .ch-grid { stroke: var(--border); stroke-width: .5; }
    .ch-axis { stroke: var(--muted); stroke-width: .8; }
    .ch-track { fill: var(--border); }
    .ch-empty { stroke: var(--border); }
    .rs-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: var(--space-3); font-size: var(--fs-xs); color: var(--muted); }
    .rs-legend i { display: inline-block; width: 12px; height: 6px; border-radius: 3px; margin-right: 6px; vertical-align: 1px; }
    .rs-today { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: var(--space-4); align-items: center; }
    .rs-lines { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
    .rs-line { display: flex; align-items: baseline; gap: 8px; font-size: var(--fs-sm); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .rs-line .rv { margin-left: auto; }
    .rs-line b { font-weight: 600; }
    .rs-grams { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); margin-top: var(--space-4); }
    .rs-grams > div { display: flex; flex-direction: column; gap: 1px; }
    .rs-grams b { font-weight: 600; font-variant-numeric: tabular-nums; }
    .rs-calhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-2); }
    .rs-calhead .icon-btn .icon { width: 20px; height: 20px; }
    .rs-calhead .next .icon { transform: rotate(180deg); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 6px; text-align: center; }
    .cal-dow { font-size: .625rem; letter-spacing: .1em; color: var(--muted); padding-bottom: 4px; }
    .cal-day { position: relative; aspect-ratio: 1; width: 100%; max-width: 44px; margin: 0 auto; border-radius: 50%; border: 0; background: none; font-size: var(--fs-md); color: var(--text); cursor: pointer; font-variant-numeric: tabular-nums; }
    .cal-day:active { background: var(--surface); }
    .cal-day.has { background: var(--geco-mist); color: var(--geco-blue); font-weight: 600; }
    .cal-day.has::after { content: ''; position: absolute; left: 50%; bottom: 5px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--sakura); }
    .cal-day.today { box-shadow: inset 0 0 0 1.5px var(--text); }
    @media (max-width: 360px) { .rs-today { grid-template-columns: 1fr; } .rs-rings { max-width: 168px; margin: 0 auto; } }

    .rc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4) var(--space-3); }
    .rc-card { display: flex; flex-direction: column; gap: 4px; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; }
    .rc-card:active { opacity: .75; }
    .rc-cover { display: block; width: 100%; aspect-ratio: 1; border-radius: var(--radius-lg); overflow: hidden; }
    .rc-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .rc-tile { display: grid; place-items: center; background: color-mix(in srgb, var(--t) 82%, var(--card)); }
    .rc-tile b { font: 400 3.25rem/1 var(--font-serif); color: #fff; }
    .rc-cover.big { aspect-ratio: 4 / 3; margin-bottom: var(--space-4); }
    .rc-name { font: 500 var(--fs-lg)/1.25 var(--font-serif); letter-spacing: -.01em; margin-top: 4px; }
    .rc-title { font: 600 1.75rem/1.2 var(--font-serif); letter-spacing: -.02em; }
    .rc-macros { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); margin: var(--space-4) 0; }
    .rc-macros > div { display: flex; flex-direction: column; gap: 2px; padding: var(--space-3); background: var(--surface); border-radius: var(--radius-md); }
    .rc-macros b { font-weight: 600; font-variant-numeric: tabular-nums; }
    .rc-list { margin: 0 0 var(--space-5); padding-left: 1.1em; line-height: 1.8; }
    .rc-steps { margin: 0 0 var(--space-5); padding-left: 1.3em; line-height: 1.7; font-family: var(--font-serif); }
    .rc-steps li { margin-bottom: var(--space-3); }
    .rc-photo { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: var(--radius-lg); border: 1px dashed var(--border); background: var(--surface); color: var(--muted); cursor: pointer; overflow: hidden; padding: 0; font-size: var(--fs-sm); }
    .rc-photo.has { border-style: solid; }
    .rc-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .rc-fields { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); }
    .rc-num { display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--border); background: var(--card); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); }
    .rc-num input { width: 100%; border: 0; background: none; outline: none; padding: 0; font: 500 var(--fs-lg) var(--font); color: var(--text); font-variant-numeric: tabular-nums; }
    .rc-line { display: flex; align-items: center; gap: var(--space-2); border-bottom: .5px solid var(--border); }
    .rc-input { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: var(--space-3) 0; font: 400 var(--fs-md) var(--font); color: var(--text); }
    .rc-error { color: var(--danger); font-size: var(--fs-sm); margin-top: var(--space-3); }

    .sp-stores { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); }
    .sp-store { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); background: var(--card); border: .5px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-5) var(--space-3); cursor: pointer; color: inherit; box-shadow: var(--shadow-sm); }
    .sp-store:active { transform: scale(.97); }
    .sp-logo { width: 64px; height: 64px; border-radius: 18px; background: var(--geco-mist); color: var(--geco-blue); display: grid; place-items: center; overflow: hidden; border: 0; font-size: var(--fs-sm); cursor: pointer; }
    .sp-logo b { font: 400 1.75rem var(--font-serif); }
    .sp-logo img { width: 100%; height: 100%; object-fit: cover; }
    .sp-logo.big { width: 96px; height: 96px; margin: 0 auto; }
    .sp-sname { font: 500 var(--fs-lg) var(--font-serif); text-align: center; }
    .sp-top { display: flex; align-items: center; gap: var(--space-2); }
    .sp-title { flex: 1; text-align: center; font: 600 1.375rem var(--font-serif); letter-spacing: -.015em; }
    .sp-send { background: var(--geco-blue); color: #fff; border: 0; border-radius: 999px; padding: 12px; font-size: var(--fs-md); cursor: pointer; }
    .sp-row { gap: var(--space-3); }
    .sp-check { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--border); background: none; flex-shrink: 0; cursor: pointer; position: relative; padding: 0; }
    .sp-check[aria-pressed="true"] { background: var(--geco-blue); border-color: var(--geco-blue); }
    .sp-check[aria-pressed="true"]::after { content: ''; position: absolute; left: 7px; top: 3px; width: 6px; height: 11px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    .sp-name { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left; background: none; border: 0; padding: var(--space-1) 0; color: inherit; cursor: pointer; font-size: var(--fs-md); }
    .sp-check[aria-pressed="true"] + .sp-name > span:first-child { color: var(--muted); text-decoration: line-through; }

    /* Selettore alimenti: riepilogo del pasto + Fatto */
    .pk-head { display: flex; align-items: flex-start; gap: var(--space-3); }
    .pk-head .grow { flex: 1; min-width: 0; }
    .pk-in { font-size: var(--fs-xs); color: var(--muted); line-height: 1.5; margin-top: 2px; }


    /* Moduli (fogli): etichette sobrie, campi in coppia allineati */
    [hidden] { display: none !important; }
    .zen-sheet .field-lbl { font-size: var(--fs-sm); letter-spacing: 0; text-transform: none; color: var(--muted); font-weight: 500; margin: 0 0 6px; line-height: 1.2; }
    .zen-sheet .field { gap: 0; min-width: 0; }
    .zen-sheet .grid-2 { align-items: start; gap: var(--space-3); }
    .zen-sheet .stack { gap: var(--space-4); }
    .zen-sheet .input, .zen-sheet select, .zen-sheet textarea { width: 100%; min-height: 48px; box-sizing: border-box; }
    .zen-sheet input[type="date"] { -webkit-appearance: none; appearance: none; height: 48px; padding-top: 0; padding-bottom: 0; display: block; }
    .zen-sheet input[readonly] { color: var(--muted); }
    .zen-sheet textarea { min-height: 76px; padding-top: 12px; }
    .zen-sheet .chips-wrap { gap: 6px; }
    .zen-sheet .pill { height: 34px; padding: 0 14px; font-size: var(--fs-sm); }
    .zen-sheet .segmented > button { min-height: 38px; }
    .zen-sheet .btn.block { min-height: 48px; }

    /* Dieta: azioni del giorno e numeri della settimana */
    .dt-reg { background: var(--geco-blue); color: #fff; border: 0; border-radius: 999px; padding: 10px 16px; font-size: var(--fs-md); font-weight: 600; cursor: pointer; white-space: nowrap; box-shadow: var(--shadow-sm); }
    .dt-reg:active { transform: scale(.96); }
    .dt-reg.done { background: var(--geco-mist); color: var(--geco-blue); box-shadow: none; }
    .dt-acts { display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-2); }
    .wn-row { display: grid; grid-template-columns: 3.2rem repeat(4, minmax(0, 1fr)) 4.4rem; gap: 4px; align-items: baseline; width: 100%; background: none; border: 0; border-top: .5px solid var(--border); padding: var(--space-2) var(--space-1); color: inherit; font: inherit; text-align: left; cursor: pointer; }
    .wn-row.head { border-top: 0; cursor: default; font-size: .6875rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; padding-top: 0; }
    .wn-row.tot, .wn-row.avg { cursor: default; font-weight: 600; }
    .wn-row.avg { font-weight: 400; color: var(--muted); }
    .wn-row.sel { background: var(--surface); border-radius: var(--radius-sm, 8px); }
    .wn-d { font-size: var(--fs-sm); font-weight: 500; }
    .wn-n { font-size: var(--fs-sm); text-align: right; font-variant-numeric: tabular-nums; }
    .wn .dl.up { color: var(--warning, #D9A441); font-weight: 600; }
    .wn .dl.dn { color: var(--geco-blue); font-weight: 600; }
    .wn-adh { margin-top: var(--space-4); padding-top: var(--space-3); border-top: .5px solid var(--border); }

    /* Spesa: filtro per categoria, maniglia di trascinamento */
    .sp-cats { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--space-5)); padding: 0 var(--space-5); }
    .sp-cats::-webkit-scrollbar { display: none; }
    .sp-cats .pill { flex-shrink: 0; gap: 6px; }
    .sp-n { font-size: .6875rem; opacity: .6; font-variant-numeric: tabular-nums; }
    .sp-row { padding-left: var(--space-2); user-select: none; -webkit-user-select: none; }
    .sp-row .drag-handle { padding: 10px 6px; }
    .sp-row .drag-handle .icon { width: 18px; height: 18px; }
    .sp-row.dragging { background: var(--surface); }
    #rc-cats { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--space-5)); padding: 0 var(--space-5); }
    #rc-cats::-webkit-scrollbar { display: none; }
    #rc-cats .pill { flex-shrink: 0; }

    /* ═══ Nuovo design Geco Zen: schede sfumate con barra colorata, numeri grandi, serif ═══ */
    :root { --tn1:#25739E; --tn2:#E48AA3; --tn3:#7FAE82; --tn4:#D9A55B; }
    html[data-theme="dark"] { --tn1:#7FCDE6; --tn2:#F2A9BC; --tn3:#9CC79F; --tn4:#E6BC7C; }
    .gz { --t: var(--tn1); position: relative; overflow: hidden; border: .5px solid color-mix(in srgb, var(--t) 28%, var(--border)) !important; border-radius: var(--radius-lg) !important;
      background: linear-gradient(135deg, color-mix(in srgb, var(--t) 18%, var(--card)), color-mix(in srgb, var(--t) 3%, var(--card))) !important; box-shadow: var(--shadow-sm); }
    .gz::before { content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 4px; border-radius: 0 4px 4px 0; background: var(--t); }
