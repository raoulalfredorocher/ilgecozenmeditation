# Pubblica l'app su Firebase Hosting.
#  - push su main          → sito pubblico (canale "live")
#  - pull request su main  → anteprima temporanea con link nei commenti della PR
# Richiede il secret FIREBASE_SERVICE_ACCOUNT_ILGECOZEN_B2DF7 (vedi docs/DEPLOY.md).
name: Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Le PR da fork non hanno accesso ai secret
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      # Ogni pubblicazione ha la sua versione: il service worker svuota le copie vecchie e quelle nuove restano coerenti
      - name: Versione del service worker
        run: sed -i "s/^const VERSION = .*/const VERSION = 'geco-${GITHUB_SHA:0:8}';/" sw.js
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ILGECOZEN_B2DF7 }}
          projectId: ilgecozen-b2df7
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
