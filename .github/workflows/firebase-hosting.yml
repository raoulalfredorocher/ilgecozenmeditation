# Pubblica l'app su Firebase Hosting.
#  - push su main          → sito pubblico (canale "live")
#  - pull request su main  → anteprima temporanea con link nei commenti della PR
# Richiede il secret FIREBASE_SERVICE_ACCOUNT_ILGECOZEN_B2DF7 (vedi docs/DEPLOY.md).
name: Firebase Hosting

# Una pubblicazione alla volta (anche con quella dei prezzi)
concurrency:
  group: pubblicazione
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Le PR da fork non hanno accesso ai secret
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Prezzi freschi dentro al sito (se Yahoo non risponde resta l'ultimo file salvato)
      - run: python scripts/fetch_quotes.py
        continue-on-error: true
      # Versione del service worker = impronta del codice: le copie sul telefono si svuotano solo quando il codice cambia
      - run: ./scripts/stamp_sw.sh
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ILGECOZEN_B2DF7 }}
          projectId: ilgecozen-b2df7
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
