# Audiolibri degli appunti (Spiritualità, Allenamento, … → Appunti): un MP3 per pagina, voce neurale gratuita.
# I libri sono elencati in scripts/audiolibri.json. Quando cambiano gli appunti rigenera solo le
# pagine cambiate (scripts/audio_appunti.py), salva gli MP3 in audio/ con un commit su main e ripubblica il sito.
# Si può lanciare a mano da Actions → "Audiolibro appunti" → Run workflow.
name: Audiolibro appunti

on:
  push:
    branches: [main]
    paths:
      - 'js/**/studio-appunti.js'
      - scripts/audiolibri.json
      - scripts/testi_appunti.mjs
      - scripts/audio_appunti.py
      - .github/workflows/audio-appunti.yml
  workflow_dispatch:

concurrency:
  group: audio-appunti
  cancel-in-progress: false

jobs:
  genera:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    outputs:
      cambiato: ${{ steps.salva.outputs.cambiato }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts==7.3.1
      - run: python scripts/audio_appunti.py
      - id: salva
        run: |
          git add audio
          if git diff --cached --quiet; then echo "cambiato=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898888+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Audiolibro appunti: audio aggiornato"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          echo "cambiato=si" >> "$GITHUB_OUTPUT"

  # I commit fatti dal workflow non avviano "Firebase Hosting": si pubblica da qui
  pubblica:
    needs: genera
    if: needs.genera.outputs.cambiato == 'si'
    runs-on: ubuntu-latest
    concurrency:
      group: pubblicazione
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch_quotes.py
        continue-on-error: true
      - run: ./scripts/stamp_sw.sh
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ILGECOZEN_B2DF7 }}
          projectId: ilgecozen-b2df7
          channelId: live
