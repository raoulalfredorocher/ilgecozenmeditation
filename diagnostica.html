<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Il Geco Zen — Diagnostica</title>
  <style>
    body { font: 14px/1.5 -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; background: #f7f4f9; color: #1e2a38; }
    h1 { font-size: 18px; color: #25739E; margin: 0 0 12px; }
    .row { background: #fff; border: 1px solid #d4cee0; border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; word-break: break-all; }
    .ok { color: #2f7d4a; } .ko { color: #c04060; } .k { font-weight: 600; }
    button { font: inherit; padding: 10px 14px; border-radius: 10px; border: 1px solid #25739E; background: #25739E; color: #fff; margin: 4px 4px 12px 0; }
  </style>
</head>
<body>
  <h1>Diagnostica</h1>
  <button id="login" type="button">Accedi con Google</button>
  <button id="copy" type="button">Copia risultati</button>
  <div id="out"></div>

  <script>
    // Errori globali, registrati prima di qualunque modulo
    window.__diagErrors = [];
    addEventListener('error', e => __diagErrors.push(`errore: ${e.message} @ ${e.filename}:${e.lineno}`));
    addEventListener('unhandledrejection', e => __diagErrors.push(`promise: ${e.reason?.code || ''} ${e.reason?.message || e.reason}`));
  </script>
  <script type="module">
    const out = document.getElementById('out');
    const lines = [];
    const log = (k, v, ok) => {
      lines.push(`${k}: ${v}`);
      const d = document.createElement('div');
      d.className = 'row';
      d.innerHTML = `<span class="k"></span> <span class="${ok === false ? 'ko' : ok ? 'ok' : ''}"></span>`;
      d.children[0].textContent = k;
      d.children[1].textContent = v;
      out.append(d);
    };
    const withTimeout = (p, ms) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error(`timeout ${ms} ms`)), ms))]);

    document.getElementById('copy').onclick = () => navigator.clipboard.writeText(lines.join('\n')).then(() => alert('Copiato'));

    log('Pagina', location.href);
    log('Browser', navigator.userAgent);
    log('App installata (standalone)', String(matchMedia('(display-mode: standalone)').matches || navigator.standalone === true));
    log('IndexedDB', 'indexedDB' in window ? 'presente' : 'assente', 'indexedDB' in window);
    try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); log('localStorage', 'ok', true); }
    catch (e) { log('localStorage', e.message, false); }

    let fb, fs, authMod;
    try {
      fb = await withTimeout(import('./js/core/firebase.js'), 15000);
      log('Firebase', `progetto ${fb.app.options.projectId}, authDomain ${fb.app.options.authDomain}`, true);
    } catch (e) { log('Firebase', e.message, false); }

    if (fb) {
      authMod = await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js');
      fs = await import('https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js');

      document.getElementById('login').onclick = async () => {
        const p = new authMod.GoogleAuthProvider();
        try { await authMod.signInWithPopup(fb.auth, p); location.reload(); }
        catch (e) { log('Login popup', `${e.code} ${e.message}`, false); await authMod.signInWithRedirect(fb.auth, p); }
      };

      try { await authMod.getRedirectResult(fb.auth); } catch (e) { log('Redirect', `${e.code} ${e.message}`, false); }
      const user = await new Promise(r => { const u = authMod.onAuthStateChanged(fb.auth, x => { u(); r(x); }); });
      log('Utente', user ? `${user.email} (uid ${user.uid.slice(0, 8)}…)` : 'nessuno — premi "Accedi con Google"', !!user);

      if (user) {
        for (const col of ['bucket_list', 'libri', 'crm_contacts', 'meditation_sessions']) {
          const ref = fs.collection(fb.db, 'users', user.uid, col);
          const t0 = performance.now();
          try {
            const s = await withTimeout(fs.getDocsFromServer(ref), 15000);
            log(`Server ${col}`, `${s.size} documenti in ${Math.round(performance.now() - t0)} ms`, true);
          } catch (e) { log(`Server ${col}`, `${e.code || ''} ${e.message}`, false); }
        }
        try {
          const s = await withTimeout(new Promise((res, rej) => {
            const u = fs.onSnapshot(fs.collection(fb.db, 'users', user.uid, 'bucket_list'), snap => { u(); res(snap); }, rej);
          }), 15000);
          log('Ascolto in tempo reale (bucket_list)', `${s.size} documenti, da cache: ${s.metadata.fromCache}`, s.size > 0);
        } catch (e) { log('Ascolto in tempo reale', `${e.code || ''} ${e.message}`, false); }
      }
    }
    setTimeout(() => log('Errori della pagina', __diagErrors.length ? __diagErrors.join(' | ') : 'nessuno', !__diagErrors.length), 500);
  </script>
</body>
</html>
