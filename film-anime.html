<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Il Geco Zen"/>
  <meta name="theme-color" content="#FAF7F2"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" href="assets/icons/favicon-48.png"/>
  <title>Il Geco Zen — Film e Serie</title>
  <script src="js/ui/theme-boot.js"></script>
  <link rel="stylesheet" href="styles/tokens.css"/>
  <link rel="stylesheet" href="styles/zen.css"/>
  <style>
    .fa-panel { display: flex; flex-direction: column; gap: var(--space-4); }
    .fa-panel[hidden] { display: none; }
    .fa-tools { display: flex; flex-direction: column; gap: var(--space-3); }
    .fa-tools[hidden] { display: none; }
    .fa-search { position: relative; }
    .fa-search .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
    .fa-search .input { padding-left: 42px; border-radius: 999px; }
    .fa-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); }

    /* Locandine */
    .fa-card { position: relative; }
    .fa-card .ph { aspect-ratio: 2 / 3; border: 0; padding: 0; width: 100%; cursor: pointer; position: relative; }
    .fa-card .ph .icon { width: 34px; height: 34px; }
    .fa-card .info { border: 0; background: none; color: inherit; text-align: left; cursor: pointer; width: 100%; font: inherit; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; }
    .fa-card .meta { font-size: var(--fs-xs); color: var(--muted); display: block; }
    .fa-card.rewatch { border-color: color-mix(in srgb, var(--warning) 55%, transparent); }
    .tone-sky, .fa-card .ph.tone-sky    { background: var(--geco-mist); color: var(--geco-blue); }
    .tone-sakura, .fa-card .ph.tone-sakura { background: var(--sakura-soft); color: color-mix(in srgb, var(--sakura) 60%, var(--bark)); }
    .tone-leaf, .fa-card .ph.tone-leaf   { background: color-mix(in srgb, var(--success) 13%, var(--bg)); color: var(--success); }
    .tone-sand, .fa-card .ph.tone-sand   { background: color-mix(in srgb, var(--warning) 15%, var(--bg)); color: color-mix(in srgb, var(--warning) 75%, var(--bark)); }
    .fa-seen {
      position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; padding: 0;
      background: color-mix(in srgb, var(--card) 85%, transparent); border-color: transparent;
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    }
    .fa-seen .icon { opacity: .45; color: var(--text); }
    .fa-badge {
      position: absolute; top: 8px; left: 8px; display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px;
      border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: .02em;
      background: color-mix(in srgb, var(--warning) 22%, var(--card)); color: color-mix(in srgb, var(--warning) 75%, var(--text));
    }
    .fa-badge .icon { width: 12px; height: 12px; }

    /* Stelle */
    .fa-stars { display: inline-flex; gap: 2px; }
    .fa-star { width: 13px; height: 13px; fill: none; stroke: var(--border); stroke-width: 1.7; stroke-linejoin: round; }
    .fa-star.on { fill: var(--warning); stroke: var(--warning); }
    .fa-rate { display: flex; justify-content: center; gap: var(--space-2); }
    .fa-rate button { width: 48px; height: 48px; border: 0; background: none; padding: 0; cursor: pointer; border-radius: 50%; transition: transform .15s var(--ease); }
    .fa-rate button:active { transform: scale(.88); }
    .fa-rate .fa-star { width: 34px; height: 34px; }

    /* Visti */
    .fa-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); }
    .fa-stat { background: var(--card); border: .5px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: 2px; }
    .fa-stat b { font-size: var(--fs-xl); font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .fa-stat span { font-size: var(--fs-xs); color: var(--muted); }
    .fa-row { min-height: 92px; }
    .fa-thumb { width: 46px; height: 69px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .fa-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .fa-row .t { font-weight: 600; letter-spacing: -.01em; display: block; }
    .fa-row .m { font-size: var(--fs-xs); color: var(--muted); display: block; margin-top: 1px; }
    .fa-row .q { font-size: var(--fs-sm); color: var(--muted); font-style: italic; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; margin-top: 3px; }

    /* Streaming */
    .fa-apps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); }
    .fa-app { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-4); background: var(--card); border: .5px solid var(--border); border-radius: var(--radius-md); color: var(--text); text-decoration: none; transition: transform .15s var(--ease); }
    .fa-app:active { transform: scale(.97); }
    .fa-app .dot-icon { font-weight: 700; font-size: 1.1rem; letter-spacing: -.02em; }
    .fa-app .n { font-weight: 600; letter-spacing: -.01em; display: block; }
    .fa-app .s { font-size: var(--fs-xs); color: var(--muted); display: block; }

    /* Scheda dettaglio */
    .fa-hero { display: flex; gap: var(--space-4); }
    .fa-hero .fa-thumb { width: 96px; height: 144px; border-radius: var(--radius-sm); }
    .fa-hero .fa-thumb .icon { width: 30px; height: 30px; }
    .fa-hero h3 { font-size: var(--fs-xl); font-weight: 600; letter-spacing: -.02em; line-height: 1.25; margin: 0; }
    .fa-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--space-2); }
    .fa-view { background: var(--surface); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: 6px; }
    .fa-view .e { display: flex; justify-content: space-between; align-items: center; font-size: var(--fs-xs); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
    .fa-view q { quotes: "“" "”"; font-family: var(--font-serif); font-style: italic; line-height: 1.55; }

    /* Modulo */
    .fa-poster-pick { display: flex; gap: var(--space-4); align-items: center; cursor: pointer; }
    .fa-poster-pick .fa-thumb { width: 72px; height: 108px; border-radius: var(--radius-sm); border: 1px dashed var(--border); background: var(--surface); color: var(--muted); }
    .fa-poster-pick small { color: var(--muted); font-size: var(--fs-sm); }
    .fa-confirm-text { color: var(--muted); line-height: 1.55; text-align: center; margin-top: calc(-1 * var(--space-2)); }
  </style>
</head>
<!-- Film e serie: logica in js/pages/film-anime/main.js -->
<body class="zen zen-native" data-title="Film e serie" data-back="passioni.html" data-add="#fa-add">
  <script type="module" src="js/core/auth-guard.js"></script>
  <template id="zen-header-actions">
    <button class="icon-btn" type="button" id="fa-csv" aria-label="Esporta in CSV">
      <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>
    </button>
  </template>
  <script type="module" src="js/ui/shell.js"></script>

  <main class="zen-main">
    <div class="page-tabs">
      <div class="segmented" role="group" aria-label="Sezioni">
        <button type="button" data-tab="todo" aria-pressed="true">Da vedere</button>
        <button type="button" data-tab="done" aria-pressed="false">Visti</button>
        <button type="button" data-tab="apps" aria-pressed="false">Streaming</button>
      </div>
    </div>

    <div class="fa-tools" id="fa-tools">
      <div class="fa-search">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input class="input" type="search" id="fa-q" placeholder="Cerca un titolo" autocomplete="off" aria-label="Cerca un titolo"/>
      </div>
      <div class="chips" id="fa-types" role="group" aria-label="Tipologia"></div>
    </div>

    <section class="fa-panel" id="p-todo" aria-live="polite">
      <div class="fa-head"><span class="zen-eyebrow" id="fa-todo-count"></span></div>
      <div class="photo-grid" id="fa-grid"></div>
    </section>

    <section class="fa-panel" id="p-done" hidden aria-live="polite">
      <div class="fa-stats" id="fa-stats"></div>
      <div class="list" id="fa-done-list"></div>
    </section>

    <section class="fa-panel" id="p-apps" hidden>
      <div class="fa-head"><span class="zen-eyebrow">Dove guardare</span></div>
      <div class="fa-apps" id="fa-apps"></div>
    </section>

    <button type="button" id="fa-add" hidden aria-hidden="true" tabindex="-1"></button>
  </main>

  <script type="module" src="js/pages/film-anime/main.js"></script>
</body>
</html>
