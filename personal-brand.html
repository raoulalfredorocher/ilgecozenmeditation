<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Il Geco Zen"/>
  <meta name="theme-color" content="#FAF7F2"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" href="assets/icons/favicon-48.png"/>
  <title>Il Geco Zen — Personal brand</title>
  <script src="js/ui/theme-boot.js"></script>
  <link rel="stylesheet" href="styles/tokens.css"/>
  <link rel="stylesheet" href="styles/zen.css"/>
  <link rel="stylesheet" href="styles/personal-brand.css"/>
</head>
<!-- Personal brand: logica in js/pages/personal-brand/ (main.js, outfit.js) -->
<body class="zen zen-native" data-title="Personal brand" data-back="passioni.html" data-add="#pb-add">
  <script type="module" src="js/core/auth-guard.js"></script>
  <template id="zen-header-actions">
    <button class="icon-btn" type="button" id="pb-more" aria-label="Altre azioni">
      <svg class="icon" aria-hidden="true"><use href="#i-more"/></svg>
    </button>
  </template>
  <script type="module" src="js/ui/shell.js"></script>

  <main class="zen-main" style="gap:var(--space-4)">
    <div class="page-tabs">
      <div class="segmented" role="group" aria-label="Sezioni di Personal brand">
        <button type="button" data-tab="outfit" aria-pressed="true">Outfit</button>
        <button type="button" data-tab="guardaroba" aria-pressed="false">Guardaroba</button>
        <button type="button" data-tab="ispirazione" aria-pressed="false">Ispirazione</button>
      </div>
    </div>
    <section class="tab-panel" id="tab-outfit" aria-label="Outfit"></section>
    <section class="tab-panel" id="tab-guardaroba" aria-label="Guardaroba" hidden></section>
    <section class="tab-panel" id="tab-ispirazione" aria-label="Ispirazione" hidden></section>
    <button type="button" id="pb-add" hidden aria-hidden="true" tabindex="-1"></button>
  </main>

  <script type="module" src="js/pages/personal-brand/main.js"></script>
</body>
</html>
