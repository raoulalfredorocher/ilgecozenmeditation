<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Il Geco Zen"/>
  <meta name="theme-color" content="#FAF7F2"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" href="assets/icons/favicon-48.png"/>
  <title>Il Geco Zen — Allenamento</title>
  <script src="js/ui/theme-boot.js"></script>
  <link rel="stylesheet" href="styles/tokens.css"/>
  <link rel="stylesheet" href="styles/zen.css"/>
  <style>
    .tab-panel { display: flex; flex-direction: column; gap: var(--space-5); }
    .tab-panel[hidden] { display: none; }
    .s { font-size: var(--fs-xs); color: var(--muted); }
    .m { font-size: var(--fs-md); }
    .cap { font-size: .6875rem; letter-spacing: .2em; text-transform: uppercase; color: var(--cat-label); margin: var(--space-4) 0 var(--space-2); }
    .field-lbl { font-size: .625rem; letter-spacing: .2em; text-transform: uppercase; color: var(--cat-label); margin-bottom: var(--space-2); }
    .text-btn { background: none; border: 0; padding: 4px 2px; cursor: pointer; font-size: var(--fs-sm); color: var(--geco-blue); font-weight: 500; }
    .text-btn:active { opacity: .6; }
    .text-btn.danger { color: var(--danger); }
    .note { font-size: var(--fs-xs); color: var(--muted); line-height: 1.5; }
    .empty-line { font-size: var(--fs-sm); color: var(--muted); font-style: italic; padding: var(--space-2) 0; line-height: 1.6; }
    .chips-wrap { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .pill { height: 36px; padding: 0 var(--space-4); border-radius: 999px; cursor: pointer; background: var(--surface); border: 0; color: var(--text); font-size: var(--fs-sm); display: inline-flex; align-items: center; transition: background-color .2s, color .2s; }
    .pill:active { transform: scale(.96); }
    .pill[aria-pressed="true"] { background: var(--text); color: var(--bg); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
    .mc { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: var(--fs-xs); color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
    .mc > span::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; background: var(--c); vertical-align: 1px; }
    .back-link { align-self: flex-start; }
    .radio { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border); flex-shrink: 0; display: inline-block; position: relative; }
    .radio.on { border-color: var(--geco-blue); }
    .radio.on::after { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--geco-blue); }
    .note-box { border: 1px solid var(--border); background: var(--card); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); }
    .zen .note-box textarea { width: 100%; border: 0 !important; background: none !important; outline: none; resize: none; min-height: 0; padding: 0; border-radius: 0; font: 400 var(--fs-md)/1.6 var(--font); color: var(--text); display: block; }
    .editor { position: fixed; top: 0; left: 0; right: 0; bottom: 0; height: 100vh; height: calc(100dvh + var(--deficit, 0px)); z-index: 300; background: var(--bg); display: none; flex-direction: column; }
    .editor.on { display: flex; }
    .ed-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--space-2); padding: calc(var(--safe-top) + var(--space-2)) var(--space-5) var(--space-2); }
    .ed-bar .l { justify-self: start; } .ed-bar .r { justify-self: end; }
    .ed-bar .text-btn { padding: var(--space-3) 0; font-size: var(--fs-md); }
    .ed-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: var(--space-4) var(--space-6) calc(var(--safe-bottom) + var(--space-8)); max-width: 640px; width: 100%; margin: 0 auto; }
    .zen input.ed-title { width: 100%; border: 0 !important; background: none !important; outline: none; border-radius: 0; padding: 0; margin: var(--space-4) 0; font: 600 1.625rem/1.3 var(--font-serif); letter-spacing: -.015em; color: var(--text); }
    .de-sum { display: flex; flex-direction: column; gap: 2px; margin-bottom: var(--space-4); }
    .de-kcal { font-size: 2.25rem; font-weight: 200; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
    .de-addfood { display: flex; align-items: center; justify-content: center; gap: var(--space-2); width: 100%; margin-top: var(--space-3); min-height: 44px; border: 1.5px dashed var(--geco-blue); border-radius: var(--radius-md); background: var(--geco-mist); color: var(--geco-blue); font-size: var(--fs-md); font-weight: 600; cursor: pointer; }
    .de-addfood:active { opacity: .6; }
    .rs-card { background: var(--card); border: .5px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5) var(--space-5); box-shadow: var(--shadow-sm); }
    .rs-card .cap { margin-top: 0; }
    .rs-banner { background: var(--geco-mist); border-color: transparent; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
    .rs-head { font-size: 2rem; font-weight: 200; letter-spacing: -.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .rs-head .s { font-size: var(--fs-sm); letter-spacing: 0; font-weight: 400; }
    .rs-calhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-2); }
    .rs-calhead .icon-btn .icon { width: 20px; height: 20px; }
    .rs-calhead .next .icon { transform: rotate(180deg); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 6px; text-align: center; }
    .cal-dow { font-size: .625rem; letter-spacing: .1em; color: var(--muted); padding-bottom: 4px; }
    .cal-day { position: relative; aspect-ratio: 1; width: 100%; max-width: 44px; margin: 0 auto; border-radius: 50%; border: 0; background: none; font-size: var(--fs-md); color: var(--text); cursor: pointer; font-variant-numeric: tabular-nums; }
    .cal-day:active { background: var(--surface); }
    .cal-day.has { background: var(--geco-mist); color: var(--geco-blue); font-weight: 600; }
    .cal-day.has::after { content: ''; position: absolute; left: 50%; bottom: 5px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--sakura); }
    .cal-day.today { box-shadow: inset 0 0 0 1.5px var(--text); }

    [hidden] { display: none !important; }
    .cal-day.sel { box-shadow: inset 0 0 0 1.5px var(--geco-blue); }
    .cal-day.today.sel { box-shadow: inset 0 0 0 2px var(--text); }


    /* Moduli (fogli): etichette sobrie, campi in coppia allineati */
    .zen-sheet .field-lbl, .wk .field-lbl { font-size: var(--fs-sm); letter-spacing: 0; text-transform: none; color: var(--muted); font-weight: 500; margin: 0 0 6px; line-height: 1.2; }
    .zen-sheet .field { gap: 0; }
    .zen-sheet .grid-2 { align-items: start; gap: var(--space-3); }
    .zen-sheet .stack { gap: var(--space-4); }
    .zen-sheet .input, .zen-sheet select, .zen-sheet textarea { width: 100%; min-height: 48px; box-sizing: border-box; }
    .zen-sheet textarea { min-height: 76px; padding-top: 12px; }
    .zen-sheet .chips-wrap { gap: 6px; }
    .zen-sheet .pill { height: 34px; padding: 0 14px; font-size: var(--fs-sm); }
    .zen-sheet .segmented > button { min-height: 38px; }
    .zen-sheet .btn.block { min-height: 48px; }

    /* Schede: navigazione, righe trascinabili */
    .al-top { display: flex; align-items: center; gap: var(--space-2); }
    .al-title { flex: 1; text-align: center; font: 600 1.375rem/1.2 var(--font-serif); letter-spacing: -.015em; min-width: 0; }
    .al-title .s { font: 400 var(--fs-sm) var(--font); letter-spacing: 0; margin-top: 2px; }
    .al-row { gap: var(--space-2); padding-left: var(--space-2); user-select: none; -webkit-user-select: none; }
    .al-row .drag-handle { padding: 10px 6px; }
    .al-row .drag-handle .icon { width: 18px; height: 18px; }
    .al-row.dragging { background: var(--surface); }
    .al-main { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left; background: none; border: 0; padding: var(--space-1) 0; color: inherit; cursor: pointer; min-width: 0; }
    .al-name { font-size: var(--fs-md); font-weight: 500; }
    .al-opts { display: flex; flex-wrap: wrap; gap: 4px 14px; background: var(--surface); border: 0; border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); font-size: var(--fs-sm); color: var(--muted); cursor: pointer; text-align: left; }
    .al-opts b { color: var(--text); font-weight: 600; }
    .de-addfood { display: flex; align-items: center; justify-content: center; gap: var(--space-2); width: 100%; min-height: 44px; border: 1.5px dashed var(--geco-blue); border-radius: var(--radius-md); background: var(--geco-mist); color: var(--geco-blue); font-size: var(--fs-md); font-weight: 600; cursor: pointer; }
    .de-addfood:active { opacity: .6; }
    .al-chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--space-5)); padding: 0 var(--space-5); }
    .al-chips::-webkit-scrollbar { display: none; }
    .al-chips .pill { flex-shrink: 0; }
    .al-prev { background: var(--card); border: .5px solid var(--border); border-radius: var(--radius-md); padding: var(--space-2) var(--space-4); }
    .al-prev > div { display: flex; justify-content: space-between; gap: var(--space-3); padding: var(--space-2) 0; font-size: var(--fs-md); }
    .al-prev > div + div { border-top: .5px solid var(--border); }
    .al-prev .s { text-align: right; flex-shrink: 0; }

    /* Registro */
    .al-sess { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; background: var(--card); border: .5px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5); box-shadow: var(--shadow-sm); color: inherit; cursor: pointer; }
    .al-sess:active { transform: scale(.98); }
    .al-sess-h { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); font-size: var(--fs-lg); }
    .al-pl { font: 600 1.375rem/1.2 var(--font-serif); letter-spacing: -.015em; }
    .al-stats { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-6); margin: var(--space-3) 0; }
    .al-stats > div { display: flex; flex-direction: column; }
    .al-stats b { font-weight: 300; font-size: 1.75rem; line-height: 1.1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .al-ex { background: var(--card); border: .5px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); margin-top: var(--space-3); }
    .al-ex-h { display: flex; flex-direction: column; margin-bottom: var(--space-1); }
    .al-set { display: flex; align-items: center; gap: var(--space-3); padding: 7px 0; border-top: .5px solid var(--border); font-size: var(--fs-md); font-variant-numeric: tabular-nums; }
    .al-set .grow { flex: 1; min-width: 0; }
    .al-set-n { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: .6875rem; color: var(--muted); flex-shrink: 0; }
    .al-in { width: 64px; min-height: 36px; padding: 0 8px; text-align: center; }
    .al-photos { display: flex; gap: var(--space-2); flex-wrap: wrap; }
    .al-photo { position: relative; width: 76px; height: 76px; }
    .al-photo img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-sm); cursor: pointer; }
    .al-photo-x { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--text); color: var(--bg); font-size: 14px; line-height: 1; cursor: pointer; }
    .al-photo-add { width: 76px; height: 76px; border: 1.5px dashed var(--border); border-radius: var(--radius-sm); background: none; color: var(--muted); font-size: var(--fs-sm); cursor: pointer; }

    /* Guida all'allenamento */
    .wk-total { font: 600 var(--fs-lg) var(--font); font-variant-numeric: tabular-nums; }
    .wk-progress { height: 3px; background: var(--border); }
    .wk-progress i { display: block; height: 100%; width: 0; background: var(--geco-blue); transition: width .3s var(--ease); }
    .wk-body { display: flex; flex-direction: column; max-width: 480px; }
    .wk-center { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); text-align: center; padding-top: var(--space-2); }
    .wk-center > .btn, .wk-center > .wk-row, .wk-center > .wk-steps, .wk-center > .chips-wrap, .wk-center > .note-box { width: 100%; }
    .wk-eyebrow { font-size: .6875rem; letter-spacing: .18em; text-transform: uppercase; color: var(--cat-label); }
    .wk-h { font: 600 1.75rem/1.2 var(--font-serif); letter-spacing: -.02em; margin: 0; }
    .wk-setline { font-size: var(--fs-lg); font-weight: 600; color: var(--geco-blue); }
    .wk-target { font-size: var(--fs-xl); font-weight: 500; color: var(--text); }
    .wk-sum { font-size: var(--fs-sm); color: var(--muted); line-height: 1.6; }
    .wk-ring { position: relative; width: 240px; height: 240px; margin: var(--space-2) 0; }
    .wk-ring svg { width: 100%; height: 100%; display: block; }
    .rg-bg { fill: none; stroke: var(--border); stroke-width: 10; }
    .rg-fg { fill: none; stroke: var(--geco-blue); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
    .wk-clock { position: absolute; inset: 0; display: grid; place-items: center; font: 200 3.75rem/1 var(--font); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .wk-sub { position: absolute; left: 0; right: 0; bottom: 58px; text-align: center; font-size: var(--fs-sm); color: var(--muted); }
    .wk-steps { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
    .wk-step { background: var(--card); border: .5px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-3); box-shadow: var(--shadow-sm); }
    .wk-step .field-lbl { margin-bottom: var(--space-2); }
    .wk-step-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-1); }
    .wk-pm { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); font-size: 1.5rem; line-height: 1; color: var(--text); cursor: pointer; flex-shrink: 0; }
    .wk-pm:active { transform: scale(.9); background: var(--geco-mist); }
    .wk-val { font: 300 2rem/1 var(--font); font-variant-numeric: tabular-nums; }
    .wk-cta { min-height: 56px; font-size: var(--fs-lg); }
    .wk-links { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-1) var(--space-4); }
    .wk-links .text-btn { color: var(--muted); font-weight: 400; }
    .wk-row { display: flex; gap: var(--space-3); }
    .wk-next { font-size: var(--fs-sm); color: var(--muted); }
    .wk-next.big { font-size: var(--fs-md); color: var(--text); line-height: 1.5; }
    .wk-last { line-height: 1.5; }
    .wk-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); }
    .wk-stats > div { display: flex; flex-direction: column; }
    .wk-stats b { font-weight: 300; font-size: 2rem; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .wk-banner { position: absolute; left: var(--space-4); right: var(--space-4); top: calc(var(--safe-top) + 64px); z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); background: var(--text); color: var(--bg); border-radius: var(--radius-lg); padding: var(--space-3) var(--space-4); box-shadow: var(--shadow-md, 0 8px 24px rgba(0,0,0,.18)); font-weight: 500; }
    .wk-banner .btn { min-height: 34px; }
  </style>
</head>
<!--
  Allenamento: tre schede.
    Registro → js/pages/allenamento/registro.js   calendario delle sessioni fatte, con tutti i dati
    Schede   → js/pages/allenamento/schede.js     allenamenti → schede → esercizi (si riordinano trascinando)
    Avvia    → js/pages/allenamento/avvia.js + guida.js   la guida a tutto schermo durante l'allenamento
  Il + della barra in basso preme #al-add, che esegue l'azione della scheda attiva.
-->
<body class="zen zen-native" data-title="Allenamento" data-add="#al-add">
  <script type="module" src="js/core/auth-guard.js"></script>
  <template id="zen-header-actions">
    <button class="icon-btn" type="button" id="al-more" aria-label="Altre azioni">
      <svg class="icon" aria-hidden="true"><use href="#i-more"/></svg>
    </button>
  </template>
  <script type="module" src="js/ui/shell.js"></script>

  <main class="zen-main">
    <div class="page-tabs">
      <div class="segmented" role="group" aria-label="Sezioni di Allenamento">
        <button type="button" data-tab-btn="registro" aria-pressed="false">Registro</button>
        <button type="button" data-tab-btn="schede" aria-pressed="false">Schede</button>
        <button type="button" data-tab-btn="avvia" aria-pressed="true">Avvia</button>
      </div>
    </div>

    <section class="tab-panel" id="tab-registro" aria-label="Registro" hidden></section>
    <section class="tab-panel" id="tab-schede" aria-label="Schede" hidden></section>
    <section class="tab-panel" id="tab-avvia" aria-label="Avvia"></section>

    <button type="button" id="al-add" hidden aria-hidden="true" tabindex="-1"></button>
  </main>

  <script type="module" src="js/pages/allenamento/main.js"></script>
</body>
</html>
