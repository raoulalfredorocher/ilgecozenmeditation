<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Il Geco Zen"/>
  <meta name="theme-color" content="#FAF7F2"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" href="assets/icons/favicon-48.png"/>
  <title>Il Geco Zen — Libri e Manga</title>
  <script src="js/ui/theme-boot.js"></script>
  <link rel="stylesheet" href="styles/tokens.css"/>
  <link rel="stylesheet" href="styles/zen.css"/>
  <style>
    .fa-panel { display: flex; flex-direction: column; gap: var(--space-4); }
    .fa-panel[hidden] { display: none; }
    .fa-tools { display: flex; flex-direction: column; gap: var(--space-3); }
    .fa-tools[hidden] { display: none; }
    .fa-search { position: relative; }
    .fa-search .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
    .fa-search .input { padding-left: 42px; border-radius: 999px; }
    .fa-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
    .fa-head .btn { white-space: nowrap; flex-shrink: 0; }
    .fa-head .zen-eyebrow { white-space: nowrap; }

    /* Locandine */
    .fa-card { position: relative; }
    .fa-card .ph { aspect-ratio: 2 / 3; border: 0; padding: 0; width: 100%; cursor: pointer; position: relative; }
    .fa-card .ph .icon { width: 34px; height: 34px; }
    .fa-card .info { border: 0; background: none; color: inherit; text-align: left; cursor: pointer; width: 100%; font: inherit; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; }
    .fa-card .meta { font-size: var(--fs-xs); color: var(--muted); display: block; }
    .fa-card.rewatch { border-color: color-mix(in srgb, var(--warning) 55%, transparent); }
    .tone-sky, .fa-card .ph.tone-sky    { background: var(--geco-mist); color: var(--geco-blue); }
    .tone-sakura, .fa-card .ph.tone-sakura { background: var(--sakura-soft); color: color-mix(in srgb, var(--sakura) 60%, var(--bark)); }
    .tone-leaf, .fa-card .ph.tone-leaf   { background: color-mix(in srgb, var(--success) 13%, var(--bg)); color: var(--success); }
    .tone-sand, .fa-card .ph.tone-sand   { background: color-mix(in srgb, var(--warning) 15%, var(--bg)); color: color-mix(in srgb, var(--warning) 75%, var(--bark)); }
    .fa-seen {
      position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; padding: 0;
      background: color-mix(in srgb, var(--card) 85%, transparent); border-color: transparent;
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    }
    .fa-seen .icon { opacity: .45; color: var(--text); }
    .fa-badge {
      position: absolute; top: 8px; left: 8px; display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px;
      border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: .02em;
      background: color-mix(in srgb, var(--warning) 22%, var(--card)); color: color-mix(in srgb, var(--warning) 75%, var(--text));
    }
    .fa-badge .icon { width: 12px; height: 12px; }

    /* Stelle */
    .fa-stars { display: inline-flex; gap: 2px; }
    .fa-star { width: 13px; height: 13px; fill: none; stroke: var(--border); stroke-width: 1.7; stroke-linejoin: round; }
    .fa-star.on { fill: var(--warning); stroke: var(--warning); }
    .fa-rate { display: flex; justify-content: center; gap: var(--space-2); }
    .fa-rate button { width: 48px; height: 48px; border: 0; background: none; padding: 0; cursor: pointer; border-radius: 50%; transition: transform .15s var(--ease); }
    .fa-rate button:active { transform: scale(.88); }
    .fa-rate .fa-star { width: 34px; height: 34px; }

    /* Visti */
    .fa-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); }
    .fa-stat { background: var(--card); border: .5px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: 2px; }
    .fa-stat b { font-size: var(--fs-xl); font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .fa-stat span { font-size: var(--fs-xs); color: var(--muted); }
    .fa-row { min-height: 92px; }
    .fa-thumb { width: 46px; height: 69px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .fa-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .fa-row .t { font-weight: 600; letter-spacing: -.01em; display: block; }
    .fa-row .m { font-size: var(--fs-xs); color: var(--muted); display: block; margin-top: 1px; }
    .fa-row .q { font-size: var(--fs-sm); color: var(--muted); font-style: italic; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; margin-top: 3px; }

    /* Streaming */
    .fa-apps { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); }
    .fa-app { display: flex; flex-direction: column; gap: var(--space-4); padding: var(--space-4); background: var(--card); border: .5px solid var(--border); border-radius: var(--radius-md); color: var(--text); text-decoration: none; transition: transform .15s var(--ease); }
    .fa-app:active { transform: scale(.97); }
    .fa-app .dot-icon { font-weight: 700; font-size: 1.1rem; letter-spacing: -.02em; }
    .fa-app .n { font-weight: 600; letter-spacing: -.01em; display: block; }
    .fa-app .s { font-size: var(--fs-xs); color: var(--muted); display: block; }

    /* Scheda dettaglio */
    .fa-hero { display: flex; gap: var(--space-4); }
    .fa-hero .fa-thumb { width: 96px; height: 144px; border-radius: var(--radius-sm); }
    .fa-hero .fa-thumb .icon { width: 30px; height: 30px; }
    .fa-hero h3 { font-size: var(--fs-xl); font-weight: 600; letter-spacing: -.02em; line-height: 1.25; margin: 0; }
    .fa-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--space-2); }
    .fa-view { background: var(--surface); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); display: flex; flex-direction: column; gap: 6px; }
    .fa-view .e { display: flex; justify-content: space-between; align-items: center; font-size: var(--fs-xs); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
    .fa-view q { quotes: "“" "”"; font-family: var(--font-serif); font-style: italic; line-height: 1.55; }

    /* Modulo */
    .fa-poster-pick { display: flex; gap: var(--space-4); align-items: center; cursor: pointer; }
    .fa-poster-pick .fa-thumb { width: 72px; height: 108px; border-radius: var(--radius-sm); border: 1px dashed var(--border); background: var(--surface); color: var(--muted); }
    .fa-poster-pick small { color: var(--muted); font-size: var(--fs-sm); }

    /* Continua a guardare */
    .fa-strip { display: flex; gap: var(--space-3); overflow-x: auto; scrollbar-width: none; margin: 0 calc(-1 * var(--space-5)); padding: 2px var(--space-5); scroll-snap-type: x proximity; }
    .fa-strip::-webkit-scrollbar { display: none; }
    .fa-now { flex: 0 0 min(300px, 84%); scroll-snap-align: start; display: flex; gap: var(--space-3); padding: var(--space-3); background: var(--card); border: .5px solid var(--border); border-radius: var(--radius-md); cursor: pointer; }
    .fa-now .fa-thumb { width: 58px; height: 87px; }
    .fa-now .t { font-weight: 600; letter-spacing: -.01em; display: block; line-height: 1.3; }
    .fa-now .m { font-size: var(--fs-xs); color: var(--muted); display: block; margin: 2px 0 8px; }
    .fa-now .meter-track { height: 5px; margin-bottom: 8px; }
    .fa-now .btn { min-height: 32px; padding: 0 14px; font-size: var(--fs-sm); }
    .fa-now-wrap { display: flex; flex-direction: column; gap: var(--space-3); }

    /* Avanzamento serie */
    .fa-prog { background: var(--surface); border-radius: var(--radius-md); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
    .fa-prog-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
    .fa-step { display: inline-flex; align-items: center; gap: var(--space-2); }
    .fa-step button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--card); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; color: var(--text); }
    .fa-step button:active { transform: scale(.9); }
    .fa-step output { min-width: 28px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; font-size: var(--fs-lg); }
    .fa-prog small { color: var(--muted); font-size: var(--fs-xs); }

    /* Etichette, priorità, trama */
    .fa-prio { display: inline-flex; color: var(--warning); vertical-align: -2px; margin-right: 4px; }
    .fa-prio svg { width: 13px; height: 13px; fill: currentColor; stroke: currentColor; }
    .fa-plot { line-height: 1.6; color: var(--text); font-size: var(--fs-sm); }
    .fa-where { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .fa-where button { height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: var(--fs-sm); cursor: pointer; }
    .fa-where button.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }

    /* Ricerca online nel modulo */
    .fa-find { display: flex; flex-direction: column; gap: var(--space-2); }
    .fa-hits { background: var(--card); border: .5px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
    .fa-hits[hidden] { display: none; }
    .fa-hit { display: flex; align-items: center; gap: var(--space-3); width: 100%; padding: var(--space-2) var(--space-3); background: none; border: 0; text-align: left; cursor: pointer; color: inherit; min-height: 64px; }
    .fa-hit + .fa-hit { border-top: .5px solid var(--border); }
    .fa-hit:active { background: var(--surface); }
    .fa-hit .fa-thumb { width: 36px; height: 54px; border-radius: 8px; }
    .fa-hit .t { font-weight: 600; font-size: var(--fs-sm); display: block; }
    .fa-hit .m { font-size: var(--fs-xs); color: var(--muted); display: block; }
    .fa-hint { font-size: var(--fs-xs); color: var(--muted); line-height: 1.5; }
    .fa-hint button { background: none; border: 0; padding: 0; color: var(--primary); font: inherit; font-weight: 600; cursor: pointer; }
    .fa-ok { color: var(--success); font-size: var(--fs-sm); display: flex; align-items: center; gap: 6px; }
    .fa-ok .icon { width: 16px; height: 16px; }
    .fa-chips-sel button { display: inline-flex; align-items: center; gap: 6px; }

    /* Statistiche */
    .fa-chart { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; align-items: end; height: 130px; margin: var(--space-4) 0 var(--space-3); }
    .fa-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
    .fa-col i { display: block; width: 100%; max-width: 20px; border-radius: 6px 6px 3px 3px; background: var(--geco-mist); min-height: 3px; }
    .fa-col.top i { background: linear-gradient(var(--geco-sky), var(--geco-blue)); }
    .fa-col .n { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 12px; }
    .fa-col .l { font-size: 10px; color: var(--muted); letter-spacing: .04em; }
    .fa-note { font-size: var(--fs-sm); color: var(--muted); }
    .fa-fav { display: flex; gap: var(--space-4); align-items: center; }
    .fa-fav .fa-thumb { width: 62px; height: 93px; }
    .fa-fav .t { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -.01em; margin: 2px 0 6px; }

    /* Stasera */
    .fa-pick { display: flex; gap: var(--space-4); }
    .fa-pick .fa-thumb { width: 104px; height: 156px; border-radius: var(--radius-sm); }
    .fa-pick h3 { font-size: var(--fs-xl); font-weight: 600; letter-spacing: -.02em; line-height: 1.25; margin: 0; }
    .fa-pick p { font-size: var(--fs-sm); color: var(--muted); margin-top: var(--space-2); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.5; }
    .fa-key { display: flex; flex-direction: column; gap: var(--space-3); }
    .fa-key ol { margin: 0; padding-left: 1.2em; color: var(--muted); font-size: var(--fs-sm); line-height: 1.65; }
    .fa-key a { color: var(--primary); }
    .fa-confirm-text { color: var(--muted); line-height: 1.55; text-align: center; margin-top: calc(-1 * var(--space-2)); }
  
    /* Libri: copertine, progressi, scanner */
    .fa-card .ph.book { aspect-ratio: 2 / 3; }
    .fa-badge.buy { background: color-mix(in srgb, var(--sakura) 30%, var(--card)); color: color-mix(in srgb, var(--sakura) 40%, var(--text)); }
    .fa-now .btn + .btn { margin-left: 6px; }
    .fa-quick { display: flex; flex-wrap: wrap; gap: 6px; }
    .fa-quick button { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: var(--fs-sm); font-weight: 600; cursor: pointer; }
    .fa-quick button:active { transform: scale(.95); }
    .fa-range { width: 100%; accent-color: var(--primary); }
    .fa-bigpage { font-size: 2.2rem; font-weight: 600; letter-spacing: -.03em; text-align: center; font-variant-numeric: tabular-nums; }
    .fa-bigpage small { font-size: var(--fs-md); color: var(--muted); font-weight: 400; }
    .fa-goal { display: flex; flex-direction: column; gap: var(--space-3); }
    .fa-goal .row { justify-content: space-between; }
    .fa-scanrow { display: flex; gap: var(--space-2); }
    .fa-scanrow .btn { flex: 1; }
    .fa-buy .btn { min-height: 34px; padding: 0 12px; font-size: var(--fs-sm); }
    .fa-buy-acts { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }

    /* Scanner a schermo intero */
    .lb-scan { position: fixed; inset: 0; z-index: 9500; background: #000; color: #fff; display: flex; flex-direction: column; }
    .lb-scan video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .lb-scan-top { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: calc(var(--safe-top) + 12px) 16px 12px; background: linear-gradient(rgba(0,0,0,.65), transparent); }
    .lb-scan-top b { font-size: var(--fs-md); font-weight: 600; }
    .lb-scan-top button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.16); color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
    .lb-frame { position: relative; z-index: 1; margin: auto; width: min(78vw, 340px); height: min(34vw, 150px); border-radius: 18px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.45); border: 2px solid rgba(255,255,255,.9); }
    .lb-frame::after { content: ''; position: absolute; left: 10px; right: 10px; top: 50%; height: 2px; background: var(--sakura); border-radius: 2px; animation: lb-sweep 1.8s ease-in-out infinite alternate; }
    @keyframes lb-sweep { from { transform: translateY(-38px); opacity: .5; } to { transform: translateY(38px); opacity: 1; } }
    .lb-scan-bottom { position: relative; z-index: 2; padding: 14px 16px calc(var(--safe-bottom) + 16px); background: linear-gradient(transparent, rgba(0,0,0,.75)); display: flex; flex-direction: column; gap: 10px; }
    .lb-scan-msg { text-align: center; font-size: var(--fs-sm); min-height: 1.4em; color: rgba(255,255,255,.9); }
    .lb-scan-bottom form { display: flex; gap: 8px; }
    .lb-scan-bottom input { flex: 1; min-height: 44px; border-radius: 999px; border: 0; padding: 0 16px; font-size: 16px; background: rgba(255,255,255,.92); color: #1C3444; }
    .lb-scan-bottom button { min-height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--sakura); color: #3a1a24; font-weight: 600; font-size: var(--fs-md); cursor: pointer; }
  </style>
</head>
<!-- Libri e manga: logica in js/pages/libri-manga/main.js -->
<body class="zen zen-native" data-title="Libri e manga" data-back="passioni.html" data-add="#lb-add">
  <script type="module" src="js/core/auth-guard.js"></script>
  <template id="zen-header-actions">
    <button class="icon-btn" type="button" id="lb-csv" aria-label="Esporta in CSV">
      <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>
    </button>
  </template>
  <script type="module" src="js/ui/shell.js"></script>

  <main class="zen-main">
    <div class="page-tabs">
      <div class="segmented" role="group" aria-label="Sezioni">
        <button type="button" data-tab="todo" aria-pressed="true">Da leggere</button>
        <button type="button" data-tab="done" aria-pressed="false">Letti</button>
        <button type="button" data-tab="buy" aria-pressed="false">Da comprare</button>
      </div>
    </div>

    <div class="fa-tools" id="fa-tools">
      <div class="fa-search">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input class="input" type="search" id="fa-q" placeholder="Cerca per titolo o autore" autocomplete="off" aria-label="Cerca"/>
      </div>
      <div class="chips" id="fa-types" role="group" aria-label="Tipo"></div>
      <div class="chips" id="fa-tags" role="group" aria-label="Etichette" hidden></div>
    </div>

    <section class="fa-panel" id="p-todo" aria-live="polite">
      <div id="fa-now"></div>
      <div class="fa-head"><span class="zen-eyebrow" id="fa-todo-count"></span>
        <button type="button" class="btn sm" id="fa-tonight"><svg class="icon sm" aria-hidden="true"><use href="#i-sparkles"/></svg> Cosa leggo?</button></div>
      <div class="photo-grid" id="fa-grid"></div>
    </section>

    <section class="fa-panel" id="p-done" hidden aria-live="polite">
      <div class="segmented" id="fa-doneview" role="group" aria-label="Vista">
        <button type="button" data-view="list" aria-pressed="true">Elenco</button>
        <button type="button" data-view="stats" aria-pressed="false">Il tuo anno</button>
      </div>
      <div class="fa-panel" id="fa-listview">
        <div class="fa-stats" id="fa-stats"></div>
        <div class="list" id="fa-done-list"></div>
      </div>
      <div class="fa-panel" id="fa-statsview" hidden>
        <div class="chips" id="fa-years" role="group" aria-label="Anno"></div>
        <div class="fa-panel" id="fa-statsbody"></div>
      </div>
    </section>

    <section class="fa-panel" id="p-buy" hidden aria-live="polite">
      <div class="fa-head"><span class="zen-eyebrow" id="fa-buy-count"></span></div>
      <div class="list" id="fa-buy-list"></div>
    </section>

    <button type="button" id="lb-add" hidden aria-hidden="true" tabindex="-1"></button>
  </main>

  <script type="module" src="js/pages/libri-manga/main.js"></script>
</body>
</html>
