<!-- Logo Il Geco Zen — SVG standalone riutilizzabile -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220">

  <!-- ══ RAMO SAKURA (destra) ══ -->
  <!-- ramo principale -->
  <path d="M152 130 Q168 110 175 88 Q180 72 188 58" 
        fill="none" stroke="#8B5A6B" stroke-width="4" stroke-linecap="round"/>
  <!-- ramo secondario alto -->
  <path d="M175 88 Q185 80 198 75" 
        fill="none" stroke="#8B5A6B" stroke-width="3" stroke-linecap="round"/>
  <!-- ramo secondario basso -->
  <path d="M168 105 Q180 100 192 102" 
        fill="none" stroke="#8B5A6B" stroke-width="3" stroke-linecap="round"/>

  <!-- Fiore 1 (in alto a destra) -->
  <g transform="translate(200,70)">
    <ellipse cx="0" cy="-11" rx="7" ry="10" fill="#F5A9BC" stroke="#C97B9A" stroke-width="1.2" transform="rotate(0)"/>
    <ellipse cx="0" cy="-11" rx="7" ry="10" fill="#F5A9BC" stroke="#C97B9A" stroke-width="1.2" transform="rotate(72)"/>
    <ellipse cx="0" cy="-11" rx="7" ry="10" fill="#F5A9BC" stroke="#C97B9A" stroke-width="1.2" transform="rotate(144)"/>
    <ellipse cx="0" cy="-11" rx="7" ry="10" fill="#F5A9BC" stroke="#C97B9A" stroke-width="1.2" transform="rotate(216)"/>
    <ellipse cx="0" cy="-11" rx="7" ry="10" fill="#F5A9BC" stroke="#C97B9A" stroke-width="1.2" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="5" fill="#fde8f0" stroke="#C97B9A" stroke-width="1"/>
    <circle cx="0" cy="0" r="2" fill="#C97B9A"/>
  </g>

  <!-- Fiore 2 (medio destra) -->
  <g transform="translate(194,100)">
    <ellipse cx="0" cy="-9" rx="6" ry="8" fill="#F5A9BC" stroke="#C97B9A" stroke-width="1.2" transform="rotate(0)"/>
    <ellipse cx="0" cy="-9" rx="6" ry="8" fill="#F5A9BC" stroke="#C97B9A" stroke-width="1.2" transform="rotate(72)"/>
    <ellipse cx="0" cy="-9" rx="6" ry="8" fill="#F5A9BC" stroke="#C97B9A" stroke-width="1.2" transform="rotate(144)"/>
    <ellipse cx="0" cy="-9" rx="6" ry="8" fill="#F5A9BC" stroke="#C97B9A" stroke-width="1.2" transform="rotate(216)"/>
    <ellipse cx="0" cy="-9" rx="6" ry="8" fill="#F5A9BC" stroke="#C97B9A" stroke-width="1.2" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="4" fill="#fde8f0" stroke="#C97B9A" stroke-width="1"/>
    <circle cx="0" cy="0" r="1.8" fill="#C97B9A"/>
  </g>

  <!-- Bocciolo (in basso sul ramo) -->
  <g transform="translate(183,58)">
    <ellipse cx="0" cy="-7" rx="5" ry="7" fill="#F5A9BC" stroke="#C97B9A" stroke-width="1" transform="rotate(0)"/>
    <ellipse cx="0" cy="-7" rx="5" ry="7" fill="#F5A9BC" stroke="#C97B9A" stroke-width="1" transform="rotate(72)"/>
    <ellipse cx="0" cy="-7" rx="5" ry="7" fill="#F5A9BC" stroke="#C97B9A" stroke-width="1" transform="rotate(144)"/>
    <ellipse cx="0" cy="-7" rx="5" ry="7" fill="#F5A9BC" stroke="#C97B9A" stroke-width="1" transform="rotate(216)"/>
    <ellipse cx="0" cy="-7" rx="5" ry="7" fill="#F5A9BC" stroke="#C97B9A" stroke-width="1" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="3.5" fill="#fde8f0" stroke="#C97B9A" stroke-width="1"/>
    <circle cx="0" cy="0" r="1.5" fill="#C97B9A"/>
  </g>

  <!-- Foglioline sakura -->
  <ellipse cx="178" cy="76" rx="5" ry="8" fill="#F5A9BC" stroke="#C97B9A" stroke-width="1" transform="rotate(-30 178 76)" opacity=".7"/>
  <ellipse cx="190" cy="68" rx="5" ry="7" fill="#F5A9BC" stroke="#C97B9A" stroke-width="1" transform="rotate(15 190 68)" opacity=".6"/>

  <!-- ══ CODA ARRICCIATA (sinistra) ══ -->
  <path d="M82 148 Q55 155 45 140 Q35 125 48 115 Q60 106 68 118 Q74 128 65 132 Q58 135 55 128" 
        fill="none" stroke="#25739E" stroke-width="9" stroke-linecap="round"/>
  <!-- ombra coda -->
  <path d="M82 148 Q55 155 45 140 Q35 125 48 115 Q60 106 68 118 Q74 128 65 132 Q58 135 55 128" 
        fill="none" stroke="#1a5a7e" stroke-width="4" stroke-linecap="round" opacity=".3"/>

  <!-- ══ CORPO PRINCIPALE ══ -->
  <!-- ombra corpo -->
  <ellipse cx="120" cy="148" rx="55" ry="28" fill="#1a5a7e" opacity=".15"/>
  <!-- busto principale -->
  <ellipse cx="118" cy="128" rx="44" ry="42" fill="#5BAED4" stroke="#25739E" stroke-width="3.5"/>
  <!-- pancia chiara -->
  <ellipse cx="118" cy="132" rx="24" ry="28" fill="#A8DBF0" stroke="#5BAED4" stroke-width="1.5"/>
  <!-- riflesso luce -->
  <ellipse cx="108" cy="110" rx="10" ry="7" fill="white" opacity=".18" transform="rotate(-20 108 110)"/>

  <!-- ══ GAMBE INCROCIATE (posizione loto) ══ -->
  <!-- gamba sinistra -->
  <path d="M80 158 Q68 170 72 182 Q80 192 100 186 Q115 180 118 172" 
        fill="#5BAED4" stroke="#25739E" stroke-width="3.5"/>
  <!-- gamba destra -->
  <path d="M156 158 Q168 170 164 182 Q156 192 136 186 Q121 180 118 172" 
        fill="#5BAED4" stroke="#25739E" stroke-width="3.5"/>
  <!-- piede sinistro -->
  <ellipse cx="78" cy="184" rx="16" ry="9" fill="#5BAED4" stroke="#25739E" stroke-width="3" transform="rotate(-15 78 184)"/>
  <!-- piede destro -->
  <ellipse cx="158" cy="184" rx="16" ry="9" fill="#5BAED4" stroke="#25739E" stroke-width="3" transform="rotate(15 158 184)"/>
  <!-- dita piede sx -->
  <circle cx="65" cy="185" r="4" fill="#5BAED4" stroke="#25739E" stroke-width="2.5"/>
  <circle cx="72" cy="190" r="4" fill="#5BAED4" stroke="#25739E" stroke-width="2.5"/>
  <circle cx="80" cy="191" r="4" fill="#5BAED4" stroke="#25739E" stroke-width="2.5"/>
  <!-- dita piede dx -->
  <circle cx="171" cy="185" r="4" fill="#5BAED4" stroke="#25739E" stroke-width="2.5"/>
  <circle cx="164" cy="190" r="4" fill="#5BAED4" stroke="#25739E" stroke-width="2.5"/>
  <circle cx="156" cy="191" r="4" fill="#5BAED4" stroke="#25739E" stroke-width="2.5"/>

  <!-- ══ BRACCIA ══ -->
  <!-- braccio sinistro (a riposo sul ginocchio) -->
  <path d="M86 128 Q70 145 75 162" 
        fill="none" stroke="#5BAED4" stroke-width="16" stroke-linecap="round"/>
  <path d="M86 128 Q70 145 75 162" 
        fill="none" stroke="#25739E" stroke-width="3.5" stroke-linecap="round"/>
  <!-- mano sinistra -->
  <circle cx="76" cy="163" r="11" fill="#5BAED4" stroke="#25739E" stroke-width="3"/>
  <!-- dita sx -->
  <circle cx="67" cy="157" r="5" fill="#5BAED4" stroke="#25739E" stroke-width="2.5"/>
  <circle cx="65" cy="166" r="5" fill="#5BAED4" stroke="#25739E" stroke-width="2.5"/>
  <circle cx="70" cy="173" r="5" fill="#5BAED4" stroke="#25739E" stroke-width="2.5"/>

  <!-- braccio destro (tiene il ramo) -->
  <path d="M150 128 Q162 140 158 152" 
        fill="none" stroke="#5BAED4" stroke-width="16" stroke-linecap="round"/>
  <path d="M150 128 Q162 140 158 152" 
        fill="none" stroke="#25739E" stroke-width="3.5" stroke-linecap="round"/>
  <!-- mano destra -->
  <circle cx="158" cy="153" r="11" fill="#5BAED4" stroke="#25739E" stroke-width="3"/>
  <!-- dita dx -->
  <circle cx="167" cy="147" r="5" fill="#5BAED4" stroke="#25739E" stroke-width="2.5"/>
  <circle cx="169" cy="156" r="5" fill="#5BAED4" stroke="#25739E" stroke-width="2.5"/>
  <circle cx="164" cy="163" r="5" fill="#5BAED4" stroke="#25739E" stroke-width="2.5"/>

  <!-- ══ TESTA ══ -->
  <!-- collo -->
  <ellipse cx="118" cy="94" rx="22" ry="12" fill="#5BAED4" stroke="#25739E" stroke-width="3"/>
  <!-- testa principale -->
  <ellipse cx="118" cy="72" rx="38" ry="34" fill="#5BAED4" stroke="#25739E" stroke-width="3.5"/>
  <!-- guance -->
  <ellipse cx="95" cy="80" rx="12" ry="8" fill="#A8DBF0" opacity=".5"/>
  <ellipse cx="141" cy="80" rx="12" ry="8" fill="#A8DBF0" opacity=".5"/>
  <!-- fronte riflesso -->
  <ellipse cx="110" cy="56" rx="14" ry="9" fill="white" opacity=".15" transform="rotate(-15 110 56)"/>

  <!-- cresta/spine sulla testa -->
  <path d="M96 46 Q100 34 104 46" fill="#25739E" stroke="#25739E" stroke-width="1"/>
  <path d="M108 42 Q112 28 116 42" fill="#25739E" stroke="#25739E" stroke-width="1"/>
  <path d="M120 42 Q124 28 128 42" fill="#25739E" stroke="#25739E" stroke-width="1"/>
  <path d="M132 44 Q136 34 140 46" fill="#25739E" stroke="#25739E" stroke-width="1"/>

  <!-- ══ FACCIA ══ -->
  <!-- occhi chiusi (archi) - espressione serena -->
  <path d="M101 70 Q108 64 115 70" fill="none" stroke="#25739E" stroke-width="3" stroke-linecap="round"/>
  <path d="M121 70 Q128 64 135 70" fill="none" stroke="#25739E" stroke-width="3" stroke-linecap="round"/>
  <!-- sopracciglia lievi -->
  <path d="M100 64 Q108 60 115 63" fill="none" stroke="#25739E" stroke-width="2" stroke-linecap="round" opacity=".6"/>
  <path d="M121 63 Q128 60 136 64" fill="none" stroke="#25739E" stroke-width="2" stroke-linecap="round" opacity=".6"/>
  <!-- naso (due puntini) -->
  <circle cx="113" cy="78" r="2.5" fill="#25739E"/>
  <circle cx="123" cy="78" r="2.5" fill="#25739E"/>
  <!-- sorriso ampio e sereno -->
  <path d="M100 86 Q118 100 136 86" fill="none" stroke="#25739E" stroke-width="3" stroke-linecap="round"/>
  <!-- lineette angoli bocca -->
  <path d="M100 86 Q97 82 100 79" fill="none" stroke="#25739E" stroke-width="2" stroke-linecap="round"/>
  <path d="M136 86 Q139 82 136 79" fill="none" stroke="#25739E" stroke-width="2" stroke-linecap="round"/>

  <!-- ══ PUNTINI CORPO ══ -->
  <circle cx="102" cy="118" r="4" fill="#A8DBF0" opacity=".8"/>
  <circle cx="118" cy="112" r="3.5" fill="#A8DBF0" opacity=".8"/>
  <circle cx="134" cy="118" r="4" fill="#A8DBF0" opacity=".8"/>
  <circle cx="108" cy="140" r="3" fill="#A8DBF0" opacity=".6"/>
  <circle cx="128" cy="140" r="3" fill="#A8DBF0" opacity=".6"/>

  <!-- ══ SCRITTA "IL GECO ZEN" ══ -->
  <text x="118" y="212" 
        font-family="-apple-system, 'Arial Rounded MT Bold', Arial, sans-serif" 
        font-size="22" font-weight="800" 
        fill="#25739E" 
        text-anchor="middle" 
        letter-spacing="2">IL GECO ZEN</text>

</svg>
