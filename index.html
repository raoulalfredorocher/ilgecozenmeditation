<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Il Geco Zen"/>
  <meta name="theme-color" content="#f0ebe0"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="Logo Trasparente.png"/>
  <link rel="icon" type="image/png" href="Logo Trasparente.png"/>
  <title>Il Geco Zen</title>
  <link rel="stylesheet" href="styles/theme.css"/>
  <link rel="stylesheet" href="styles/layout.css"/>
  <link rel="stylesheet" href="styles/timer.css"/>
</head>
<body>

  <div id="bell-flash"></div>

  <div id="done-overlay">
    <div class="done-kanji">禅</div>
    <div class="done-text">Sessione completata</div>
    <div class="done-sub">三度の鐘 — tre rintocchi</div>
    <button class="btn-done" id="btn-done-back">nuova sessione</button>
  </div>

  <header>
    <div style="width:52px"></div>
    <div class="header-center">
      <div class="app-title">Il Geco Zen</div>
      <div class="app-sub">timer di meditazione</div>
    </div>
    <button class="theme-toggle" id="theme-toggle" aria-label="Cambia tema">
      <div class="knob" id="theme-knob">☀️</div>
    </button>
  </header>

  <!-- SCHERMATA HOME / CONFIGURAZIONE -->
  <div class="screen active" id="screen-config">

    <div class="picker-section">
      <div class="picker-label">seleziona minuti</div>
      <div class="picker-wrap" id="picker-wrap">
        <div class="picker-highlight"></div>
        <div class="picker-drum" id="picker-drum"></div>
      </div>
    </div>

    <button class="btn-add-step" id="btn-add">＋ aggiungi intervallo</button>

    <div class="config-steps" id="config-steps">
      <div class="empty-steps" id="empty-steps">nessun intervallo aggiunto</div>
    </div>

    <div class="section-title">sequenze salvate</div>
    <div class="preset-grid" id="preset-grid"></div>

    <input class="save-input" id="preset-name" type="text" placeholder="nome sequenza da salvare…" maxlength="28"/>
    <button class="btn-save-preset" id="btn-save-preset">♥ salva sequenza corrente</button>

  </div>

  <!-- SCHERMATA TIMER -->
  <div class="screen" id="screen-timer">

    <div class="timer-steps-row" id="timer-steps-row"></div>

    <div id="clock-wrap">
      <svg id="ring-svg" viewBox="0 0 240 240">
        <circle id="ring-bg"   cx="120" cy="120" r="104"/>
        <circle id="ring-fill" cx="120" cy="120" r="104"/>
      </svg>
      <div id="clock-step-name"></div>
      <div id="clock-time">00:00</div>
      <div id="clock-min-label"></div>
    </div>

    <div class="timer-btns">
      <button class="btn-timer" id="btn-stop">■ stop</button>
      <button class="btn-timer" id="btn-reset">reset</button>
      <button class="btn-timer primary" id="btn-start">avvia</button>
    </div>

    <div class="nature-section">
      <div class="nature-label">suono di sottofondo</div>

      <div class="nature-cat-label">— silenzio</div>
      <div class="nature-btns">
        <button class="btn-nature active" data-sound="silence">🤫 silenzio</button>
      </div>

      <div class="nature-cat-label">— elementi naturali</div>
      <div class="nature-btns">
        <button class="btn-nature" data-sound="rain">🌧 pioggia</button>
        <button class="btn-nature" data-sound="sea">🌊 mare</button>
        <button class="btn-nature" data-sound="wind">🍃 vento</button>
        <button class="btn-nature" data-sound="stream">💧 ruscello</button>
        <button class="btn-nature" data-sound="thunder">⚡ tuono</button>
        <button class="btn-nature" data-sound="fire">🔥 camino</button>
        <button class="btn-nature" data-sound="leaves">🍂 foglie</button>
        <button class="btn-nature" data-sound="ice">🧊 ghiaccio</button>
      </div>

      <div class="nature-cat-label">— animali</div>
      <div class="nature-btns">
        <button class="btn-nature" data-sound="birds">🐦 uccelli</button>
        <button class="btn-nature" data-sound="crickets">🦗 grilli</button>
        <button class="btn-nature" data-sound="frogs">🐸 rane</button>
        <button class="btn-nature" data-sound="bees">🐝 api</button>
        <button class="btn-nature" data-sound="wolf">🐺 lupo</button>
      </div>
    </div>

    <button class="btn-back" id="btn-back">← modifica sequenza</button>

  </div>

  <!-- SCHERMATA CRONOLOGIA -->
  <div class="screen" id="screen-history">

    <div class="history-calendar" id="history-calendar">
      <!-- generato da JS -->
    </div>

    <div class="history-month-label" id="history-month-label"></div>

    <div class="history-list" id="history-list">
      <!-- generato da JS -->
    </div>

  </div>

  <!-- TAB BAR FISSA -->
  <nav class="tab-bar" id="tab-bar">
    <button class="tab-btn" id="tab-history" aria-label="Cronologia">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
        <circle cx="8" cy="15" r=".8" fill="currentColor"/>
        <circle cx="12" cy="15" r=".8" fill="currentColor"/>
        <circle cx="16" cy="15" r=".8" fill="currentColor"/>
      </svg>
      <span class="tab-label">cronologia</span>
    </button>

    <button class="tab-btn tab-center" id="tab-avvia" aria-label="Avvia pratica">
      <div class="tab-center-circle">
        <svg class="tab-center-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5,3 19,12 5,21" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <span class="tab-label">avvia pratica</span>
    </button>

    <button class="tab-btn tab-active" id="tab-home" aria-label="Home">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
        <polyline points="9,21 9,13 15,13 15,21"/>
      </svg>
      <span class="tab-label">home</span>
    </button>
  </nav>

  <footer>Made with IBM Bob</footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
