<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Il Geco Zen — Spiritualità"/>
  <meta name="theme-color" content="#FAF7F2"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" href="assets/icons/favicon-48.png"/>
  <title>Il Geco Zen — Spiritualità</title>
  <script src="js/ui/theme-boot.js"></script>
  <link rel="stylesheet" href="styles/tokens.css"/>
  <link rel="stylesheet" href="styles/zen.css"/>
  <style>
    /* ── Spiritualità: pratica, calendario ─────────────────────────────────
       Colori dei tipi di intervallo: blu = seduta, sakura = camminata,
       corteccia = mantra, grigio = pausa. */
    .med-main { gap: var(--space-6); }
    .k-med    { --k: var(--geco-blue); }
    .k-walk   { --k: var(--sakura); }
    .k-mantra { --k: var(--bark); }
    .k-rest   { --k: var(--border); }

    /* Selettore delle due schermate, fisso sotto il titolo */
    .seg-wrap {
      position: sticky; top: calc(var(--safe-top) + var(--header-h)); z-index: 50;
      margin: calc(-1 * var(--space-2)) 0 0; padding: var(--space-2) 0;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
    }
    .view { display: flex; flex-direction: column; gap: var(--space-6); }
    .view[hidden] { display: none !important; }

    .block-title { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); }
    .block-title .zen-eyebrow { margin: 0; }
    .text-btn {
      background: none; border: 0; padding: 4px 2px; cursor: pointer;
      font-size: var(--fs-sm); color: var(--geco-blue); font-weight: 500;
    }
    .text-btn:active { opacity: .6; }
    .text-btn.danger { color: var(--danger); }

    /* Barretta a segmenti proporzionali: la forma della pratica */
    .bar { display: flex; gap: 3px; height: 6px; width: 100%; }
    .bar i { display: block; border-radius: 3px; background: var(--k, var(--geco-blue)); min-width: 6px; }
    .bar.thin { height: 4px; gap: 2px; }

    /* ── Template: carte che scorrono in orizzontale ── */
    .tpl-row {
      display: flex; gap: var(--space-3); overflow-x: auto; scrollbar-width: none;
      margin: 0 calc(-1 * var(--space-5)); padding: 2px var(--space-5) var(--space-2);
      scroll-snap-type: x proximity;
    }
    .tpl-row::-webkit-scrollbar { display: none; }
    .tpl {
      flex: 0 0 168px; scroll-snap-align: start; text-align: left; cursor: pointer;
      background: var(--card); border: .5px solid var(--border); border-radius: var(--radius-md);
      padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3);
      box-shadow: var(--shadow-sm); transition: transform .15s var(--ease), border-color .2s;
    }
    .tpl:active { transform: scale(.97); }
    .tpl[aria-pressed="true"] { border-color: var(--geco-blue); }
    .tpl-name { font-size: var(--fs-md); font-weight: 600; letter-spacing: -.01em; line-height: 1.25; min-height: 2.5em; }
    .tpl-meta { font-size: var(--fs-xs); color: var(--muted); font-variant-numeric: tabular-nums; }

    /* ── Scelte ── */
    .pill {
      height: 38px; padding: 0 var(--space-4); border-radius: 999px; cursor: pointer;
      background: var(--surface); border: 0; color: var(--text); font-size: var(--fs-sm);
      display: inline-flex; align-items: center; justify-content: center;
      transition: background-color .2s, color .2s;
    }
    .pill:active { transform: scale(.96); }
    .pill[aria-pressed="true"] { background: var(--text); color: var(--bg); }
    .chips-wrap { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .field-lbl { font-size: .625rem; letter-spacing: .2em; text-transform: uppercase; color: var(--cat-label); margin-bottom: var(--space-2); }
    .hint { text-align: center; font-size: var(--fs-xs); letter-spacing: .06em; color: var(--muted); }
    /* ── Righello dei minuti ── */
    .readout { text-align: center; margin-bottom: var(--space-2); }
    .readout-val b { font-size: 2.75rem; font-weight: 200; letter-spacing: -.04em; font-variant-numeric: tabular-nums; line-height: 1; }
    .readout-val small { font-size: var(--fs-sm); color: var(--muted); margin-left: 6px; }
    .readout-sub { font-size: var(--fs-xs); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
    .ruler-wrap { position: relative; margin: 0 calc(-1 * var(--space-5)); }
    .ruler {
      --tick: 14px; display: flex; overflow-x: auto; scrollbar-width: none; height: 64px;
      scroll-snap-type: x mandatory; overscroll-behavior-x: contain;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent);
      transition: opacity .25s;
    }
    .ruler::-webkit-scrollbar { display: none; }
    .ruler.dim { opacity: .4; }
    .ruler-track { display: flex; padding: 0 calc(50% - var(--tick) / 2); }
    .ruler-track i { position: relative; flex: 0 0 var(--tick); height: 100%; scroll-snap-align: center; }
    .ruler-track i::before { content: ''; position: absolute; left: 50%; top: 10px; width: 1px; height: 12px; margin-left: -.5px; background: var(--border); }
    .ruler-track i.m5::before { height: 20px; background: var(--muted); opacity: .6; }
    .ruler-track i.m10::before { height: 28px; background: var(--muted); }
    .ruler-track i b { position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%); font-size: .6875rem; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
    .ruler-mark { position: absolute; left: 50%; top: 4px; width: 2px; height: 38px; margin-left: -1px; border-radius: 1px; background: var(--sakura); pointer-events: none; }
    .seq-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--k); flex-shrink: 0; }
    .seq-mins { color: var(--muted); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: var(--geco-blue); height: 28px; margin: 0; }
    .step-edit { display: grid; grid-template-columns: 1.4fr 1fr auto; gap: var(--space-2); align-items: center; }
    .step-edit select { min-height: 44px; }

    /* ── Calendario ── */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); }
    .stat { background: var(--card); border: .5px solid var(--border); border-radius: var(--radius-md); padding: var(--space-4) var(--space-2); text-align: center; }
    .stat b { display: block; font-size: 1.75rem; font-weight: 300; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .stat span { font-size: .625rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    .cal-head { display: flex; align-items: center; justify-content: space-between; }
    .cal-title { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -.01em; text-transform: capitalize; }
    .cal-nav .icon { width: 20px; height: 20px; }
    .cal-nav.next .icon { transform: rotate(180deg); }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 6px; text-align: center; }
    .cal-dow { font-size: .625rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-bottom: 4px; }
    .cal-day {
      position: relative; aspect-ratio: 1; max-width: 46px; width: 100%; margin: 0 auto; border-radius: 50%;
      border: 0; background: none; font-size: var(--fs-md); color: var(--text); cursor: pointer;
      font-variant-numeric: tabular-nums; transition: background-color .15s;
    }
    .cal-day:active { background: var(--surface); }
    .cal-day.has { background: var(--geco-mist); color: var(--geco-blue); font-weight: 600; }
    .cal-day.has::after { content: ''; position: absolute; left: 50%; bottom: 5px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--sakura); }
    .cal-day.deep { background: var(--geco-blue); color: var(--on-primary); }
    .cal-day.today { box-shadow: inset 0 0 0 1.5px var(--text); }
    .cal-day.sel { box-shadow: 0 0 0 2px var(--sakura); }
    .day-row { display: flex; align-items: center; gap: var(--space-4); width: 100%; background: none; border: 0; padding: var(--space-3) var(--space-4); text-align: left; cursor: pointer; }
    .day-row + .day-row { border-top: .5px solid var(--border); }
    .day-row:active { background: var(--surface); }
    .day-n { width: 36px; text-align: center; }
    .day-n b { display: block; font-size: 1.25rem; font-weight: 300; line-height: 1; }
    .day-n span { font-size: .625rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .day-info { flex: 1; min-width: 0; }
    .day-info b { font-weight: 600; font-variant-numeric: tabular-nums; }
    .day-info small { display: block; color: var(--muted); font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── Fogli di modifica ── */
    .sheet-body { display: flex; flex-direction: column; gap: var(--space-4); }
    .sheet-row { display: flex; gap: var(--space-2); }
    .sheet-row > * { flex: 1; }
    .btn.armed { background: var(--danger); border-color: var(--danger); color: #fff; }

    /* ── Schermata di pratica: inchiostro e silenzio ── */
    .practice {
      --ink: #0C171E; --paper: #E6EFF3; --faint: #8FA3AF; --glow: #8FD6EA; --blossom: #F2A9BC;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; height: 100vh; height: 100dvh;
      z-index: 300; color: var(--paper); background-color: var(--ink);
      background-image: radial-gradient(120% 80% at 50% 38%, #12242E 0%, var(--ink) 70%);
      display: none; flex-direction: column; align-items: center;
      padding: calc(var(--safe-top) + var(--space-5)) var(--space-6) calc(var(--safe-bottom) + var(--space-8));
      opacity: 0; transition: opacity .6s var(--ease);
    }
    html.practice-open, html.practice-open body { background: #0C171E !important; }
    .practice.on { display: flex; }
    .practice.show { opacity: 1; }
    .p-top { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: var(--space-4); }
    .p-top-row { display: flex; justify-content: space-between; align-items: center; min-height: 32px; }
    .p-eyebrow { font-size: .6875rem; letter-spacing: .24em; text-transform: uppercase; color: var(--faint); }
    .p-actions { display: flex; align-items: center; gap: var(--space-2); }
    .p-more { background: none; border: 0; color: var(--faint); width: 36px; height: 36px; display: grid; place-items: center; cursor: pointer; border-radius: 50%; }
    .p-more:active { color: var(--paper); background: rgba(230,239,243,.08); }
    .p-more .icon { width: 22px; height: 22px; }
    .p-end { background: none; border: 0; color: var(--faint); font-size: var(--fs-sm); padding: var(--space-2) 0 var(--space-2) var(--space-4); cursor: pointer; }
    .p-end:active { color: var(--paper); }
    .p-segs { display: flex; gap: 4px; }
    .p-seg { height: 3px; border-radius: 2px; background: rgba(230, 239, 243, .14); overflow: hidden; }
    .p-seg i { display: block; height: 100%; width: 0; background: var(--glow); }
    .p-stage { flex: 1; display: grid; place-items: center; width: 100%; }
    .enso { position: relative; width: min(78vw, 320px); aspect-ratio: 1; display: grid; place-items: center; }
    .enso-glow {
      position: absolute; inset: 14%; border-radius: 50%;
      background: radial-gradient(circle, rgba(143, 214, 234, .16), transparent 68%);
      animation: breathe 9s ease-in-out infinite;
    }
    .practice.paused .enso-glow { animation-play-state: paused; opacity: .5; }
    @keyframes breathe { 0%, 100% { transform: scale(.92); opacity: .7; } 50% { transform: scale(1.08); opacity: 1; } }
    .enso svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .enso .track { fill: none; stroke: rgba(230, 239, 243, .13); stroke-width: 2.5; stroke-linecap: round; }
    .enso .prog { fill: none; stroke: var(--glow); stroke-width: 5; stroke-linecap: round; transition: stroke-dasharray .25s linear; }
    .enso .dot { fill: var(--blossom); }
    .p-center { position: relative; text-align: center; }
    .p-time { font-size: clamp(3.5rem, 18vw, 4.75rem); font-weight: 100; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
    .p-step { margin-top: var(--space-3); font-size: var(--fs-md); letter-spacing: .06em; color: var(--paper); }
    .p-sub { margin-top: 4px; font-size: var(--fs-xs); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); font-variant-numeric: tabular-nums; }
    .p-gecko { width: 64px; height: auto; opacity: .92; }
    .p-gecko-done { width: 150px; }
    .p-bottom { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); }
    .p-pause {
      min-width: 168px; height: 52px; border-radius: 999px; padding: 0 var(--space-6); cursor: pointer;
      background: transparent; color: var(--paper); border: 1px solid rgba(230, 239, 243, .28);
      font-size: var(--fs-md); letter-spacing: .06em; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      transition: background-color .2s, transform .12s var(--ease);
    }
    .p-pause:active { transform: scale(.96); background: rgba(230, 239, 243, .08); }
    .p-pause .icon { width: 18px; height: 18px; }
    .p-done { display: none; flex-direction: column; align-items: center; text-align: center; gap: var(--space-4); }
    .practice.done .p-stage-live, .practice.done .p-bottom, .practice.done .p-top { visibility: hidden; }
    .practice.done .p-done { display: flex; position: absolute; inset: 0; justify-content: center; padding: var(--space-6); }
    .p-kanji { font-family: "Hiragino Mincho ProN", "Yu Mincho", var(--font-serif); font-size: 6rem; font-weight: 300; line-height: 1; color: var(--blossom); }
    .p-done h2 { font-size: var(--fs-xl); font-weight: 300; letter-spacing: .08em; }
    .p-done p { color: var(--faint); font-size: var(--fs-sm); line-height: 1.6; }
    .p-done a { color: var(--glow); }
    .p-done .btn { margin-top: var(--space-4); min-width: 200px; background: transparent; color: var(--paper); border-color: rgba(230, 239, 243, .28); }
    @media (prefers-reduced-motion: reduce) { .enso-glow { animation: none; } }
  </style>
</head>
<body class="zen zen-native" data-title="Spiritualità" data-back="index.html"
      data-add="#btn-add" data-add-icon="play" data-add-label="Avvia meditazione">
  <script type="module" src="js/core/auth-guard.js"></script>
  <script type="module" src="js/ui/shell.js"></script>

  <!-- Il + (play) della barra in basso preme questo pulsante: avvia la pratica -->
  <button id="btn-add" type="button" hidden aria-hidden="true" tabindex="-1"></button>

  <template id="zen-header-actions">
    <button class="icon-btn" type="button" id="btn-more" aria-label="Suono e volume"><svg class="icon" aria-hidden="true"><use href="#i-more"/></svg></button>
  </template>

  <main class="zen-main med-main">
    <div class="seg-wrap">
      <div class="segmented" role="group" aria-label="Schermata">
        <button type="button" data-view="setup" aria-pressed="true">Imposta</button>
        <button type="button" data-view="cal" aria-pressed="false">Calendario</button>
      </div>
    </div>

    <!-- ═══ Imposta ═══ -->
    <section class="view" id="view-setup">
      <div class="zen-section">
        <div class="block-title">
          <div class="zen-eyebrow">Template</div>
          <button class="text-btn" type="button" id="btn-new-tpl">+ Nuovo</button>
        </div>
        <div class="tpl-row" id="tpl-row"></div>
      </div>

      <div class="zen-section">
        <div class="zen-eyebrow">Durata</div>
        <div class="readout"><div class="readout-val" id="readout"></div><div class="readout-sub" id="readout-sub"></div></div>
        <div class="ruler-wrap"><div class="ruler" id="ruler" aria-label="Scorri per scegliere i minuti"></div><span class="ruler-mark" aria-hidden="true"></span></div>
      </div>

      <p class="hint">Premi play in basso per iniziare</p>
    </section>

    <!-- ═══ Calendario ═══ -->
    <section class="view" id="view-cal" hidden>
      <div class="stats" id="stats"></div>

      <div class="panel" style="gap:var(--space-4)">
        <div class="cal-head">
          <button class="icon-btn cal-nav" type="button" id="cal-prev" aria-label="Mese precedente"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button>
          <div class="cal-title" id="cal-title"></div>
          <button class="icon-btn cal-nav next" type="button" id="cal-next" aria-label="Mese successivo"><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

      <div class="zen-section">
        <div class="block-title">
          <div class="zen-eyebrow" id="day-title">Sessioni</div>
          <button class="text-btn" type="button" id="btn-manual">Segna una sessione</button>
        </div>
        <div class="list" id="day-list"></div>
      </div>

      <div style="text-align:center"><button class="text-btn" type="button" id="btn-csv">Esporta CSV</button></div>
    </section>
  </main>

  <!-- ═══ Pratica ═══ -->
  <div class="practice" id="practice" role="dialog" aria-modal="true" aria-label="Pratica in corso">
    <div class="p-top">
      <div class="p-top-row">
        <div class="p-eyebrow" id="p-eyebrow"></div>
        <div class="p-actions"><button class="p-more" type="button" id="p-more" aria-label="Suono e volume"><svg class="icon" aria-hidden="true"><use href="#i-more"/></svg></button><button class="p-end" type="button" id="p-end">Termina</button></div>
      </div>
      <div class="p-segs" id="p-segs"></div>
    </div>

    <div class="p-stage p-stage-live">
      <div class="enso">
        <div class="enso-glow"></div>
        <svg viewBox="0 0 300 300" aria-hidden="true">
          <circle class="track" cx="150" cy="150" r="124" transform="rotate(-75 150 150)" id="enso-track"/>
          <circle class="prog" cx="150" cy="150" r="124" transform="rotate(-75 150 150)" id="enso-prog"/>
          <g id="enso-tip"><circle class="dot" cx="274" cy="150" r="5"/></g>
        </svg>
        <div class="p-center">
          <div class="p-time" id="p-time">00:00</div>
          <div class="p-step" id="p-step"></div>
          <div class="p-sub" id="p-sub"></div>
        </div>
      </div>
    </div>

    <div class="p-bottom">
      <img class="p-gecko" src="assets/img/geco.webp" alt="Il Geco Zen" width="64" height="46"/>
      <button class="p-pause" type="button" id="p-pause"></button>
    </div>

    <div class="p-done" id="p-done">
      <img class="p-gecko p-gecko-done" src="assets/img/geco.webp" alt="Il Geco Zen" width="150" height="107"/>
      <h2>Sessione completata</h2>
      <p id="p-done-text"></p>
      <p>Vuoi approfondire la mindfulness e la meditazione?<br><a href="https://www.ilgecozen.it" target="_blank" rel="noopener">www.ilgecozen.it</a></p>
      <button class="btn" type="button" id="p-close">Chiudi</button>
    </div>
  </div>

  <!-- ═══ Foglio generico (modifiche, conferme) ═══ -->
  <div class="zen-sheet-overlay" id="app-sheet">
    <div class="zen-sheet" role="dialog" aria-modal="true" aria-labelledby="app-sheet-title">
      <div class="zen-sheet-handle"></div>
      <div class="zen-sheet-title" id="app-sheet-title"></div>
      <div class="sheet-body" id="app-sheet-body"></div>
    </div>
  </div>

  <script type="module" src="js/meditazione/app.js"></script>
</body>
</html>
