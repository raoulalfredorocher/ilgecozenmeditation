<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Il Geco Zen"/>
  <meta name="theme-color" content="#FAF7F2"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" href="assets/icons/favicon-48.png"/>
  <title>Il Geco Zen — Passioni</title>
  <script src="js/ui/theme-boot.js"></script>
  <link rel="stylesheet" href="styles/tokens.css"/>
  <link rel="stylesheet" href="styles/zen.css"/>
</head>
<body class="zen zen-native" data-title="Passioni">
  <script type="module" src="js/core/auth-guard.js"></script>
  <script type="module" src="js/ui/shell.js"></script>

  <main class="zen-main">
    <p class="zen-muted small" style="text-align:center">Quello che ti accende, tutto in un posto.</p>
    <nav class="mosaic" id="passions" aria-label="Passioni"></nav>
  </main>

  <script type="module">
    import { SECTION_GROUPS } from './js/ui/sections.js';
    import { renderMosaic } from './js/ui/mosaic.js';

    const byHref = Object.fromEntries(SECTION_GROUPS.flatMap(g => g.items).map(s => [s.href, s]));
    const pick = (href, h, extra = {}) => ({ ...byHref[href], h, ...extra });
    renderMosaic(document.getElementById('passions'), [
      pick('personal-brand.html', 8, { wide: true }),
      pick('libri-manga.html', 11), pick('film-anime.html', 8),
      pick('musica.html', 8), pick('fotografia-viaggi.html', 11),
      pick('finanza.html', 11), pick('giochi.html', 8),
      // Sezioni previste ma non ancora realizzate (erano già nella versione precedente)
      { title: 'Tecnologia', icon: 'grid', tone: 'sky', h: 8, soon: true },
      { title: 'Casa', icon: 'home', tone: 'sand', h: 8, soon: true },
    ]);
  </script>
</body>
</html>
