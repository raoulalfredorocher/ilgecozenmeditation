  <style>
    .hub-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    .hub-card-wide { grid-column: 1 / -1; }
    .hub-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 22px;
      padding: 28px 18px 22px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; min-height: 138px;
      cursor: pointer; text-decoration: none; color: inherit;
      transition: border-color .2s, background .2s, transform .12s;
      -webkit-tap-highlight-color: transparent;
      user-select: none; text-align: center;
    }
    .hub-card:active { background: var(--surface); border-color: var(--gold); transform: scale(.97); }
    .hub-card-icon { font-size: 2.2rem; line-height: 1; }
    .hub-card-title { font-size: .84rem; font-weight: 600; letter-spacing: .1em; color: var(--text); text-align: center; }
    .hub-card-sub { font-size: .52rem; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; text-align: center; line-height: 1.5; }

    .hub-card.brand   { border-color: #c8a0f055; }
    .hub-card.books   { border-color: #f0b36f66; }
    .hub-card.films   { border-color: #9ec5ff66; }
    .hub-card.music   { border-color: #6cbf8a55; }
    .hub-card.photo   { border-color: #f5a9bc66; }
    .hub-card.finance { border-color: #74C7E155; }
    .hub-card.games   { border-color: #cbb7f855; }
    .hub-card.tech    { border-color: #6cbf8a55; }
    .hub-card.home    { border-color: #e8a87c55; }

    .app-sub-passioni {
      font-size: .48rem; letter-spacing: .22em;
      color: var(--muted); text-transform: uppercase; margin-top: 2px;
    }
  </style>

  <script type="module">
    import { waitForAuth } from './js/firebase-config.js';
    const htmlEl   = document.documentElement;
    const btnTheme = document.getElementById('theme-toggle');
    const knob     = document.getElementById('theme-knob');
    let isDark = localStorage.getItem('zen_theme') === 'dark';
    function applyTheme() {
      htmlEl.setAttribute('data-theme', isDark ? 'dark' : 'light');
      knob.textContent = isDark ? '🌙' : '☀️';
      document.querySelector('meta[name="theme-color"]').content = isDark ? '#111820' : '#f7f4f9';
      localStorage.setItem('zen_theme', isDark ? 'dark' : 'light');
    }
    applyTheme();
    btnTheme.addEventListener('click', () => { isDark = !isDark; applyTheme(); });
    waitForAuth().then(() => { document.body.style.visibility = ''; });
  </script>
