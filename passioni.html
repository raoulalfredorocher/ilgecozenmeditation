<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Il Geco Zen"/>
  <meta name="theme-color" content="#FAF7F2"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" href="assets/icons/favicon-48.png"/>
  <title>Il Geco Zen — Passioni</title>
  <script src="js/ui/theme-boot.js"></script>
  <link rel="stylesheet" href="styles/tokens.css"/>
  <link rel="stylesheet" href="styles/zen.css"/>
</head>
<body class="zen zen-native" data-title="Passioni">
  <script type="module" src="js/core/auth-guard.js"></script>
  <script type="module" src="js/ui/shell.js"></script>

  <main class="zen-main">
    <p class="zen-muted small" style="text-align:center">Quello che ti accende, tutto in un posto.</p>
    <nav id="passions" aria-label="Passioni"></nav>
  </main>

  <script type="module">
    import { SECTION_GROUPS } from './js/ui/sections.js';
    import { renderCards } from './js/ui/cards.js';

    const byHref = Object.fromEntries(SECTION_GROUPS.flatMap(g => g.items).map(s => [s.href, s]));
    renderCards(document.getElementById('passions'), [
      byHref['personal-brand.html'],
      byHref['libri-manga.html'], byHref['film-anime.html'],
      byHref['musica.html'], byHref['fotografia-viaggi.html'],
      byHref['finanza.html'], byHref['giochi.html'],
      // Sezioni previste ma non ancora realizzate
      { title: 'Tecnologia', tone: 'sky', icon: 'grid', desc: 'Presto: idee e strumenti.', soon: true },
      { title: 'Casa', tone: 'sand', icon: 'home', desc: 'Presto: la tua casa.', soon: true },
    ]);
  </script>
</body>
</html>
