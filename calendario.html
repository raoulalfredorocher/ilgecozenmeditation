<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Il Geco Zen"/>
  <meta name="theme-color" content="#FAF7F2"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" href="assets/icons/favicon-48.png"/>
  <title>Il Geco Zen — Il mio mese</title>
  <script src="js/ui/theme-boot.js"></script>
  <link rel="stylesheet" href="styles/tokens.css"/>
  <link rel="stylesheet" href="styles/zen.css"/>
  <link rel="stylesheet" href="styles/sessione.css"/>
  <style>
    .cm-card { background: var(--card); border: .5px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-4) var(--space-4); box-shadow: var(--shadow-sm); }
    .cm-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-3); }
    .cm-head .icon-btn .icon { width: 20px; height: 20px; }
    .cm-head .next .icon { transform: rotate(180deg); }
    .cm-month { font: 600 1.25rem/1.2 var(--font-serif); letter-spacing: -.01em; text-transform: capitalize; }
    .cm-today { background: none; border: 0; font-size: var(--fs-xs); font-weight: 600; color: var(--geco-blue); cursor: pointer; padding: 4px 2px; }
    .cm-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--space-3); }
    .cm-chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; border: 0; background: var(--surface); color: var(--text); font-size: var(--fs-xs); font-weight: 500; cursor: pointer; transition: opacity .2s; }
    .cm-chip[aria-pressed="false"] { opacity: .45; }
    .dotc { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex-shrink: 0; display: inline-block; }
    .cm-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 4px; text-align: center; }
    .cm-dow { font-size: .625rem; letter-spacing: .1em; color: var(--muted); padding-bottom: 4px; }
    .cm-day { position: relative; height: 50px; border: 0; background: none; border-radius: 14px; color: var(--text); font-size: var(--fs-md); font-variant-numeric: tabular-nums; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; }
    .cm-day:active { background: var(--surface); }
    .cm-day.today { box-shadow: inset 0 0 0 1.5px var(--text); }
    .cm-day.sel { background: var(--geco-mist); color: var(--geco-blue); font-weight: 600; }
    .cm-day.out { visibility: hidden; }
    .cm-dots { display: flex; gap: 3px; height: 6px; }
    .cm-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
    .cm-sum { text-align: center; margin-top: var(--space-3); font-size: var(--fs-xs); color: var(--muted); line-height: 1.7; }
    .cm-dayname { font: 600 1.375rem/1.2 var(--font-serif); letter-spacing: -.015em; text-transform: capitalize; margin-bottom: var(--space-3); }
    .cm-row { display: flex; align-items: center; gap: var(--space-3); width: 100%; text-align: left; background: none; border: 0; border-top: .5px solid var(--border); padding: var(--space-3) 0; color: inherit; cursor: pointer; font: inherit; }
    .cm-row:active { opacity: .6; }
    .cm-row:first-of-type { border-top: 0; }
    .cm-row .dotc { width: 10px; height: 10px; }
    .cm-row .grow { flex: 1; min-width: 0; }
    .cm-row b { font-weight: 600; display: block; }
    .cm-row .s { font-size: var(--fs-sm); color: var(--muted); }
    .cm-row .chev { color: var(--muted); }
    .cm-row .chev .icon { width: 16px; height: 16px; transform: rotate(180deg); }
    .cm-empty { color: var(--muted); font-size: var(--fs-sm); font-style: italic; padding: var(--space-2) 0; }
    .cm-when { font-size: var(--fs-sm); color: var(--muted); text-transform: capitalize; margin: -8px 0 var(--space-3); text-align: center; }
    .cm-stats { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-6); margin: var(--space-3) 0; }
    .cm-stats > div { display: flex; flex-direction: column; }
    .cm-stats b { font-weight: 300; font-size: 1.75rem; line-height: 1.1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .cm-ex { background: var(--card); border: .5px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); margin-top: var(--space-3); }
    .cm-ex-h { display: flex; flex-direction: column; margin-bottom: var(--space-1); }
    .cm-ex-h.cm-between { flex-direction: row; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
    .cm-ex .s, .cm-items { font-size: var(--fs-sm); color: var(--muted); }
    .cm-items { margin: 2px 0 4px; line-height: 1.5; }
    .cm-set { display: flex; align-items: center; gap: var(--space-3); padding: 7px 0; border-top: .5px solid var(--border); font-variant-numeric: tabular-nums; }
    .cm-set .grow { flex: 1; min-width: 0; }
    .cm-set-n { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: .6875rem; color: var(--muted); flex-shrink: 0; }
    .cm-note, .cm-text { white-space: pre-wrap; line-height: 1.6; margin-top: var(--space-3); }
    .cm-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--space-2); }
    .cm-chip2 { background: var(--sakura-soft); color: var(--bark); border-radius: 999px; padding: 4px 12px; font-size: var(--fs-sm); }
    .cm-mood { display: flex; align-items: center; gap: 6px; margin-top: var(--space-4); }
    .cm-mood button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--surface); color: var(--text); font-size: var(--fs-sm); font-weight: 600; cursor: pointer; }
    .cm-mood button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
    .cm-mood .s:last-child { margin-left: 6px; }
    .cm-add { display: flex; flex-wrap: wrap; gap: 8px; margin-top: var(--space-4); }
    .cm-add button { height: 34px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--surface); color: var(--text); font-size: var(--fs-sm); font-weight: 500; cursor: pointer; }
    .cm-export { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--space-3); padding: var(--space-2) 0 var(--space-6); }
    .cm-open { display: block; text-align: center; margin-top: var(--space-5); font-size: var(--fs-sm); font-weight: 600; color: var(--geco-blue); text-decoration: none; }
  </style>
</head>
<body class="zen zen-native" data-title="Il mio mese" data-back="monitoring.html">
  <script type="module" src="js/core/auth-guard.js"></script>
  <script type="module" src="js/ui/shell.js"></script>

  <template id="zen-header-actions">
    <button class="icon-btn" type="button" id="cm-more" aria-label="Altre azioni"><svg class="icon" aria-hidden="true"><use href="#i-more"/></svg></button>
  </template>

  <main class="zen-main">
    <section class="cm-card" aria-label="Calendario">
      <div class="cm-head">
        <button type="button" class="icon-btn" id="cm-prev" aria-label="Mese precedente"></button>
        <div style="text-align:center"><div class="cm-month" id="cm-month"></div><button type="button" class="cm-today" id="cm-today">Oggi</button></div>
        <button type="button" class="icon-btn next" id="cm-next" aria-label="Mese successivo"></button>
      </div>
      <div class="cm-filters" id="cm-filters" role="group" aria-label="Aree da mostrare"></div>
      <div class="cm-grid" id="cm-grid"></div>
      <div class="cm-sum" id="cm-sum"></div>
    </section>

    <section class="cm-card" id="cm-day" aria-live="polite"></section>

  </main>

  <script type="module" src="js/pages/calendario/main.js"></script>
</body>
</html>
