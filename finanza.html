<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Il Geco Zen — Finanza"/>
  <meta name="theme-color" content="#f0f7fb"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" href="assets/icons/favicon-48.png"/>
  <title>Il Geco Zen — Finanza</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html[data-theme="light"] {
      --bg:#f0f7fb; --surface:#e2f0f8; --card:#ffffff; --border:#b8d8ea;
      --text:#0d2233; --muted:#5a7e94; --primary:#1a6e9a; --accent:#74C7E1;
      --accent2:#F5A9BC; --red:#c04060; --input-bg:#ffffff; --ring-bg:#c4e4f4;
    }
    html[data-theme="dark"] {
      --bg:#0b1620; --surface:#112030; --card:#162840; --border:#1e3850;
      --text:#d8eaf4; --muted:#7aaabb; --primary:#74C7E1; --accent:#9DDDE8;
      --accent2:#F5A9BC; --red:#e05070; --input-bg:#112030; --ring-bg:#1a3040;
    }
    html { overscroll-behavior: none; }
    html, body { min-height:100%; background:var(--bg); color:var(--text);
      font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
      -webkit-font-smoothing:antialiased; transition:background .3s,color .3s; }
    body { display:flex; flex-direction:column; align-items:center;
      padding-top:calc(env(safe-area-inset-top,0px) + 120px);
      padding-left:18px; padding-right:18px;
      padding-bottom:calc(72px + min(env(safe-area-inset-bottom, 0px), 34px));
      max-width:480px; margin:0 auto; }

    /* HEADER */
    header { position:fixed; top:0; left:0; right:0; z-index:150;
      background:var(--bg); display:flex; align-items:center; justify-content:space-between;
      padding:calc(env(safe-area-inset-top,0px) + 10px) 20px 10px;
      border-bottom:1px solid var(--border); }
    .btn-back-hub { background:none; border:1px solid var(--border); border-radius:10px;
      color:var(--muted); font-family:inherit; font-size:.58rem; letter-spacing:.1em;
      padding:5px 8px; cursor:pointer; display:flex; flex-direction:column;
      align-items:center; gap:2px; width:52px; text-decoration:none; }
    .header-center { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
    .header-icon { font-size:1.8rem; line-height:1; }
    .app-title { font-size:.95rem; letter-spacing:.16em; color:var(--primary); font-weight:700; }
    .app-sub { font-size:.48rem; letter-spacing:.22em; color:var(--muted); text-transform:uppercase; }
    .theme-toggle { background:none; border:1.5px solid var(--border); border-radius:20px;
      cursor:pointer; width:52px; height:28px; position:relative; flex-shrink:0; }
    .theme-toggle .knob { position:absolute; top:3px; left:3px; width:20px; height:20px;
      border-radius:50%; background:var(--accent); transition:transform .3s;
      display:flex; align-items:center; justify-content:center; font-size:.7rem; }
    html[data-theme="dark"] .theme-toggle .knob { transform:translateX(24px); }

    /* TAB BAR */
    .tab-bar { position:fixed; bottom:0; left:0; right:0;
      height:calc(58px + min(env(safe-area-inset-bottom, 0px), 34px));
      padding-bottom:min(env(safe-area-inset-bottom, 0px), 34px);
      background:var(--card); border-top:1px solid var(--border);
      border-radius:22px 22px 0 0;
      display:flex; align-items:center; justify-content:space-around; z-index:200; }
    .tab-btn { flex:1; background:none; border:none;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:4px; cursor:pointer; color:var(--muted); transition:color .2s;
      padding:8px 4px; height:100%; -webkit-tap-highlight-color:transparent; }
    .tab-btn.tab-active { color:var(--primary); }
    .tab-icon { width:22px; height:22px; flex-shrink:0; }
    .tab-label { font-size:.44rem; letter-spacing:.12em; text-transform:uppercase; font-family:inherit; }

    /* SCREENS */
    .screen { width:100%; display:none; flex-direction:column; align-items:center; }
    .screen.active { display:flex; }
    .section-title { width:100%; font-size:.54rem; letter-spacing:.28em;
      color:var(--muted); text-transform:uppercase; margin-bottom:12px; text-align:center; }

    /* FORMS */
    input, select { background:var(--input-bg); border:1.5px solid var(--border);
      border-radius:12px; color:var(--text); font-family:inherit; font-size:.82rem;
      padding:10px 14px; width:100%; outline:none; transition:border-color .2s; }
    input:focus, select:focus { border-color:var(--primary); }
    label { font-size:.58rem; letter-spacing:.14em; color:var(--muted); text-transform:uppercase;
      display:block; margin-bottom:4px; }
    .form-group { width:100%; margin-bottom:14px; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
    .btn-primary { background:var(--primary); color:#fff; border:none; border-radius:24px;
      font-family:inherit; font-size:.82rem; letter-spacing:.12em;
      padding:12px 28px; cursor:pointer; width:100%; }
    .btn-primary:active { opacity:.8; }
    .btn-outline { background:none; border:1.5px solid var(--border); border-radius:24px;
      color:var(--text); font-family:inherit; font-size:.78rem; letter-spacing:.1em;
      padding:10px 22px; cursor:pointer; }
    .btn-add { width:100%; background:var(--card); border:1.5px dashed var(--border);
      border-radius:12px; color:var(--primary); font-size:.82rem; letter-spacing:.12em;
      padding:13px; cursor:pointer; font-family:inherit; margin-bottom:14px; }
    .icon-btn { background:none; border:none; cursor:pointer; color:var(--muted);
      padding:6px; border-radius:8px; display:flex; align-items:center; justify-content:center; }
    .icon-btn.del { color:var(--red); }
    .icon-btn svg { width:16px; height:16px; }
    .radio-group { display:flex; gap:8px; }
    .radio-chip { flex:1; }
    .radio-chip input { display:none; }
    .radio-chip label { display:block; text-align:center; padding:8px; border-radius:12px;
      border:1.5px solid var(--border); font-size:.72rem; cursor:pointer;
      color:var(--muted); background:var(--card); transition:.15s; text-transform:none; letter-spacing:.06em; }
    .radio-chip input:checked + label { border-color:var(--primary); color:var(--primary); background:var(--surface); }

    /* MODAL */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:500;
      display:none; align-items:flex-end; justify-content:center; }
    .modal-overlay.open { display:flex; }
    .modal-sheet { background:var(--card); border-radius:22px 22px 0 0; width:100%;
      max-width:480px; padding:24px 20px calc(min(env(safe-area-inset-bottom, 0px), 34px) + 24px);
      max-height:92vh; overflow-y:auto; }
    .modal-handle { width:36px; height:4px; background:var(--border); border-radius:4px; margin:0 auto 18px; }
    .modal-title { font-size:.9rem; font-weight:700; letter-spacing:.1em; color:var(--text); margin-bottom:18px; text-align:center; }
    .modal-actions { display:flex; gap:10px; margin-top:18px; }
    .modal-actions .btn-primary { flex:1; }
    .modal-actions .btn-outline { flex:1; }

    /* ── MAPPA (treemap) ── */
    .mp-card { width:100%; background:var(--card); border:1.5px solid var(--border); border-radius:20px; padding:16px; margin-bottom:14px; }
    .mp-hero { display:flex; flex-direction:column; gap:2px; margin-bottom:12px; }
    .mp-hero .l { font-size:.56rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }
    .mp-hero .v { font-size:2.3rem; font-weight:300; letter-spacing:-.03em; line-height:1.1; font-variant-numeric:tabular-nums; }
    .mp-hero .v.neg { color:var(--red); } .mp-hero .s { font-size:.66rem; color:var(--muted); }
    .mp-seg { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
    .mp-seg button { border:1.5px solid var(--border); background:none; color:var(--muted); font:inherit; font-size:.62rem; letter-spacing:.08em; padding:5px 12px; border-radius:999px; cursor:pointer; }
    .mp-seg button.on { background:var(--primary); border-color:var(--primary); color:#fff; }
    .mp-bc { display:flex; align-items:center; flex-wrap:wrap; gap:4px; min-height:26px; margin-bottom:8px; font-size:.7rem; color:var(--muted); }
    .mp-bc button { border:0; background:none; font:inherit; color:var(--primary); cursor:pointer; padding:2px 4px; }
    .mp-bc b { color:var(--text); font-weight:600; padding:2px 4px; }
    .mp-seg button.move { border-style:dashed; color:#7C5CD8; border-color:#7C5CD8; }
    .fl-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -4px; padding:0 4px; scrollbar-width:thin; }
    .fl-stage { position:relative; }
    .fl-stage svg { position:absolute; inset:0; pointer-events:none; }
    .fl-link { transition:stroke-opacity .25s; }
    .fl-h { position:absolute; top:8px; font-size:.54rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); width:124px; text-align:center; }
    .fl-node { position:absolute; border:0; border-radius:12px; padding:6px 10px; display:flex; flex-direction:column; justify-content:center; gap:1px; text-align:left; cursor:pointer; font-family:inherit; overflow:hidden;
      background:color-mix(in srgb, var(--c) 18%, var(--card)); color:var(--text); box-shadow:inset 3px 0 0 var(--c), 0 0 0 1px color-mix(in srgb, var(--c) 28%, var(--border)); transition:opacity .25s, transform .15s, box-shadow .2s; }
    .fl-node.acc { background:color-mix(in srgb, var(--c) 30%, var(--card)); }
    .fl-node:active { transform:scale(.97); } .fl-node.dim { opacity:.3; }
    .fl-node.sel { box-shadow:inset 3px 0 0 var(--c), 0 0 0 2px var(--c), 0 6px 18px color-mix(in srgb, var(--c) 35%, transparent); }
    .fl-t { font-size:.72rem; font-weight:600; line-height:1.2; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
    .fl-a { font-size:.66rem; font-variant-numeric:tabular-nums; opacity:.8; }
    .fl-det { margin-top:14px; border-top:1px solid var(--border); padding-top:12px; }
    .fl-det-h { display:flex; flex-direction:column; gap:8px; margin-bottom:6px; } .fl-det-h b { font-size:1rem; }
    .fl-pill { display:inline-block; margin:0 6px 4px 0; padding:3px 10px; border-radius:999px; font-size:.62rem; font-weight:600; background:color-mix(in srgb, var(--c) 16%, var(--card)); color:var(--text); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 40%, transparent); }
    .pl-bar { display:flex; height:14px; border-radius:7px; overflow:hidden; gap:2px; margin:6px 0 14px; } .pl-bar i { display:block; min-width:3px; }
    .pl-cat { border-top:1px solid var(--border); padding:4px 0 8px; } .pl-cat:first-child { border-top:0; }
    .pl-head { display:flex; align-items:center; gap:10px; width:100%; border:0; background:none; font:inherit; color:var(--text); text-align:left; padding:8px 2px 4px; cursor:pointer; }
    .pl-head .n { flex:1; font-size:.84rem; font-weight:600; } .pl-head .n small { display:block; font-weight:400; font-size:.6rem; color:var(--muted); }
    .pl-head .a { font-size:.84rem; font-weight:600; font-variant-numeric:tabular-nums; } .pl-head .a.pos { color:#22a85e; } .pl-head .a.neg { color:var(--red); }
    .pl-fill { height:4px; border-radius:2px; background:var(--surface); margin:0 2px; } .pl-fill i { display:block; height:100%; border-radius:2px; }
    .pl-ex { margin-top:6px; padding-left:22px; }
    .tm-empty { padding:50px 10px; text-align:center; color:var(--muted); font-size:.78rem; }
    .mp-list { margin-top:12px; display:flex; flex-direction:column; }
    .mp-row { display:flex; align-items:center; gap:10px; padding:10px 2px; border:0; border-top:1px solid var(--border); background:none; font:inherit; color:var(--text); text-align:left; width:100%; cursor:pointer; }
    .mp-row:first-child { border-top:0; }
    .mp-dot { width:12px; height:12px; border-radius:4px; flex:0 0 12px; }
    .mp-row .n { flex:1; min-width:0; font-size:.8rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .mp-row .n small { display:block; font-size:.58rem; color:var(--muted); }
    .mp-row .a { font-size:.8rem; font-weight:600; font-variant-numeric:tabular-nums; } .mp-row .a.pos { color:#22a85e; } .mp-row .a.neg { color:var(--red); }
    .mp-note { font-size:.6rem; color:var(--muted); line-height:1.6; margin-top:10px; }
    .mp-det { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0 14px; } .mp-det div { background:var(--surface); border-radius:12px; padding:10px 12px; } .mp-det span { display:block; font-size:.54rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); } .mp-det b { font-size:1.05rem; font-weight:600; }
    /* ── ANDAMENTO ── */
    .filter-row { display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px; width:100%; }
    .filter-chip { flex-shrink:0; background:var(--card); border:1.5px solid var(--border);
      border-radius:20px; padding:5px 14px; font-size:.62rem; letter-spacing:.1em;
      color:var(--muted); cursor:pointer; font-family:inherit; }
    .filter-chip.active { background:var(--primary); border-color:var(--primary); color:#fff; }
    .asset-card { width:100%; background:var(--card); border:1.5px solid var(--border);
      border-radius:18px; padding:16px; margin-bottom:12px; }
    .asset-header { display:flex; align-items:flex-start; justify-content:space-between; }
    .asset-name { font-size:.88rem; font-weight:700; color:var(--text); }
    .asset-ticker { font-size:.58rem; color:var(--muted); letter-spacing:.1em; margin-top:2px; }
    .asset-type-badge { display:inline-block; font-size:.46rem; letter-spacing:.12em;
      text-transform:uppercase; background:var(--surface); color:var(--muted);
      border-radius:6px; padding:2px 6px; margin-left:6px; vertical-align:middle; }
    .asset-right { text-align:right; }
    .asset-price { font-size:1.1rem; font-weight:700; color:var(--text); }
    .asset-change { font-size:.68rem; font-weight:600; }
    .asset-change.pos { color:#22a85e; }
    .asset-change.neg { color:var(--red); }
    .asset-change.neu { color:var(--muted); }
    .chart-wrap { width:100%; height:90px; margin-top:10px; }
    .chart-wrap canvas { width:100% !important; }
    .asset-card { cursor:pointer; }
    .q-pill { display:inline-block; margin-top:4px; padding:3px 9px; border-radius:999px; font-size:.7rem; font-weight:700; font-variant-numeric:tabular-nums; }
    .q-pill.pos { background:rgba(34,168,94,.14); color:#1f9a55; } .q-pill.neg { background:rgba(224,80,112,.14); color:var(--red); } .q-pill.neu { background:var(--surface); color:var(--muted); }
    .spark { width:100%; height:100%; display:block; }
    .q-sum { width:100%; display:flex; justify-content:space-between; align-items:baseline; padding:12px 16px; border-radius:16px; margin-bottom:12px; background:var(--surface); font-size:.62rem; letter-spacing:.08em; color:var(--muted); }
    .q-sum b { font-size:1.35rem; font-weight:300; letter-spacing:-.02em; } .q-sum.pos b { color:#1f9a55; } .q-sum.neg b { color:var(--red); }
    .q-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; padding-top:12px; border-top:1px solid var(--border); }
    .q-grid div { display:flex; flex-direction:column; gap:2px; } .q-grid span { font-size:.5rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
    .q-grid b { font-size:.82rem; font-variant-numeric:tabular-nums; } .q-grid b.pos { color:#1f9a55; } .q-grid b.neg { color:var(--red); }
    .rng { display:flex; align-items:center; gap:8px; margin-top:14px; font-size:.58rem; color:var(--muted); }
    .rng-bar { flex:1; height:4px; border-radius:2px; background:var(--surface); position:relative; } .rng-bar i { position:absolute; top:-4px; width:12px; height:12px; margin-left:-6px; border-radius:50%; background:var(--primary); border:2px solid var(--card); }
    .rng-cap, .q-asof { font-size:.5rem; letter-spacing:.08em; color:var(--muted); margin-top:6px; }
    .q-empty { text-align:center; padding:40px 12px; color:var(--muted); font-size:.78rem; line-height:1.7; }
    .status-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; width:100%; }
    .last-updated { font-size:.52rem; color:var(--muted); letter-spacing:.08em; }
    .refresh-btn { background:none; border:1px solid var(--border); border-radius:20px;
      color:var(--primary); font-family:inherit; font-size:.6rem; letter-spacing:.1em;
      padding:5px 14px; cursor:pointer; }
    .loading-pulse { opacity:.5; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:.4; } 50% { opacity:.9; } }

    /* ── PLANNING ── */
    .grand-summary { width:100%; background:var(--primary); border-radius:20px;
      padding:18px 20px; margin-bottom:18px; color:#fff; }
    .grand-summary-title { font-size:.52rem; letter-spacing:.28em; text-transform:uppercase;
      opacity:.8; margin-bottom:12px; text-align:center; }
    .grand-summary-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .grand-summary-item { text-align:center; }
    .grand-summary-label { font-size:.5rem; letter-spacing:.14em; text-transform:uppercase; opacity:.75; }
    .grand-summary-value { font-size:1.18rem; font-weight:700; margin-top:4px; }

    .account-card { width:100%; background:var(--card); border:1.5px solid var(--border);
      border-radius:16px; padding:0; margin-bottom:10px; overflow:hidden; }
    .account-card-header { display:flex; align-items:center; gap:12px; padding:14px;
      cursor:pointer; -webkit-tap-highlight-color:transparent; }
    .account-icon { font-size:1.5rem; flex-shrink:0; }
    .account-info { flex:1; min-width:0; }
    .account-name { font-size:.86rem; font-weight:600; color:var(--text); }
    .account-meta { font-size:.57rem; color:var(--muted); margin-top:2px; letter-spacing:.05em; }
    .account-balance { text-align:right; flex-shrink:0; }
    .account-balance-val { font-size:.9rem; font-weight:700; }
    .account-balance-val.pos { color:#22a85e; }
    .account-balance-val.neg { color:var(--red); }
    .account-balance-label { font-size:.5rem; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; margin-top:1px; }
    .account-detail { border-top:1px solid var(--border); padding:12px 14px; display:none; }
    .account-detail.open { display:block; }
    .account-detail-row { display:flex; justify-content:space-between; align-items:center;
      padding:4px 0; font-size:.76rem; }
    .account-detail-label { color:var(--muted); }
    .account-detail-value { font-weight:600; }
    .account-detail-value.pos { color:#22a85e; }
    .account-detail-value.neg { color:var(--red); }
    .account-exp-list { margin-top:8px; border-top:1px dashed var(--border); padding-top:8px; }
    .account-exp-item { display:flex; justify-content:space-between; align-items:center;
      padding:4px 0; font-size:.72rem; border-bottom:1px solid var(--surface); }
    .account-exp-item:last-child { border-bottom:none; }
    .account-exp-title { color:var(--text); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:8px; }
    .account-exp-badge { font-size:.46rem; letter-spacing:.1em; text-transform:uppercase;
      padding:2px 6px; border-radius:6px; flex-shrink:0; margin-right:6px; }
    .account-exp-badge.entrata { background:rgba(34,168,94,.15); color:#22a85e; }
    .account-exp-badge.uscita { background:rgba(192,64,96,.12); color:var(--red); }
    .account-exp-amount { font-weight:600; flex-shrink:0; }
    .account-exp-amount.pos { color:#22a85e; }
    .account-exp-amount.neg { color:var(--red); }
    .account-chevron { font-size:.7rem; color:var(--muted); transition:transform .2s; flex-shrink:0; margin-left:6px; }
    .account-chevron.open { transform:rotate(180deg); }

    .cat-block { width:100%; background:var(--card); border:1.5px solid var(--border);
      border-radius:18px; padding:16px; margin-bottom:14px; }
    .cat-block-header { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
    .cat-block-name { flex:1; font-size:.88rem; font-weight:700; color:var(--primary); }
    .cat-block-actions { display:flex; gap:4px; }
    .expense-row { background:var(--surface); border-radius:12px; padding:11px 12px;
      margin-bottom:6px; display:flex; align-items:center; gap:8px; }
    .expense-info { flex:1; min-width:0; }
    .expense-title-text { font-size:.82rem; font-weight:600; color:var(--text);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .expense-meta { font-size:.56rem; color:var(--muted); margin-top:2px; }
    .expense-right { text-align:right; flex-shrink:0; }
    .expense-amount { font-size:.86rem; font-weight:700; color:var(--text); }
    .expense-sub { font-size:.52rem; color:var(--muted); margin-top:1px; }
    .cat-totals { display:flex; justify-content:space-between; align-items:center;
      border-top:1px solid var(--border); margin-top:10px; padding-top:10px; }
    .cat-total-label { font-size:.58rem; color:var(--muted); letter-spacing:.08em; }
    .cat-total-value { font-size:.82rem; font-weight:700; color:var(--primary); }

    .tipo-badge { display:inline-block; font-size:.46rem; letter-spacing:.1em; text-transform:uppercase;

  <script type="module">
    import { escapeHtml as esc, safeUrl } from './js/core/dom.js';
    import { waitForAuth } from './js/core/db.js';
    import { createSheet } from './js/ui/dialog.js';
    import { mountFlow } from './js/pages/finanza/flow.js';
    import {
      subscribeFinanzaAccounts, addFinanzaAccount, updateFinanzaAccount, deleteFinanzaAccount,
      subscribeFinanzaCategories, addFinanzaCategory, updateFinanzaCategory, deleteFinanzaCategory,
      subscribeFinanzaExpenses, addFinanzaExpense, updateFinanzaExpense, deleteFinanzaExpense,
    } from './js/core/db.js';

    /* ══ THEME ══ */
    const htmlEl = document.documentElement;
    const btnTheme = document.getElementById('theme-toggle');
    const knob = document.getElementById('theme-knob');
    let isDark = localStorage.getItem('zen_theme') === 'dark';
    function applyTheme() {
      htmlEl.setAttribute('data-theme', isDark ? 'dark' : 'light');
      knob.textContent = isDark ? '🌙' : '☀️';
      document.querySelector('meta[name="theme-color"]').content = isDark ? '#0b1620' : '#f0f7fb';
      localStorage.setItem('zen_theme', isDark ? 'dark' : 'light');
    }
    applyTheme();
    btnTheme.addEventListener('click', () => { isDark = !isDark; applyTheme(); });

    /* ══ TAB NAV ══ */
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('tab-active', b === btn));
        ['andamento','planning','patrimonio'].forEach(id => {
          document.getElementById('screen-' + id).classList.toggle('active', btn.dataset.tab === id);
        });
      });
    });

    /* ══════════════════════════════════════════
       TAB 1 — ANDAMENTO
       Prezzi veri (Yahoo Finance, ritardo ~15 min): li scarica ogni 30 minuti l'automazione di GitHub
       (scripts/fetch_quotes.py) e li pubblica in data/mercati.json. Nessun numero inventato.
    ══════════════════════════════════════════ */
    const ASSETS = [
      { ticker:'IBM',    name:'IBM',                          type:'azione' },
      { ticker:'MSFT',   name:'Microsoft',                    type:'azione' },
      { ticker:'AAPL',   name:'Apple',                        type:'azione' },
      { ticker:'GOOGL',  name:'Alphabet / Google',            type:'azione' },
      { ticker:'IUIT.L', name:'AI Infrastructure USD (Acc)',  type:'etf'    },
      { ticker:'ISPY.L', name:'Cyber Security USD (Acc)',     type:'etf'    },
      { ticker:'HWWD.L', name:'MSCI World Health Core USD',   type:'etf'    },
      { ticker:'CSPX.L', name:'Core S&P 500 USD (Acc)',       type:'etf'    },
      { ticker:'VWRL.L', name:'FTSE All World USD',           type:'etf'    },
      { ticker:'CXSE',   name:'MSCI China USD',               type:'etf'    },
      { ticker:'AGED.L', name:'Aging Population USD',         type:'etf'    },
      { ticker:'VAPX.L', name:'FTSE Dev Asia & Pac Ex Japan', type:'etf'    },
    ];
    const PERIODS = [['day', 'Oggi'], ['w1', '1 sett.'], ['m1', '1 mese'], ['m3', '3 mesi'], ['ytd', 'Da inizio anno'], ['y1', '1 anno']];

    let quotes = {}, quotesAt = null, quotesErr = false;
    let activeFilter = 'all', period = 'day', openTicker = null;

    const fmtPrice = (price, currency) => {
      try { return new Intl.NumberFormat('it-IT', { style:'currency', currency, minimumFractionDigits:2, maximumFractionDigits:2 }).format(price); }
      catch { return price.toFixed(2) + ' ' + currency; }
    };
    const fmtPct = v => v == null ? '—' : `${v > 0 ? '+' : v < 0 ? '−' : ''}${Math.abs(v).toLocaleString('it-IT', { minimumFractionDigits:2, maximumFractionDigits:2 })}%`;
    const cls = v => v == null ? 'neu' : v > 0 ? 'pos' : v < 0 ? 'neg' : 'neu';

    /** Linea sottile dell'ultimo periodo, disegnata a mano (niente librerie). */
    function sparkSvg(series, up) {
      if (!series || series.length < 2) return '';
      const w = 300, h = 54, min = Math.min(...series), max = Math.max(...series), r = max - min || 1;
      const pts = series.map((v, i) => [i / (series.length - 1) * w, h - 4 - (v - min) / r * (h - 8)]);
      const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
      const c = up ? '#22a85e' : '#e05070';
      return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="spark" aria-hidden="true">
        <path d="${d}L${w} ${h}L0 ${h}Z" fill="${c}" opacity=".10"/><path d="${d}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
    }
    function rangeBar(q) {
      if (!q.hi52 || q.hi52 === q.lo52) return '';
      const pos = Math.max(0, Math.min(100, (q.price - q.lo52) / (q.hi52 - q.lo52) * 100));
      return `<div class="rng"><span>${fmtPrice(q.lo52, q.currency)}</span><div class="rng-bar"><i style="left:${pos}%"></i></div><span>${fmtPrice(q.hi52, q.currency)}</span></div>
        <div class="rng-cap">Minimo e massimo degli ultimi 12 mesi</div>`;
    }

    function renderAssets() {
      const container = document.getElementById('assets-container');
      const list = ASSETS.filter(a => activeFilter === 'all' || a.type === activeFilter);
      if (quotesErr && !Object.keys(quotes).length) {
        container.innerHTML = `<div class="q-empty">I prezzi non sono ancora disponibili.<br/>Si aggiornano da soli ogni 30 minuti: riprova tra poco.</div>`;
        return;
      }
      // media del periodo scelto sui titoli mostrati
      const vals = list.map(a => quotes[a.ticker]?.[period]).filter(v => v != null);
      const avg = vals.length ? vals.reduce((s, v) => s + v, 0) / vals.length : null;
      const plabel = PERIODS.find(p => p[0] === period)[1];
      container.innerHTML = `
        <div class="q-sum ${cls(avg)}"><span>${esc(plabel)} · media dei ${list.length} titoli</span><b>${fmtPct(avg)}</b></div>
        ${list.map(a => {
          const q = quotes[a.ticker];
          if (!q) return `<div class="asset-card"><div class="asset-header"><div><span class="asset-name">${esc(a.name)}</span><div class="asset-ticker">${a.ticker}</div></div><div class="asset-right"><div class="asset-price" style="font-size:.8rem;color:var(--muted)">Non disponibile</div></div></div></div>`;
          const v = q[period], open = openTicker === a.ticker;
          const up = (q.spark.at(-1) ?? 0) >= (q.spark[0] ?? 0);
          return `<div class="asset-card${open ? ' open' : ''}" data-t="${a.ticker}">
            <div class="asset-header">
              <div>
                <span class="asset-name">${esc(a.name)}</span><span class="asset-type-badge">${a.type === 'etf' ? 'ETF' : 'Azione'}</span>
                <div class="asset-ticker">${a.ticker}</div>
              </div>
              <div class="asset-right">
                <div class="asset-price">${fmtPrice(q.price, q.currency)}</div>
                <div class="q-pill ${cls(v)}">${fmtPct(v)}</div>
              </div>
            </div>
            <div class="chart-wrap">${sparkSvg(q.spark, up)}</div>
            ${open ? `<div class="q-grid">${PERIODS.map(([k, l]) => `<div><span>${esc(l)}</span><b class="${cls(q[k])}">${fmtPct(q[k])}</b></div>`).join('')}</div>${rangeBar(q)}
              <div class="q-asof">Ultimo prezzo: ${new Date(q.asof).toLocaleString('it-IT', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })}</div>` : ''}
          </div>`;
        }).join('')}`;
    }

    async function loadAllAssets() {
      const label = document.getElementById('last-updated-label');
      const btn = document.getElementById('btn-refresh');
      label.textContent = 'Aggiornamento…'; btn.disabled = true;
      try {
        const r = await fetch('data/mercati.json?_=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json();
        quotes = j.quotes || {}; quotesAt = j.updated ? new Date(j.updated) : null; quotesErr = false;
      } catch { quotesErr = true; }
      renderAssets();
      label.textContent = quotesAt
        ? `Prezzi di ${quotesAt.toLocaleString('it-IT', { weekday:'short', hour:'2-digit', minute:'2-digit' })} · ritardo ~15 min`
        : '';
      btn.disabled = false;
    }

    document.getElementById('filter-row').addEventListener('click', e => {
      const chip = e.target.closest('.filter-chip');
      if (!chip) return;
      document.querySelectorAll('#filter-row .filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeFilter = chip.dataset.filter;
      renderAssets();
    });
    document.getElementById('period-row').addEventListener('click', e => {
      const chip = e.target.closest('.filter-chip');
      if (!chip) return;
      document.querySelectorAll('#period-row .filter-chip').forEach(c => c.classList.toggle('active', c === chip));
      period = chip.dataset.p;
      renderAssets();
    });
    document.getElementById('assets-container').addEventListener('click', e => {
      const c = e.target.closest('.asset-card[data-t]');
      if (!c) return;
      openTicker = openTicker === c.dataset.t ? null : c.dataset.t;
      renderAssets();
    });
    document.getElementById('btn-refresh').addEventListener('click', loadAllAssets);

    /* ══════════════════════════════════════════
       TAB 2 — PLANNING SPESA (Firestore sync)
    ══════════════════════════════════════════ */
    let accounts   = [];
    let categories = [];
    let expenses   = [];

    // editing state
    let editAccDocId = null;
    let editCatDocId = null;
    let editExpDocId = null;
    let newExpCatId  = null;  // categoria target per nuova spesa

    function fmtEur(n) {
      return '€\u202f' + (n || 0).toLocaleString('it-IT', { minimumFractionDigits:2, maximumFractionDigits:2 });
    }
    function monthly(exp) {
      return exp.freq === 'annual' ? (exp.amount || 0) / 12 : (exp.amount || 0);
    }
    // Valore con segno: entrate positive, uscite negative
    function monthlyNet(exp) {
      const m = monthly(exp);
      return exp.tipo === 'entrata' ? m : -m;
    }

    /* ── render accounts (espandibili con dettaglio per conto) ── */
    function renderAccounts() {
      const el = document.getElementById('accounts-list');
      if (!accounts.length) {
        el.innerHTML = '<div style="font-size:.72rem;color:var(--muted);text-align:center;padding:8px 0 12px;letter-spacing:.08em;">Nessun conto aggiunto</div>';
        return;
      }
      el.innerHTML = accounts.map(a => {
        const accExps = expenses.filter(e => e.accountId === a._docId);
        const entrate = accExps.filter(e => e.tipo === 'entrata');
        const uscite  = accExps.filter(e => e.tipo !== 'entrata'); // default uscita
        const totEntM = entrate.reduce((s, e) => s + monthly(e), 0);
        const totUscM = uscite.reduce((s, e) => s + monthly(e), 0);
        const saldoM  = totEntM - totUscM;
        const saldoA  = saldoM * 12;
        const balCls  = saldoM >= 0 ? 'pos' : 'neg';

        const expItemsHtml = accExps.length ? accExps.map(exp => {
          const isEnt = exp.tipo === 'entrata';
          const m = monthly(exp);
          return `<div class="account-exp-item">
            <span class="account-exp-title">${esc(exp.title)}</span>
            <span class="account-exp-badge ${isEnt ? 'entrata' : 'uscita'}">${isEnt ? 'entrata' : 'uscita'}</span>
            <span class="account-exp-amount ${isEnt ? 'pos' : 'neg'}">${isEnt ? '+' : '-'}${fmtEur(m)}</span>
          </div>`;
        }).join('') : '<div style="font-size:.66rem;color:var(--muted);padding:4px 0;">Nessuna voce associata</div>';

        const docId = a._docId;
        return `
          <div class="account-card" id="acc-card-${docId}">
            <div class="account-card-header" onclick="toggleAccDetail('${docId}')">
              <div class="account-icon">🏦</div>
              <div class="account-info">
                <div class="account-name">${esc(a.name)}</div>
                <div class="account-meta">${a.holder || ''}${a.iban ? ' · ' + a.iban : ''}</div>
              </div>
              <div class="account-balance">
                <div class="account-balance-val ${balCls}">${saldoM >= 0 ? '+' : ''}${fmtEur(saldoM)}</div>
                <div class="account-balance-label">saldo/mese</div>
              </div>
              <div class="account-chevron" id="chev-${docId}">▼</div>
            </div>
            <div class="account-detail" id="detail-${docId}">
              <div class="account-detail-row">
                <span class="account-detail-label">Entrate mensili</span>
                <span class="account-detail-value pos">+${fmtEur(totEntM)}</span>
              </div>
              <div class="account-detail-row">
                <span class="account-detail-label">Uscite mensili</span>
                <span class="account-detail-value neg">-${fmtEur(totUscM)}</span>
              </div>
              <div class="account-detail-row" style="border-top:1px solid var(--border);margin-top:6px;padding-top:6px;">
                <span class="account-detail-label">Saldo mensile</span>
                <span class="account-detail-value ${balCls}">${saldoM >= 0 ? '+' : ''}${fmtEur(saldoM)}</span>
              </div>
              <div class="account-detail-row">
                <span class="account-detail-label">Saldo annuale</span>
                <span class="account-detail-value ${balCls}">${saldoA >= 0 ? '+' : ''}${fmtEur(saldoA)}</span>
              </div>
              <div class="account-exp-list">${expItemsHtml}</div>
              <div style="display:flex;gap:8px;margin-top:12px;">
                <button class="icon-btn" style="flex:1;border:1px solid var(--border);border-radius:10px;gap:6px;font-size:.7rem;color:var(--muted);padding:7px;" onclick="openEditAcc('${docId}')">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
                  Modifica
                </button>
                <button class="icon-btn del" style="flex:1;border:1px solid var(--red);border-radius:10px;gap:6px;font-size:.7rem;padding:7px;" onclick="doDelAcc('${docId}')">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/></svg>
                  Elimina
                </button>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    window.toggleAccDetail = function(docId) {
      const det  = document.getElementById('detail-' + docId);
      const chev = document.getElementById('chev-' + docId);
      const open = det.classList.toggle('open');
      chev.classList.toggle('open', open);
    };

    /* ── render categories + expenses ── */
    function renderCategories() {
      const el = document.getElementById('categories-list');
      if (!categories.length) {
        el.innerHTML = '<div style="font-size:.72rem;color:var(--muted);text-align:center;padding:8px 0 12px;letter-spacing:.08em;">Nessuna categoria aggiunta</div>';
        updateGrandSummary();
        return;
      }
      let html = '';
      categories.forEach(cat => {
        const exps = expenses.filter(e => e.catId === cat._docId);
        // netto categoria: entrate +, uscite -
        const catNetM  = exps.reduce((s, e) => s + monthlyNet(e), 0);
        const catNetA  = catNetM * 12;
        const catCls   = catNetM >= 0 ? '#22a85e' : 'var(--red)';

        const expsHtml = exps.length ? exps.map(exp => {
          const accName = (accounts.find(a => a._docId === exp.accountId) || {}).name || '';
          const m = monthly(exp);
          const isEnt = exp.tipo === 'entrata';
          return `
            <div class="expense-row">
              <div class="expense-info">
                <div class="expense-title-text">
                  ${esc(exp.title)}
                  <span class="tipo-badge ${isEnt ? 'entrata' : 'uscita'}">${isEnt ? 'entrata' : 'uscita'}</span>
                </div>
                <div class="expense-meta">${accName ? accName + ' · ' : ''}${exp.year || ''}${exp.freq === 'annual' ? ' · annuale' : ''}</div>
              </div>
              <div class="expense-right">
                <div class="expense-amount" style="color:${isEnt ? '#22a85e' : 'var(--red)'};">${isEnt ? '+' : '-'}${fmtEur(m)}<span style="font-size:.52rem;font-weight:400;color:var(--muted)">/mese</span></div>
                ${exp.freq === 'annual' ? `<div class="expense-sub">${isEnt ? '+' : '-'}${fmtEur(exp.amount)}/anno</div>` : ''}
              </div>
              <div style="display:flex;flex-direction:column;gap:2px;flex-shrink:0;">
                <button class="icon-btn" onclick="openEditExp('${exp._docId}')">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
                </button>
                <button class="icon-btn del" onclick="doDelExp('${exp._docId}')">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/></svg>
                </button>
              </div>
            </div>`;
        }).join('') : '<div style="font-size:.66rem;color:var(--muted);padding:6px 0 8px;letter-spacing:.06em;">Nessuna voce — premi + per aggiungere</div>';

        html += `
          <div class="cat-block">
            <div class="cat-block-header">
              <div class="cat-block-name">📁 ${esc(cat.name)}</div>
              <div class="cat-block-actions">
                <button class="icon-btn" title="Aggiungi voce" onclick="openNewExp('${cat._docId}')">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
                <button class="icon-btn" title="Modifica categoria" onclick="openEditCat('${cat._docId}')">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
                </button>
                <button class="icon-btn del" title="Elimina categoria" onclick="doDelCat('${cat._docId}')">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/></svg>
                </button>
              </div>
            </div>
            ${expsHtml}
            <div class="cat-totals">
              <span class="cat-total-label">Netto ${esc(cat.name)}</span>
              <div style="text-align:right;">
                <div class="cat-total-value" style="color:${catCls};">${catNetM >= 0 ? '+' : ''}${fmtEur(catNetM)}<span style="font-size:.58rem;font-weight:400;color:var(--muted)">/mese</span></div>
                <div style="font-size:.6rem;color:var(--muted);">${catNetA >= 0 ? '+' : ''}${fmtEur(catNetA)}/anno</div>
              </div>
            </div>
          </div>`;
      });
      el.innerHTML = html;
      updateGrandSummary();
    }

    function updateGrandSummary() {
      try { renderPlanMap(); } catch (e) { console.warn('mappa spese', e); }
      const netMonthly  = expenses.reduce((s, e) => s + monthlyNet(e), 0);
      const totEntrate  = expenses.filter(e => e.tipo === 'entrata').reduce((s, e) => s + monthly(e), 0);
      const totUscite   = expenses.filter(e => e.tipo !== 'entrata').reduce((s, e) => s + monthly(e), 0);
      const cls = netMonthly >= 0 ? '#22a85e' : 'var(--red)';
      document.getElementById('grand-monthly').textContent = (netMonthly >= 0 ? '+' : '') + fmtEur(netMonthly);
      document.getElementById('grand-annual').textContent  = (netMonthly >= 0 ? '+' : '') + fmtEur(netMonthly * 12);
      // aggiorna colore saldo netto
      document.getElementById('grand-monthly').style.color = cls;
      document.getElementById('grand-annual').style.color  = cls;
      // dettaglio entrate/uscite nel summary
      document.getElementById('grand-entrate').textContent = '+' + fmtEur(totEntrate);
      document.getElementById('grand-uscite').textContent  = '-' + fmtEur(totUscite);
    }

    function populateExpSelects(catId) {
      const catSel    = document.getElementById('exp-category');
      const accSel    = document.getElementById('exp-account');
      const toAccSel  = document.getElementById('exp-to-account');
      const accOpts   = accounts.map(a => `<option value="${a._docId}">${esc(a.name)}</option>`).join('');
      catSel.innerHTML = '<option value="">-- seleziona --</option>' +
        categories.map(c => `<option value="${c._docId}">${esc(c.name)}</option>`).join('');
      accSel.innerHTML  = '<option value="">-- nessuno --</option>' + accOpts;
      toAccSel.innerHTML = '<option value="">-- seleziona --</option>' + accOpts;
      if (catId) catSel.value = catId;
    }

    // toggle visibilità riga giroconto
    document.querySelectorAll('input[name="exp-tipo"]').forEach(r =>
      r.addEventListener('change', () => {
        const row = document.getElementById('giroconto-row');
        row.classList.toggle('visible', document.querySelector('input[name="exp-tipo"]:checked').value === 'giroconto');
      })
    );

    /* ── Account handlers ── */
    window.openEditAcc = function(docId) {
      editAccDocId = docId;
      const a = accounts.find(x => x._docId === docId);
      document.getElementById('modal-account-title').textContent = 'Modifica conto';
      document.getElementById('acc-name').value   = a.name   || '';
      document.getElementById('acc-holder').value = a.holder || '';
      document.getElementById('acc-iban').value   = a.iban   || '';
      document.getElementById('modal-account').classList.add('open');
    };
    window.doDelAcc = async function(docId) {
      if (!confirm('Eliminare questo conto?')) return;
      await deleteFinanzaAccount(docId);
    };

    document.getElementById('btn-add-account').addEventListener('click', () => {
      editAccDocId = null;
      document.getElementById('modal-account-title').textContent = 'Nuovo conto corrente';
      ['acc-name','acc-holder','acc-iban'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('modal-account').classList.add('open');
    });
    document.getElementById('btn-acc-cancel').addEventListener('click', () => closeModal('modal-account'));
    document.getElementById('btn-acc-save').addEventListener('click', async () => {
      const name   = document.getElementById('acc-name').value.trim();
      const holder = document.getElementById('acc-holder').value.trim();
      const iban   = document.getElementById('acc-iban').value.trim();
      if (!name) { document.getElementById('acc-name').focus(); return; }
      if (editAccDocId) {
        await updateFinanzaAccount(editAccDocId, { name, holder, iban });
      } else {
        await addFinanzaAccount({ name, holder, iban });
      }
      closeModal('modal-account');
    });

    /* ── Category handlers ── */
    window.openEditCat = function(docId) {
      editCatDocId = docId;
      const c = categories.find(x => x._docId === docId);
      document.getElementById('modal-cat-title').textContent = 'Modifica categoria';
      document.getElementById('cat-name-input').value = c.name || '';
      document.getElementById('modal-category').classList.add('open');
    };
    window.doDelCat = async function(docId) {
      if (!confirm('Eliminare questa categoria e tutte le sue spese?')) return;
      const expsToDelete = expenses.filter(e => e.catId === docId);
      await Promise.all(expsToDelete.map(e => deleteFinanzaExpense(e._docId)));
      await deleteFinanzaCategory(docId);
    };

    document.getElementById('btn-add-category').addEventListener('click', () => {
      editCatDocId = null;
      document.getElementById('modal-cat-title').textContent = 'Nuova categoria';
      document.getElementById('cat-name-input').value = '';
      document.getElementById('modal-category').classList.add('open');
    });
    document.getElementById('btn-cat-cancel').addEventListener('click', () => closeModal('modal-category'));
    document.getElementById('btn-cat-save').addEventListener('click', async () => {
      const name = document.getElementById('cat-name-input').value.trim();
      if (!name) { document.getElementById('cat-name-input').focus(); return; }
      if (editCatDocId) {
        await updateFinanzaCategory(editCatDocId, { name });
      } else {
        await addFinanzaCategory({ name });
      }
      closeModal('modal-category');
    });

    /* ── Expense handlers ── */
    window.openNewExp = function(catId) {
      editExpDocId = null;
      newExpCatId  = catId;
      document.getElementById('modal-expense-title').textContent = 'Nuova voce';
      document.getElementById('exp-title').value  = '';
      document.getElementById('exp-amount').value = '';
      document.getElementById('exp-year').value   = new Date().getFullYear();
      document.getElementById('freq-monthly').checked = true;
      document.getElementById('tipo-uscita').checked  = true;
      document.getElementById('giroconto-row').classList.remove('visible');
      populateExpSelects(catId);
      document.getElementById('modal-expense').classList.add('open');
    };
    window.openEditExp = function(docId) {
      editExpDocId = docId;
      const exp = expenses.find(e => e._docId === docId);
      document.getElementById('modal-expense-title').textContent = 'Modifica voce';
      document.getElementById('exp-title').value  = exp.title  || '';
      document.getElementById('exp-amount').value = exp.amount || '';
      document.getElementById('exp-year').value   = exp.year   || new Date().getFullYear();
      const tipoVal = exp.tipo === 'giroconto' ? 'giroconto' : (exp.tipo || 'uscita');
      document.querySelector(`input[name="exp-freq"][value="${exp.freq || 'monthly'}"]`).checked = true;
      document.querySelector(`input[name="exp-tipo"][value="${tipoVal}"]`).checked = true;
      document.getElementById('giroconto-row').classList.toggle('visible', tipoVal === 'giroconto');
      populateExpSelects(exp.catId);
      document.getElementById('exp-account').value    = exp.accountId   || '';
      document.getElementById('exp-to-account').value = exp.toAccountId || '';
      document.getElementById('modal-expense').classList.add('open');
    };
    window.doDelExp = async function(docId) {
      if (!confirm('Eliminare questa voce?')) return;
      await deleteFinanzaExpense(docId);
    };

    document.getElementById('btn-exp-cancel').addEventListener('click', () => closeModal('modal-expense'));
    document.getElementById('btn-exp-save').addEventListener('click', async () => {
      const title       = document.getElementById('exp-title').value.trim();
      const amount      = parseFloat(document.getElementById('exp-amount').value);
      const freq        = document.querySelector('input[name="exp-freq"]:checked').value;
      const tipo        = document.querySelector('input[name="exp-tipo"]:checked').value;
      const catId       = document.getElementById('exp-category').value;
      const accountId   = document.getElementById('exp-account').value;
      const toAccountId = document.getElementById('exp-to-account').value;
      const year        = document.getElementById('exp-year').value;
      if (!title || isNaN(amount) || amount <= 0 || !catId) return;
      const data = { title, amount, freq, tipo, catId, accountId, year,
                     toAccountId: tipo === 'giroconto' ? toAccountId : '' };
      if (editExpDocId) {
        await updateFinanzaExpense(editExpDocId, data);
      } else {
        await addFinanzaExpense(data);
      }
      closeModal('modal-expense');
    });

    /* ══════════════════════════════════════════
       MAPPA DEI FLUSSI (Patrimonio) e RIPARTIZIONE (Planning)
    ══════════════════════════════════════════ */
    const PALETTE = ['#6F9FD8', '#9B86C9', '#7FAE82', '#E0A15A', '#D77A8F', '#5FB3AE', '#C9B458', '#A98B6C', '#8E9AA8', '#D98B6A'];
    const annual = e => monthly(e) * 12;
    const isOut = e => e.tipo !== 'entrata' && e.tipo !== 'giroconto';
    const catName = id => (categories.find(c => c._docId === id) || {}).name || '';
    const accName = id => (accounts.find(a => a._docId === id) || {}).name || '';
    const eur0 = n => '€ ' + Math.round(n).toLocaleString('it-IT');

    function openLeaf(e) {
      const isMove = e.tipo === 'giroconto', isEnt = e.tipo === 'entrata';
      const sign = isEnt ? '+' : isMove ? '' : '−', col = isEnt ? '#22a85e' : isMove ? '#7C5CD8' : 'var(--red)';
      const sh = createSheet({ title: e.title, body: `<div class="mp-det">
        <div><span>${isEnt ? 'Entrata' : isMove ? 'Spostamento' : 'Uscita'} al mese</span><b style="color:${col}">${sign}${fmtEur(monthly(e))}</b></div>
        <div><span>All'anno</span><b>${sign}${fmtEur(annual(e))}</b></div>
        <div><span>${isMove ? 'Da' : 'Conto'}</span><b style="font-size:.85rem">${esc(accName(e.accountId) || '—')}</b></div>
        <div><span>${isMove ? 'Verso' : 'Categoria'}</span><b style="font-size:.85rem">${esc(isMove ? accName(e.toAccountId) || '—' : catName(e.catId) || '—')}</b></div></div>
        <button type="button" class="btn-primary" id="lf-edit" style="width:100%">Modifica</button>` });
      sh.$('#lf-edit').addEventListener('click', () => { sh.close(); window.openEditExp(e._docId); });
      sh.open();
    }

    /* ── PATRIMONIO: diagramma dei flussi ── */
    const patState = { per: 'year', sel: null };
    let patFlow = null, patModel = null;
    function buildFlow() {
      const k = patState.per === 'year' ? 12 : 1, v = e => monthly(e) * k;
      const accs = accounts.map((a, i) => ({ id: 'a:' + a._docId, label: a.name, color: PALETTE[i % PALETTE.length], _acc: a._docId }));
      const orphan = expenses.some(e => !e.accountId && e.tipo !== 'giroconto');
      if (orphan) accs.push({ id: 'a:none', label: 'Senza conto', color: '#8E9AA8', _acc: '' });
      const accId = id => (id ? 'a:' + id : 'a:none');
      const ins = expenses.filter(e => e.tipo === 'entrata'), outs = expenses.filter(isOut), moves = expenses.filter(e => e.tipo === 'giroconto' && e.accountId && e.toAccountId);
      // entrate: una per voce (se sono tante, per categoria)
      const byCatIn = ins.length > 8;
      const incMap = {};
      ins.forEach(e => { const id = byCatIn ? 'i:' + e.catId : 'i:' + e._docId; (incMap[id] ||= { id, label: byCatIn ? (catName(e.catId) || 'Entrate') : e.title, value: 0, color: '#4FA36C', exps: [] }); incMap[id].value += v(e); incMap[id].exps.push(e); });
      const outMap = {};
      outs.forEach(e => { const id = 'o:' + e.catId; (outMap[id] ||= { id, label: catName(e.catId) || 'Altro', value: 0, color: '#D9786A', exps: [] }); outMap[id].value += v(e); outMap[id].exps.push(e); });
      const links = [];
      ins.forEach(e => links.push({ from: byCatIn ? 'i:' + e.catId : 'i:' + e._docId, to: accId(e.accountId), value: v(e), kind: 'in', exps: [e] }));
      outs.forEach(e => links.push({ from: accId(e.accountId), to: 'o:' + e.catId, value: v(e), kind: 'out', exps: [e] }));
      moves.forEach(e => links.push({ from: accId(e.accountId), to: accId(e.toAccountId), value: v(e), kind: 'move', exps: [e] }));
      // colori delle uscite: sfumature di corallo/arancio
      const WARM = ['#D9786A', '#E3935E', '#C9615A', '#E8A87C', '#D4806F', '#B9584F'];
      const expenses2 = Object.values(outMap).sort((a, b) => b.value - a.value).map((n, i) => ({ ...n, color: WARM[i % WARM.length] }));
      const GREEN = ['#4FA36C', '#6BB886', '#3E8F5C', '#86C79C', '#5DAE78'];
      const incomes2 = Object.values(incMap).sort((a, b) => b.value - a.value).map((n, i) => ({ ...n, color: GREEN[i % GREEN.length] }));
      return { incomes: incomes2, accounts: accs, expenses: expenses2, links };
    }
    function flowDetail(model, sel) {
      const box = document.getElementById('pat-detail');
      if (!sel) { box.innerHTML = '<p class="mp-note">Tocca un rettangolo per isolare i suoi flussi: vedi da dove arrivano i soldi e dove vanno. Tocca di nuovo o sullo sfondo per tornare alla vista completa. Il diagramma si fa scorrere con il dito.</p>'; return; }
      const node = [...model.incomes, ...model.accounts, ...model.expenses].find(n => n.id === sel); if (!node) { box.innerHTML = ''; return; }
      const rows = [];
      model.links.filter(l => l.from === sel || l.to === sel).forEach(l => {
        const other = [...model.incomes, ...model.accounts, ...model.expenses].find(n => n.id === (l.from === sel ? l.to : l.from));
        const incoming = l.to === sel;
        l.exps.forEach(e => rows.push({ e, k: l.kind, incoming, other: other?.label || '', val: l.exps.length === 1 ? l.value : monthly(e) * (patState.per === 'year' ? 12 : 1) }));
      });
      const sumIn = rows.filter(r => r.incoming && r.k !== 'move').reduce((s, r) => s + r.val, 0), sumOut = rows.filter(r => !r.incoming && r.k !== 'move').reduce((s, r) => s + r.val, 0);
      const mvIn = rows.filter(r => r.k === 'move' && r.incoming).reduce((s, r) => s + r.val, 0), mvOut = rows.filter(r => r.k === 'move' && !r.incoming).reduce((s, r) => s + r.val, 0);
      const pill = (t, v, c) => v ? `<span class="fl-pill" style="--c:${c}">${t} ${eur0(v)}</span>` : '';
      box.innerHTML = `<div class="fl-det"><div class="fl-det-h"><b>${esc(node.label)}</b><div>${pill('Entra', sumIn, '#4FA36C')}${pill('Esce', sumOut, '#D9786A')}${pill('Spostamenti in', mvIn, '#7C5CD8')}${pill('Spostamenti out', mvOut, '#7C5CD8')}</div></div>
        <div class="mp-list">${rows.sort((a, b) => b.val - a.val).map((r, i) => `<button type="button" class="mp-row" data-r="${i}"><span class="mp-dot" style="background:${r.k === 'in' ? '#4FA36C' : r.k === 'move' ? '#7C5CD8' : '#D9786A'}"></span>
          <span class="n">${esc(r.e.title)}<small>${r.k === 'move' ? (r.incoming ? 'da ' : 'verso ') + esc(r.other) : esc(r.incoming ? 'da ' + r.other : 'verso ' + r.other)}</small></span><span class="a ${r.k === 'in' ? 'pos' : r.k === 'move' ? '' : 'neg'}">${r.k === 'in' ? '+' : r.k === 'move' ? '' : '−'}${eur0(r.val)}</span></button>`).join('')}</div></div>`;
      box._rows = rows.sort((a, b) => b.val - a.val);
    }
    function renderPatrimonio() {
      const root = document.getElementById('pat-root');
      if (!accounts.length) { root.innerHTML = '<div class="mp-card"><div class="tm-empty">Aggiungi dei conti nel tab <b>Planning</b> per vedere qui la mappa del tuo patrimonio.</div></div>'; patFlow = null; return; }
      if (!root.querySelector('#pat-fl')) {
        root.innerHTML = `<div class="mp-card"><div id="pat-hero"></div>
          <div class="mp-seg" id="pat-seg"><button data-p="month">Al mese</button><button data-p="year">All'anno</button><button data-move class="move">⇄ Registra uno spostamento</button></div>
          <div id="pat-fl"></div><div id="pat-detail"></div></div>`;
        patFlow = mountFlow(root.querySelector('#pat-fl'), { fmt: v => eur0(v), onSelect: id => { patState.sel = id; flowDetail(patModel, id); } });
        root.querySelector('#pat-seg').addEventListener('click', e => {
          const p = e.target.closest('[data-p]'); if (p) { patState.per = p.dataset.p; renderPatrimonio(); return; }
          if (e.target.closest('[data-move]')) {
            if (!categories.length) return alert('Crea prima una categoria (per esempio "Mutuo" o "Spostamenti") nel tab Planning: ti serve per registrare lo spostamento.');
            window.openNewExp(categories[0]._docId);
            document.getElementById('tipo-giroconto').checked = true; document.getElementById('giroconto-row').classList.add('visible');
          }
        });
        root.querySelector('#pat-detail').addEventListener('click', e => { const r = e.target.closest('[data-r]'); const box = document.getElementById('pat-detail'); if (r && box._rows) openLeaf(box._rows[+r.dataset.r].e); });
      }
      const k = patState.per === 'year' ? 12 : 1;
      const net = expenses.filter(e => e.tipo !== 'giroconto').reduce((s, e) => s + monthlyNet(e) * 12, 0);
      document.getElementById('pat-hero').innerHTML = `<div class="mp-hero"><span class="l">Patrimonio stimato</span><span class="v ${net < 0 ? 'neg' : ''}">${net < 0 ? '−' : ''}${eur0(Math.abs(net))}</span><span class="s">Saldo annuo (entrate − uscite × 12) · ${accounts.length} ${accounts.length === 1 ? 'conto' : 'conti'}</span></div>`;
      root.querySelectorAll('#pat-seg [data-p]').forEach(b => b.classList.toggle('on', b.dataset.p === patState.per));
      patModel = buildFlow();
      if (patState.sel && ![...patModel.incomes, ...patModel.accounts, ...patModel.expenses].some(n => n.id === patState.sel)) patState.sel = null;
      patFlow.show({ ...patModel, selected: patState.sel });
      flowDetail(patModel, patState.sel);
    }

    /* ── PLANNING: ripartizione di entrate e uscite ── */
    const plState = { tipo: 'uscita', per: 'month', open: null };
    function renderPlanMap() {
      const host = document.getElementById('pl-map');
      if (!host) return;
      if (!host.querySelector('#pl-body')) {
        host.innerHTML = `<div class="mp-card"><div class="mp-seg" id="pl-seg1"><button data-t="uscita">Uscite</button><button data-t="entrata">Entrate</button></div>
          <div class="mp-seg" id="pl-seg2"><button data-p="month">Al mese</button><button data-p="year">All'anno</button></div><div id="pl-body"></div></div>`;
        host.addEventListener('click', e => {
          const t = e.target.closest('[data-t]'); if (t) { plState.tipo = t.dataset.t; plState.open = null; return renderPlanMap(); }
          const p = e.target.closest('[data-p]'); if (p) { plState.per = p.dataset.p; return renderPlanMap(); }
          const c = e.target.closest('[data-cat]'); if (c) { plState.open = plState.open === c.dataset.cat ? null : c.dataset.cat; return renderPlanMap(); }
          const x = e.target.closest('[data-exp]'); if (x) { const ex = expenses.find(q => q._docId === x.dataset.exp); if (ex) openLeaf(ex); }
        });
      }
      host.querySelectorAll('#pl-seg1 button').forEach(b => b.classList.toggle('on', b.dataset.t === plState.tipo));
      host.querySelectorAll('#pl-seg2 button').forEach(b => b.classList.toggle('on', b.dataset.p === plState.per));
      const k = plState.per === 'year' ? 12 : 1, ent = plState.tipo === 'entrata';
      const all = expenses.filter(e => (ent ? e.tipo === 'entrata' : isOut(e)));
      const total = all.reduce((s, e) => s + monthly(e) * k, 0);
      const cats = categories.map((c, i) => ({ c, color: PALETTE[i % PALETTE.length], ex: all.filter(e => e.catId === c._docId) })).map(x => ({ ...x, v: x.ex.reduce((s, e) => s + monthly(e) * k, 0) })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
      document.getElementById('pl-body').innerHTML = `<div class="mp-hero"><span class="l">${ent ? 'Entrate' : 'Uscite'} · ${plState.per === 'year' ? "all'anno" : 'al mese'}</span><span class="v ${ent ? '' : 'neg'}">${ent ? '+' : '−'}${eur0(total)}</span><span class="s">${all.length} ${all.length === 1 ? 'voce' : 'voci'} in ${cats.length} ${cats.length === 1 ? 'categoria' : 'categorie'}</span></div>
        ${cats.length ? `<div class="pl-bar">${cats.map(x => `<i style="flex:${x.v};background:${x.color}" title="${esc(x.c.name)}"></i>`).join('')}</div>
        <div class="pl-rows">${cats.map(x => `<div class="pl-cat${plState.open === x.c._docId ? ' open' : ''}"><button type="button" class="pl-head" data-cat="${esc(x.c._docId)}"><span class="mp-dot" style="background:${x.color}"></span>
          <span class="n">${esc(x.c.name)}<small>${Math.round(x.v / total * 100)}% · ${x.ex.length} ${x.ex.length === 1 ? 'voce' : 'voci'}</small></span><span class="a ${ent ? 'pos' : 'neg'}">${ent ? '+' : '−'}${eur0(x.v)}</span></button>
          <div class="pl-fill"><i style="width:${x.v / total * 100}%;background:${x.color}"></i></div>
          ${plState.open === x.c._docId ? `<div class="pl-ex">${x.ex.sort((a, b) => b.amount - a.amount).map(e => `<button type="button" class="mp-row" data-exp="${esc(e._docId)}"><span class="n">${esc(e.title)}<small>${esc(accName(e.accountId))}${e.freq === 'annual' ? ' · annuale' : ''}</small></span><span class="a">${eur0(monthly(e) * k)}</span></button>`).join('')}</div>` : ''}</div>`).join('')}</div>`
          : `<div class="tm-empty">Nessuna ${ent ? 'entrata' : 'uscita'} registrata.</div>`}`;
    }

    /* ── helpers ── */
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }
    document.querySelectorAll('.modal-overlay').forEach(o =>
      o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); }));

    /* ══ INIT ══ */
    waitForAuth().then(() => {
      document.body.style.visibility = '';

      // Firestore realtime listeners
      subscribeFinanzaAccounts(list => {
        accounts = list;
        renderAccounts();
        renderCategories();
        renderPatrimonio();
      });
      subscribeFinanzaCategories(list => {
        categories = list;
        renderCategories();
      });
      subscribeFinanzaExpenses(list => {
        expenses = list;
        renderCategories();
        renderPatrimonio();
      });

      // Andamento: avvia dopo piccolo delay così il DOM è pronto
      setTimeout(loadAllAssets, 300);
    });
  </script>
</body>
</html>
