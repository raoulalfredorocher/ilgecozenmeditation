<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Il Geco Zen"/>
  <meta name="theme-color" content="#FAF7F2"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" href="assets/icons/favicon-48.png"/>
  <title>Il Geco Zen — Giochi</title>
  <script src="js/ui/theme-boot.js"></script>
  <link rel="stylesheet" href="styles/tokens.css"/>
  <link rel="stylesheet" href="styles/zen.css"/>
  <link rel="stylesheet" href="styles/giochi.css"/>
</head>
<!-- Giochi: videogiochi (Switch, Switch 2…), giochi da tavolo e di ruolo. Logica in js/pages/giochi/ -->
<body class="zen zen-native" data-title="Giochi" data-back="passioni.html" data-add="#gx-add">
  <script type="module" src="js/core/auth-guard.js"></script>
  <template id="zen-header-actions">
    <button class="icon-btn" type="button" id="gx-more" aria-label="Altre azioni">
      <svg class="icon" aria-hidden="true"><use href="#i-more"/></svg>
    </button>
  </template>
  <script type="module" src="js/ui/shell.js"></script>

  <main class="zen-main" style="gap:var(--space-4)">
    <div class="page-tabs">
      <div class="segmented scroll" role="group" aria-label="Sezioni">
        <button type="button" data-tab="todo" aria-pressed="true">Da giocare</button>
        <button type="button" data-tab="done" aria-pressed="false">Finiti</button>
        <button type="button" data-tab="wish" aria-pressed="false">Wishlist</button>
        <button type="button" data-tab="tavolo" aria-pressed="false">Da tavolo</button>
        <button type="button" data-tab="idee" aria-pressed="false">Idee</button>
      </div>
    </div>
    <div class="gx-tools" id="gx-tools">
      <div class="search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input class="input" type="search" id="gx-q" placeholder="Cerca un gioco" autocomplete="off" aria-label="Cerca"/></div>
      <div class="gchips" id="gx-chips" role="group" aria-label="Filtro"></div>
    </div>
    <section class="tab-panel" id="p-todo"></section>
    <section class="tab-panel" id="p-done" hidden></section>
    <section class="tab-panel" id="p-wish" hidden></section>
    <section class="tab-panel" id="p-tavolo" hidden></section>
    <section class="tab-panel" id="p-idee" hidden></section>
    <button type="button" id="gx-add" hidden aria-hidden="true" tabindex="-1"></button>
  </main>
  <script type="module" src="js/pages/giochi/main.js"></script>
</body>
</html>
