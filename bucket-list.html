<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Il Geco Zen"/>
  <meta name="theme-color" content="#FAF7F2"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" href="assets/icons/favicon-48.png"/>
  <title>Il Geco Zen — Bucket List</title>
  <script src="js/ui/theme-boot.js"></script>
  <link rel="stylesheet" href="styles/tokens.css"/>
  <link rel="stylesheet" href="styles/zen.css"/>
  <style>
    .progress-card { display: flex; flex-direction: column; gap: var(--space-3); }
    .progress-card .row b { font-size: var(--fs-2xl); font-weight: 600; letter-spacing: -.02em; }
    .progress-card .pct { margin-left: auto; font-size: var(--fs-lg); font-weight: 600; color: var(--primary); }
    .progress-card .meter-track { height: 8px; }
    .progress-card .meter-fill { background: linear-gradient(90deg, var(--sakura), var(--primary)); }

    .dream { position: relative; }
    .dream .ph { border: 0; padding: 0; width: 100%; cursor: pointer; color: var(--muted); }
    .dream .info { border: 0; background: none; color: inherit; text-align: left; cursor: pointer; width: 100%; font: inherit; }
    .dream .meta { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .dream-check {
      position: absolute; top: 8px; right: 8px; width: 30px; height: 30px;
      background: color-mix(in srgb, var(--card) 85%, transparent); border-color: transparent;
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); color: var(--muted);
    }
    .dream-check[aria-pressed="false"] .icon { opacity: .35; color: var(--text); }
    .dream.is-done .ph img { filter: saturate(.75); }
    .dream.is-done .meta { color: var(--success); }
  </style>
</head>
<!-- Bucket List: logica in js/pages/bucket-list/main.js -->
<body class="zen zen-native" data-title="Bucket List" data-add="#bl-add" style="visibility:hidden">
  <script type="module" src="js/core/auth-guard.js"></script>
  <script type="module" src="js/ui/shell.js"></script>

  <main class="zen-main">
    <section class="card progress-card" aria-label="Avanzamento">
      <div class="row"><span id="bl-count"><b>0</b></span><span class="pct" id="bl-pct">0%</span></div>
      <div class="meter-track"><div class="meter-fill" id="bl-fill" style="width:0"></div></div>
    </section>

    <div class="stack">
      <input class="input" type="search" id="bl-search" placeholder="Cerca un sogno" aria-label="Cerca un sogno"/>
      <div class="segmented" role="group" aria-label="Filtro">
        <button type="button" data-filter="all" aria-pressed="true">Tutti</button>
        <button type="button" data-filter="todo">Da realizzare</button>
        <button type="button" data-filter="done">Realizzati</button>
      </div>
    </div>

    <section class="photo-grid" id="bl-grid" aria-live="polite"></section>
    <button type="button" id="bl-add" hidden aria-hidden="true" tabindex="-1"></button>
  </main>

  <script type="module" src="js/pages/bucket-list/main.js"></script>
</body>
</html>
