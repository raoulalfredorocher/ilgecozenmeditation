<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Il Geco Zen"/>
  <meta name="theme-color" content="#f7f4f9"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <link rel="icon" type="image/png" href="icon-192.png"/>
  <title>Il Geco Zen — Bucket List</title>
  <link rel="stylesheet" href="styles/theme.css?v=8"/>
  <link rel="stylesheet" href="styles/layout.css?v=8"/>
  <style>
    .app-sub-bucket {
      font-size: .48rem;
      letter-spacing: .22em;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ── Schermate ── */
    #screen-list, #screen-completed {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    #screen-list.active, #screen-completed.active { display: flex; }

    /* ── Griglia sogni ── */
    .section-divider {
      width: 100%;
      font-size: .52rem;
      letter-spacing: .26em;
      color: var(--muted);
      text-transform: uppercase;
      text-align: center;
      padding: 2px 0 4px;
    }

    .dreams-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .dream-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: border-color .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .dream-card.done {
      border-color: #22c55e;
    }

    .dream-img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
      flex-shrink: 0;
    }

    .dream-body {
      padding: 9px 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }
    .dream-title {
      font-size: .76rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: .03em;
      line-height: 1.3;
    }
    .dream-desc {
      font-size: .62rem;
      color: var(--muted);
      line-height: 1.45;
      letter-spacing: .02em;
    }

    /* Azioni card: matita + check */
    .dream-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px 9px;
      gap: 6px;
    }

    .btn-edit-card {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      padding: 5px 8px;
      font-size: .7rem;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: inherit;
      letter-spacing: .06em;
      transition: color .2s, border-color .2s;
      flex-shrink: 0;
    }
    .btn-edit-card:active { color: var(--gold); border-color: var(--gold); }

    .btn-check-card {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--card);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s, border-color .2s;
      flex-shrink: 0;
    }
    .btn-check-card svg { opacity: 0; transition: opacity .15s; }
    .dream-card.done .btn-check-card {
      background: #22c55e;
      border-color: #22c55e;
    }
    .dream-card.done .btn-check-card svg { opacity: 1; }

    /* Empty state */
    .empty-dreams {
      width: 100%;
      text-align: center;
      padding: 40px 0 12px;
      font-size: .7rem;
      color: var(--muted);
      letter-spacing: .08em;
      line-height: 1.8;
      display: none;
    }
    .empty-dreams.visible { display: block; }

    /* ── FAB ＋ ── */
    .fab-add {
      position: fixed;
      bottom: calc(68px + env(safe-area-inset-bottom, 0px));
      right: 20px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--gold);
      color: #fff;
      border: none;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 18px rgba(37,115,158,.35);
      z-index: 100;
      transition: transform .12s, background .2s;
    }
    .fab-add:active { transform: scale(.91); }
    /* Nascosto quando siamo nella schermata completati */
    .fab-add.hidden { display: none; }

    /* ── Modal form ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(30,42,56,.52);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 300;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .modal-overlay.open { display: flex; }

    .modal-sheet {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 24px 24px 0 0;
      padding: 20px 20px 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .modal-handle {
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: var(--border);
      margin: 0 auto 4px;
      flex-shrink: 0;
    }
    .modal-title {
      font-size: .72rem;
      letter-spacing: .22em;
      color: var(--muted);
      text-transform: uppercase;
      text-align: center;
      flex-shrink: 0;
    }

    .form-label {
      font-size: .56rem;
      letter-spacing: .18em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: .82rem;
      font-family: inherit;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
    }
    .form-input:focus { border-color: var(--gold); }
    .form-input.error { border-color: var(--red); }

    .form-textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: .78rem;
      font-family: inherit;
      color: var(--text);
      resize: none;
      min-height: 72px;
      outline: none;
      transition: border-color .2s;
    }
    .form-textarea:focus { border-color: var(--gold); }
    .form-textarea.error { border-color: var(--red); }

    .img-upload-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .img-preview {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--border);
      display: none;
      flex-shrink: 0;
    }
    .img-preview.visible { display: block; }
    .btn-img-upload {
      flex: 1;
      background: none;
      border: 1.5px dashed var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: .72rem;
      font-family: inherit;
      letter-spacing: .06em;
      padding: 10px;
      cursor: pointer;
      text-align: center;
      transition: border-color .2s, color .2s;
    }
    .btn-img-upload.error { border-color: var(--red); color: var(--red); }
    .btn-img-upload:active { border-color: var(--gold); color: var(--gold); }
    #img-file-input { display: none; }

    .btn-save-dream {
      width: 100%;
      background: var(--gold);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 12px;
      font-size: .8rem;
      font-family: inherit;
      letter-spacing: .14em;
      cursor: pointer;
      transition: background .2s;
      flex-shrink: 0;
    }
    .btn-save-dream:active { background: var(--accent2); }
    .btn-cancel-modal {
      width: 100%;
      background: none;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      font-size: .76rem;
      font-family: inherit;
      color: var(--muted);
      letter-spacing: .12em;
      cursor: pointer;
      flex-shrink: 0;
    }

    .btn-delete-dream {
      width: 100%;
      background: none;
      border: 1px solid var(--red);
      border-radius: 14px;
      padding: 10px;
      font-size: .76rem;
      font-family: inherit;
      color: var(--red);
      letter-spacing: .12em;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .2s, color .2s;
    }
    .btn-delete-dream:active { background: var(--red); color: #fff; }

    /* ── Schermata completati ── */
    .completed-item {
      width: 100%;
      background: var(--card);
      border: 1px solid #22c55e;
      border-radius: 14px;
      padding: 11px 13px;
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .completed-img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .completed-info { flex: 1; min-width: 0; }
    .completed-title {
      font-size: .78rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: .03em;
    }
    .completed-date {
      font-size: .58rem;
      color: var(--muted);
      letter-spacing: .08em;
      margin-top: 3px;
    }
    .completed-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    /* Deseleziona (torna in lista) */
    .btn-uncheck {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #22c55e;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s;
    }
    .btn-uncheck:active { background: var(--muted); }
    /* Matita nei completati */
    .btn-edit-completed {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      padding: 3px 5px;
      display: flex;
      align-items: center;
      transition: color .2s, border-color .2s;
    }
    .btn-edit-completed:active { color: var(--gold); border-color: var(--gold); }

    .completed-empty {
      width: 100%;
      text-align: center;
      padding: 40px 0 16px;
      font-size: .7rem;
      color: var(--muted);
      letter-spacing: .08em;
      line-height: 1.8;
    }

    /* ── Progress bar bucket list ── */
    .bucket-progress-card {
      width: 100%;
      max-width: 440px;
      margin: 10px auto 14px;
      padding: 12px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-sizing: border-box;
    }
    .bucket-progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: .75rem;
    }
    .bucket-progress-title {
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .bucket-progress-stats {
      font-weight: 700;
      color: var(--gold);
      letter-spacing: .05em;
    }
    .bucket-progress-track {
      width: 100%;
      height: 8px;
      background: var(--surface);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .bucket-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #d4af37, #f39c12);
      border-radius: 999px;
      transition: width .4s cubic-bezier(.4,0,.2,1);
      width: 0%;
    }

    /* ── Filtri bucket list ── */
    .bl-filter-btn {
      flex: 1; padding: 6px 8px; border-radius: 10px; border: 1.5px solid var(--border);
      background: var(--card); color: var(--muted); font-size: .64rem; font-family: inherit;
      cursor: pointer; font-weight: 500; transition: all .2s; text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    .bl-filter-btn.active { background: var(--gold); border-color: var(--gold); color: #fff; font-weight: 600; }

    /* ── Tab bar ── */
    .tab-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(58px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--card);
      border-top: 1px solid var(--border);
      border-radius: 22px 22px 0 0;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 200;
      overflow: visible;
    }
  </style>

    <script type="module">
    import {
      subscribeBucketList,
      addBucketItem,

    } from './js/firebase-config.js';

    /* ── Tema ── */
    const htmlEl   = document.documentElement;
    const btnTheme = document.getElementById('theme-toggle');
    const knob     = document.getElementById('theme-knob');
    let isDark = localStorage.getItem('zen_theme') === 'dark';
    function applyTheme() {
      htmlEl.setAttribute('data-theme', isDark ? 'dark' : 'light');
      knob.textContent = isDark ? '🌙' : '☀️';
      document.querySelector('meta[name="theme-color"]').content = isDark ? '#111820' : '#f7f4f9';
      localStorage.setItem('zen_theme', isDark ? 'dark' : 'light');
    }
    applyTheme();
    btnTheme.addEventListener('click', () => { isDark = !isDark; applyTheme(); });

    waitForAuth().then(user => { if (!user) return; initApp(); });
    function initApp() {

    /* ── Stato ── */
    let items      = [];
    let pendingImg = null;
    let editingId  = null;
    let listFilter = 'all';   // 'all' | 'todo' | 'done'
    let editingDoneDateId = null;

    /* ── Elementi DOM ── */
    const dreamsGrid      = document.getElementById('dreams-grid');
    const emptyDreams     = document.getElementById('empty-dreams');
    const completedList   = document.getElementById('completed-list');
    const screenList      = document.getElementById('screen-list');
    const screenCompleted = document.getElementById('screen-completed');
    const tabList         = document.getElementById('tab-list');
    const tabCompleted    = document.getElementById('tab-completed');
    const tabAddBtn       = document.getElementById('tab-add-btn');
    const listSearch      = document.getElementById('list-search');
    const completedSearch = document.getElementById('completed-search');
    const emptySearchRes  = document.getElementById('empty-search-results');
    const modalOverlay    = document.getElementById('modal-overlay');
    const fTitle          = document.getElementById('f-title');
    const fDesc           = document.getElementById('f-desc');
    const btnImgUpload    = document.getElementById('btn-img-upload');
    const imgFileInput    = document.getElementById('img-file-input');
    const imgPreview      = document.getElementById('img-preview');
    const btnSave         = document.getElementById('btn-save-dream');
    const btnCancel       = document.getElementById('btn-cancel-modal');
    const modalTitle      = document.getElementById('modal-title');
    const btnDelete       = document.getElementById('btn-delete-dream');

    /* ── Tab navigation ── */
    function showScreen(which) {
      if (which === 'list') {
        screenList.classList.add('active');
        screenCompleted.classList.remove('active');
        tabList.classList.add('tab-active');
        tabCompleted.classList.remove('tab-active');
      } else {
        screenList.classList.remove('active');
        screenCompleted.classList.add('active');
        tabCompleted.classList.add('tab-active');
        tabList.classList.remove('tab-active');
        renderCompleted();
      }
    }
    tabList.addEventListener('click',      () => showScreen('list'));
    tabCompleted.addEventListener('click', () => showScreen('completed'));
    tabAddBtn.addEventListener('click',    () => { showScreen('list'); openModal(null); });

    /* ── Modal: apri ── */
    function openModal(id) {
      editingId  = id;
      pendingImg = null;
      fTitle.value = '';
      fDesc.value  = '';
      imgPreview.src = '';
      imgPreview.classList.remove('visible');
      btnImgUpload.textContent = '📷 Scegli immagine';
      btnImgUpload.classList.remove('error');
      fTitle.classList.remove('error');
      fDesc.classList.remove('error');
      imgFileInput.value = '';

      if (id !== null) {
        const item = items.find(i => i.id === id);
        if (item) {
          modalTitle.textContent = 'Modifica Sogno';
          fTitle.value = item.title;
          fDesc.value  = item.desc;
          if (item.img) {
            pendingImg = item.img;
            imgPreview.src = item.img;
            imgPreview.classList.add('visible');
            btnImgUpload.textContent = '✓ Immagine presente';
          }
        }
        btnDelete.style.display = '';      /* mostra Elimina in modifica */
      } else {
        modalTitle.textContent = 'Nuovo Sogno';
        btnDelete.style.display = 'none'; /* nasconde Elimina per nuovo */
      }
      modalOverlay.classList.add('open');
    }

    /* ── Modal: chiudi ── */
    function closeModal() {
      modalOverlay.classList.remove('open');
      editingId  = null;
      pendingImg = null;
    }
    btnCancel.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', e => { if(e.target===modalOverlay) closeModal(); });

    btnDelete.addEventListener('click', async () => {
      if (editingId === null) return;
      const item = items.find(i => i.id === editingId);
      if (item) await deleteBucketItem(item._docId);
      closeModal();
    });

    modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });

    /* ── Comprimi immagine prima di salvarla (evita limite 1MB Firestore) ── */
    function compressImage(file, maxW = 600, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = reject;
        reader.onload = ev => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const scale = Math.min(1, maxW / Math.max(img.width, img.height));
            const w = Math.round(img.width  * scale);
            const h = Math.round(img.height * scale);
            const canvas = document.createElement('canvas');
            canvas.width  = w;
            canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    /* ── Upload immagine ── */
    btnImgUpload.addEventListener('click', () => imgFileInput.click());
    imgFileInput.addEventListener('change', async () => {
      const file = imgFileInput.files[0];
      if (!file) return;
      try {
        const compressed = await compressImage(file);
        pendingImg = compressed;
        imgPreview.src = pendingImg;
        imgPreview.classList.add('visible');
        btnImgUpload.textContent = '✓ Immagine caricata';
        btnImgUpload.classList.remove('error');
      } catch {
        alert('Errore nel caricamento immagine. Riprova.');
      }
    });

    /* ── Salva sogno (crea o modifica) ── */
    btnSave.addEventListener('click', async () => {
      const title = fTitle.value.trim();
      const desc  = fDesc.value.trim();

      fTitle.classList.toggle('error', !title);
      fDesc.classList.toggle('error', !desc);
      btnImgUpload.classList.toggle('error', !pendingImg);
      if (!title || !desc || !pendingImg) return;

      if (editingId !== null) {
        /* modifica */
        const item = items.find(i => i.id === editingId);
        if (item) {
          await updateBucketItem(item._docId, { title, desc, img: pendingImg });
        }
      } else {
        /* nuovo */
        const newItem = {
          id:       Date.now(),
          title,
          desc,
          img:      pendingImg,
          done:     false,
          doneDate: null,
        };
        await addBucketItem(newItem);
      }

      closeModal();
      /* il re-render avviene automaticamente via onSnapshot */
    });

    /* ── Spunta / de-spunta ── */
    async function toggleDone(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      await updateBucketItem(item._docId, {
        done:     true,
        doneDate: new Date().toLocaleDateString('it-IT', {
          day: '2-digit', month: 'long', year: 'numeric'
        }),
      });
    }

    async function undoDone(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      await updateBucketItem(item._docId, { done: false, doneDate: null });
    }

    /* ── Filtri e ricerca lista ── */
    function setListFilter(f) {
      listFilter = f;
      ['all','todo','done'].forEach(k => {
        document.getElementById('bl-filter-'+k).classList.toggle('active', k === f);
      });
      applyListFilters();
    }
    function applyListFilters() {
      const q = (listSearch.value || '').trim().toLowerCase();
      let visible = items;
      if (listFilter === 'todo') visible = visible.filter(i => !i.done);
      else if (listFilter === 'done') visible = visible.filter(i => i.done);
      if (q) visible = visible.filter(i => i.title.toLowerCase().includes(q));
      renderGrid(visible);
    }
    window.applyListFilters = applyListFilters;
    window.setListFilter = setListFilter;

    function applyCompletedSearch() {
      renderCompleted();
    }
    window.applyCompletedSearch = applyCompletedSearch;

    /* ── Render griglia lista ── */
    function renderGrid(subset) {
      const visibleItems = subset || items;
      dreamsGrid.innerHTML = '';
      if (items.length === 0) {
        emptyDreams.classList.add('visible');
        emptySearchRes.style.display = 'none';
        return;
      }
      emptyDreams.classList.remove('visible');
      if (visibleItems.length === 0) {
        emptySearchRes.style.display = 'block';
        return;
      }
      emptySearchRes.style.display = 'none';

      visibleItems.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'dream-card' + (item.done ? ' done' : '');
        card.dataset.id = item.id;

        card.innerHTML = `
          <img class="dream-img" src="${esc(item.img)}" alt="${esc(item.title)}" loading="lazy"/>
          <div class="dream-body">
            <div class="dream-title"><span style="color:var(--muted);font-size:.65em;margin-right:4px;">${index + 1}.</span>${esc(item.title)}</div>
            <div class="dream-desc">${esc(item.desc)}</div>
          </div>
          <div class="dream-actions">
            <button class="btn-edit-card" data-id="${item.id}" aria-label="Modifica">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
              Modifica
            </button>
            <button class="btn-check-card" data-id="${item.id}" aria-label="Segna come fatto">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                   stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </button>
          </div>`;

        card.querySelector('.btn-edit-card').addEventListener('click', e => {
          e.stopPropagation();
          openModal(item.id);
        });
        card.querySelector('.btn-check-card').addEventListener('click', e => {
          e.stopPropagation();
          if (item.done) undoDone(item.id);
          else toggleDone(item.id);
        });

        dreamsGrid.appendChild(card);
      });
    }

    /* ── Modal modifica data completamento ── */
    const editDoneDateModal  = document.getElementById('edit-done-date-modal');
    const editDoneDateInput  = document.getElementById('edit-done-date-input');
    const editDoneDateSave   = document.getElementById('edit-done-date-save');
    const editDoneDateCancel = document.getElementById('edit-done-date-cancel');

    function openEditDoneDateModal(id) {
      editingDoneDateId = id;
      const item = items.find(i => i.id === id);
      // converte la data leggibile in formato YYYY-MM-DD per l'input
      let dateVal = '';
      if (item && item.doneDate) {
        // tenta di parsare la data (es "15 maggio 2025" → 2025-05-15)
        try {
          const d = new Date(item.doneDate);
          if (!isNaN(d)) dateVal = d.toISOString().slice(0,10);
        } catch {}
      }
      editDoneDateInput.value = dateVal;
      editDoneDateModal.classList.add('open');
    }
    editDoneDateSave.addEventListener('click', async () => {
      if (!editingDoneDateId) return;
      const item = items.find(i => i.id === editingDoneDateId);
      if (!item) return;
      const raw = editDoneDateInput.value;
      const formatted = raw ? new Date(raw + 'T12:00:00').toLocaleDateString('it-IT', { day:'2-digit', month:'long', year:'numeric' }) : item.doneDate;
      await updateBucketItem(item._docId, { doneDate: formatted });
      editDoneDateModal.classList.remove('open');
      editingDoneDateId = null;
    });
    editDoneDateCancel.addEventListener('click', () => {
      editDoneDateModal.classList.remove('open');
      editingDoneDateId = null;
    });
    editDoneDateModal.addEventListener('click', e => { if(e.target===editDoneDateModal){ editDoneDateModal.classList.remove('open'); editingDoneDateId=null; } });

    /* ── Render completati ── */
    function renderCompleted() {
      completedList.innerHTML = '';
      const q = (completedSearch ? completedSearch.value : '').trim().toLowerCase();
      let done = items.filter(i => i.done).reverse();
      if (q) done = done.filter(i => i.title.toLowerCase().includes(q));
      const total = items.length;

      if (done.length === 0) {
        completedList.innerHTML =
          '<div class="completed-empty">Nessun sogno realizzato ancora.<br>Spunta un sogno dalla lista ✨</div>';
        return;
      }

      /* intestazione contatore */
      const counter = document.createElement('div');
      counter.style.cssText = 'font-size:.64rem;letter-spacing:.14em;color:var(--muted);text-align:center;margin-bottom:8px;text-transform:uppercase;';
      counter.textContent = `${done.length} di ${total} realizzati`;
      completedList.appendChild(counter);

      done.forEach((item, index) => {
        const el = document.createElement('div');
        el.className = 'completed-item';

        el.innerHTML = `
          <img class="completed-img" src="${esc(item.img)}" alt="${esc(item.title)}" loading="lazy"/>
          <div class="completed-info">
            <div class="completed-title"><span style="color:var(--muted);font-size:.75em;margin-right:3px;">${index + 1}.</span>${esc(item.title)}</div>
            <div class="completed-date" style="cursor:pointer;display:flex;align-items:center;gap:4px;" title="Clicca per modificare la data">
              ✓ ${esc(item.doneDate || '')}
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.5;flex-shrink:0;"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </div>
          </div>
          <div class="completed-actions">
            <button class="btn-uncheck" data-id="${item.id}" aria-label="Deseleziona">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                   stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </button>
            <button class="btn-edit-completed" data-id="${item.id}" aria-label="Modifica sogno">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
            </button>
          </div>`;

        el.querySelector('.btn-uncheck').addEventListener('click', () => undoDone(item.id));
        el.querySelector('.btn-edit-completed').addEventListener('click', () => openModal(item.id));
        el.querySelector('.completed-date').addEventListener('click', () => openEditDoneDateModal(item.id));

        completedList.appendChild(el);
      });
    }

    /* ── Helper escape ── */
    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /* ── Aggiornamento progress bar ── */
    function updateProgressBar() {
      const total = items.length;
      const doneCount = items.filter(i => i.done).length;
      const pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;
      const statsEl = document.getElementById('bucket-progress-stats');
      const fillEl = document.getElementById('bucket-progress-fill');
      if (statsEl) statsEl.textContent = `${doneCount} / ${total} (${pct}%)`;
      if (fillEl) fillEl.style.width = `${pct}%`;
    }

    /* ── Init: sottoscrivi Firestore (real-time) ── */
    subscribeBucketList(newItems => {
      items = newItems;
      updateProgressBar();
      applyListFilters();
      if (screenCompleted.classList.contains('active')) renderCompleted();
    });
    } // fine initApp()
  </script>
</body>
</html>
