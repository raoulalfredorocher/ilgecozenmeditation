<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Il Geco Zen"/>
  <meta name="theme-color" content="#FAF7F2"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" href="assets/icons/favicon-48.png"/>
  <title>Il Geco Zen — Bucket List</title>
  <script src="js/ui/theme-boot.js"></script>
  <link rel="stylesheet" href="styles/tokens.css"/>
  <link rel="stylesheet" href="styles/zen.css"/>
  <style>
    /* ── Bucket List: stile "La mia storia" ── */
    .progress-card {
      position: relative; overflow: hidden; display: flex; flex-direction: column; gap: var(--space-3);
      padding: var(--space-5) var(--space-5) var(--space-5) calc(var(--space-5) + 6px);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
      background: linear-gradient(120deg, color-mix(in srgb, var(--sakura) 22%, var(--card)), var(--card) 75%);
    }
    .progress-card::before { content: ''; position: absolute; left: 0; top: 16px; bottom: 16px; width: 4px; border-radius: 0 4px 4px 0; background: var(--sakura); }
    .progress-card .row { align-items: baseline; }
    .progress-card .row b { font: 300 3.25rem/1 var(--font-serif); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
    .progress-card .row .zen-muted { font-family: var(--font-serif); font-style: italic; font-size: var(--fs-md); }
    .progress-card .pct { margin-left: auto; font: 200 2.75rem/1 var(--font-serif); letter-spacing: -.05em; color: var(--sakura); opacity: .7; }
    .progress-card .meter-track { height: 5px; background: color-mix(in srgb, var(--sakura) 18%, var(--surface)); }
    .progress-card .meter-fill { background: linear-gradient(90deg, var(--sakura), var(--primary)); }

    /* Composizione a blocchi dei sogni */
    .bl-bento { --row: 120px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: var(--row); gap: var(--space-3); }
    .bl-card {
      position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; min-width: 0;
      border: .5px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); color: var(--text);
      background: linear-gradient(120deg, color-mix(in srgb, var(--t) 20%, var(--card)), var(--card) 78%);
    }
    .bl-card::before { content: ''; position: absolute; left: 0; top: 16px; bottom: 16px; width: 4px; border-radius: 0 4px 4px 0; background: var(--t); z-index: 2; }
    .bl-open { position: absolute; inset: 0; border: 0; padding: 0; margin: 0; background: none; cursor: pointer; width: 100%; height: 100%; color: inherit; }
    .bl-card.has-img { color: #fff; border-color: transparent; background: var(--surface); }
    .bl-card.has-img .bl-open { background-size: cover; background-position: center; }
    .bl-card.has-img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,18,24,.78), rgba(10,18,24,.12) 62%, rgba(10,18,24,.25)); pointer-events: none; }
    .bl-card.is-done.has-img .bl-open { filter: saturate(.7); }
    .bl-num { position: absolute; z-index: 1; right: var(--space-4); top: 6px; font: 200 2.75rem/1 var(--font-serif); letter-spacing: -.05em; color: var(--t); opacity: .22; pointer-events: none; }
    .bl-card.has-img .bl-num { color: #fff; opacity: .4; }
    .bl-text { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 3px; padding: var(--space-3) var(--space-4) var(--space-3) calc(var(--space-4) + 4px); pointer-events: none; min-width: 0; }
    .bl-title { font: 600 1.0625rem/1.25 var(--font-serif); letter-spacing: -.015em; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .bl-meta { font: italic 400 var(--fs-sm)/1.45 var(--font-serif); opacity: .8; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .bl-card:not(.has-img) .bl-meta { color: var(--muted); opacity: 1; }
    .bl-card.is-done .bl-meta { font-style: normal; font-size: var(--fs-xs); letter-spacing: .1em; text-transform: uppercase; }
    .bl-ic { position: absolute; z-index: 1; left: calc(var(--space-4) + 4px); top: var(--space-4); width: 40px; height: 40px; border-radius: 13px; display: inline-flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--t) 20%, var(--card)); color: var(--t); pointer-events: none; }
    .bl-ic .icon { width: 20px; height: 20px; }
    .bl-check { position: absolute; z-index: 3; top: 8px; left: 10px; width: 34px; height: 34px; padding: 0; background: color-mix(in srgb, var(--card) 82%, transparent); border-color: transparent; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    .bl-card:not(.has-img) .bl-check { display: none; }
    .bl-card.w .bl-title { font-size: 1.375rem; -webkit-line-clamp: 2; }
    .bl-card.t .bl-title { font-size: 1.25rem; -webkit-line-clamp: 4; line-clamp: 4; }
    .bl-card.t .bl-num { font-size: 2.75rem; }
    .bl-card.hero .bl-title { font-size: 1.625rem; }
    .bl-card.no-photo-check .bl-check { display: flex; }
    /* sogno senza foto: la spunta sta in basso a destra */
    .bl-card:not(.has-img) .bl-check { display: flex; top: auto; bottom: 10px; left: auto; right: 10px; }
    .bl-card:not(.has-img) .bl-text { padding-right: 52px; }
    /* timbro "realizzato" */
    .bl-stamp { position: absolute; z-index: 2; right: 12px; bottom: 12px; transform: rotate(-7deg); padding: 3px 8px; border: 1.5px solid #C2475F; border-radius: 5px; color: #C2475F; background: rgba(255,255,255,.78); font: 700 .8rem/1 var(--font-serif); letter-spacing: .06em; pointer-events: none; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
    html[data-theme="dark"] .bl-stamp { background: rgba(14,26,34,.78); color: #F07890; border-color: #F07890; }
    .bl-card.w.is-done .bl-text { padding-right: 76px; }
    .bl-card.w:not(.has-img).is-done .bl-stamp { right: 56px; }
    /* nelle schede piccole e alte il timbro sta sotto il numero e la data si legge nel timbro */
    .bl-card.h .bl-stamp, .bl-card.t .bl-stamp { top: 50px; bottom: auto; right: 10px; font-size: .72rem; padding: 2px 6px; }
    .bl-card.h.is-done .bl-meta { display: none; }

    /* ── Il mio racconto (dentro il dettaglio di un sogno) ── */
    .rc-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
    .rc-list { display: flex; flex-direction: column; gap: var(--space-3); }
    .rc-card { position: relative; margin: 0; padding: var(--space-4) var(--space-4) var(--space-3) calc(var(--space-4) + 4px); border: .5px solid var(--border); border-radius: var(--radius-md); background: linear-gradient(120deg, color-mix(in srgb, var(--t) 14%, var(--card)), var(--card) 72%); overflow: hidden; display: flex; flex-direction: column; gap: var(--space-2); }
    .rc-card::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--t); }
    .rc-card figcaption { display: flex; justify-content: space-between; gap: var(--space-3); font-size: var(--fs-xs); color: var(--muted); }
    .rc-tag { font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: color-mix(in srgb, var(--t) 70%, var(--text)); }
    .rc-card blockquote { margin: 0; font-family: var(--font-serif); font-style: italic; font-size: var(--fs-lg); line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
    .rc-audio audio { width: 100%; height: 40px; }
    .rc-acts { display: flex; justify-content: flex-end; gap: 2px; margin: 0 -8px -6px; }
    .rc-acts button { width: 34px; height: 34px; border: 0; background: none; border-radius: 50%; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .rc-acts button:active { background: var(--surface); }
    .rc-empty { margin: 0; font: italic 400 var(--fs-md)/1.6 var(--font-serif); color: var(--muted); }
    .qt-rec { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: color-mix(in srgb, var(--danger) 10%, var(--card)); }
    .qt-rec b { flex: 1; font-size: var(--fs-lg); font-variant-numeric: tabular-nums; }
    .qt-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--danger); animation: qt-pulse 1.1s ease-in-out infinite; }
    @keyframes qt-pulse { 50% { opacity: .25; transform: scale(.8); } }
    .qt-prev { display: flex; gap: var(--space-3); align-items: center; }
    .qt-prev audio { width: 100%; height: 40px; }
    .fa-hint { font-size: var(--fs-xs); color: var(--muted); line-height: 1.5; }
  </style>
</head>
<!-- Bucket List: logica in js/pages/bucket-list/main.js -->
<body class="zen zen-native" data-title="Bucket List" data-add="#bl-add">
  <script type="module" src="js/core/auth-guard.js"></script>
  <script type="module" src="js/ui/shell.js"></script>

  <main class="zen-main">
    <section class="card progress-card" aria-label="Avanzamento">
      <div class="zen-eyebrow">I miei sogni</div>
      <div class="row"><span id="bl-count"><b>0</b></span><span class="pct" id="bl-pct">0%</span></div>
      <div class="meter-track"><div class="meter-fill" id="bl-fill" style="width:0"></div></div>
    </section>

    <div class="stack">
      <input class="input" type="search" id="bl-search" placeholder="Cerca un sogno" aria-label="Cerca un sogno"/>
      <div class="segmented" role="group" aria-label="Filtro">
        <button type="button" data-filter="all" aria-pressed="true">Tutti</button>
        <button type="button" data-filter="todo">Da realizzare</button>
        <button type="button" data-filter="done">Realizzati</button>
      </div>
    </div>

    <section class="bl-bento" id="bl-grid" aria-live="polite"></section>
    <button type="button" id="bl-add" hidden aria-hidden="true" tabindex="-1"></button>
  </main>

  <script type="module" src="js/pages/bucket-list/main.js"></script>
</body>
</html>
