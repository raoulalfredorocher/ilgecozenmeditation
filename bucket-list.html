<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Il Geco Zen"/>
  <meta name="theme-color" content="#f7f4f9"/>
  <link rel="manifest" href="manifest.json"/>
  <title>Il Geco Zen — Bucket List</title>
  <link rel="stylesheet" href="styles/theme.css?v=8"/>
  <link rel="stylesheet" href="styles/layout.css?v=8"/>
  <style>
    /* ── Header logo bucket list ── */
    .app-sub-bucket {
      font-size: .48rem;
      letter-spacing: .22em;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ── Schermata Lista ── */
    #screen-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    /* ── Form aggiungi sogno ── */
    .add-dream-card {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .add-dream-label {
      font-size: .54rem;
      letter-spacing: .26em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .add-dream-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: .82rem;
      font-family: inherit;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
    }
    .add-dream-input:focus { border-color: var(--gold); }
    .add-dream-textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: .78rem;
      font-family: inherit;
      color: var(--text);
      resize: none;
      min-height: 68px;
      outline: none;
      transition: border-color .2s;
    }
    .add-dream-textarea:focus { border-color: var(--gold); }

    /* Upload immagine */
    .img-upload-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .img-preview {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--border);
      display: none;
      flex-shrink: 0;
    }
    .img-preview.visible { display: block; }
    .btn-img-upload {
      flex: 1;
      background: none;
      border: 1.5px dashed var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: .72rem;
      font-family: inherit;
      letter-spacing: .08em;
      padding: 10px;
      cursor: pointer;
      text-align: center;
      transition: border-color .2s, color .2s;
    }
    .btn-img-upload:active { border-color: var(--gold); color: var(--gold); }
    #img-file-input { display: none; }

    .btn-add-dream {
      width: 100%;
      background: var(--gold);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 11px;
      font-size: .78rem;
      font-family: inherit;
      letter-spacing: .14em;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-add-dream:active { background: var(--accent2); }

    /* ── Griglia sogni ── */
    .section-divider {
      width: 100%;
      font-size: .52rem;
      letter-spacing: .26em;
      color: var(--muted);
      text-transform: uppercase;
      text-align: center;
      padding: 2px 0 4px;
    }

    .dreams-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .dream-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s;
      -webkit-tap-highlight-color: transparent;
    }
    .dream-card.done {
      opacity: .55;
      border-color: var(--accent);
    }
    .dream-card:active { box-shadow: 0 0 0 2px var(--accent); }

    .dream-img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }
    .dream-img-placeholder {
      width: 100%;
      aspect-ratio: 4/3;
      background: var(--surface);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 1.4rem;
    }

    .dream-title {
      font-size: .78rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: .04em;
      line-height: 1.3;
    }
    .dream-desc {
      font-size: .64rem;
      color: var(--muted);
      line-height: 1.5;
      letter-spacing: .03em;
    }

    /* Checkbox spunta */
    .dream-check {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s, border-color .2s;
      flex-shrink: 0;
    }
    .dream-card.done .dream-check {
      background: var(--accent);
      border-color: var(--accent);
    }
    .dream-check svg { display: none; }
    .dream-card.done .dream-check svg { display: block; }

    /* Nessun sogno */
    .empty-dreams {
      width: 100%;
      text-align: center;
      padding: 32px 0 12px;
      font-size: .7rem;
      color: var(--muted);
      letter-spacing: .08em;
      line-height: 1.8;
      display: none;
    }
    .empty-dreams.visible { display: block; }

    /* ── Schermata Completati ── */
    #screen-completed {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    #screen-completed.active { display: flex; }

    .completed-empty {
      width: 100%;
      text-align: center;
      padding: 40px 0 16px;
      font-size: .7rem;
      color: var(--muted);
      letter-spacing: .08em;
      line-height: 1.8;
    }

    .completed-item {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .completed-img {
      width: 46px;
      height: 46px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .completed-img-placeholder {
      width: 46px;
      height: 46px;
      border-radius: 8px;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .completed-info { flex: 1; min-width: 0; }
    .completed-title {
      font-size: .78rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: .04em;
    }
    .completed-date {
      font-size: .58rem;
      color: var(--muted);
      letter-spacing: .1em;
      margin-top: 3px;
    }
    .completed-check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* ── Tab bar bucket ── */
    .tab-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: calc(58px + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--card);
      border-top: 1px solid var(--border);
      border-radius: 22px 22px 0 0;
      display: flex;
      align-items: center;
      justify-content: space-around;
      z-index: 200;
      overflow: visible;
    }
  </style>
</head>
<body>

  <header id="main-header">
    <a class="btn-header-csv" href="index.html" aria-label="Torna alla home" style="text-decoration:none;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
        <polyline points="9,21 9,13 15,13 15,21"/>
      </svg>
      <span>Hub</span>
    </a>

    <div class="header-center">
      <a href="index.html" aria-label="Torna all'hub"
         style="display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;">
        <img src="Logo%20Trasparente.png" alt="Il Geco Zen" class="header-logo"/>
        <div class="app-title">Il Geco Zen</div>
        <div class="app-sub-bucket">bucket list</div>
      </a>
    </div>

    <button class="theme-toggle" id="theme-toggle" aria-label="Cambia tema">
      <div class="knob" id="theme-knob">☀️</div>
    </button>
  </header>

  <!-- SCHERMATA LISTA -->
  <div id="screen-list">

    <!-- Form aggiungi sogno -->
    <div class="add-dream-card">
      <div class="add-dream-label">✦ aggiungi un sogno</div>

      <input class="add-dream-input" id="dream-title-input" type="text"
             placeholder="Titolo del sogno" maxlength="48" autocomplete="off"/>

      <textarea class="add-dream-textarea" id="dream-desc-input"
                placeholder="Descrizione (facoltativa)" maxlength="200"></textarea>

      <div class="img-upload-wrap">
        <img class="img-preview" id="img-preview" src="" alt="Anteprima"/>
        <button class="btn-img-upload" id="btn-img-upload" aria-label="Scegli immagine">
          📷 Aggiungi immagine
        </button>
        <input type="file" id="img-file-input" accept="image/*"/>
      </div>

      <button class="btn-add-dream" id="btn-add-dream">＋ Aggiungi alla lista</button>
    </div>

    <div class="section-divider">i tuoi sogni</div>

    <div class="dreams-grid" id="dreams-grid"></div>
    <div class="empty-dreams" id="empty-dreams">
      Nessun sogno ancora.<br>Aggiungine uno qui sopra ✨
    </div>

  </div>

  <!-- SCHERMATA COMPLETATI -->
  <div id="screen-completed">
    <div class="section-divider">sogni realizzati</div>
    <div id="completed-list"></div>
  </div>

  <!-- TAB BAR: Completati | Home (cerchio) | Lista -->
  <nav class="tab-bar" id="tab-bar">

    <!-- Sinistra: Completati -->
    <button class="tab-btn" id="tab-completed" aria-label="Sogni completati">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      <span class="tab-label">completati</span>
    </button>

    <!-- Centro: Home (cerchio) -->
    <button class="tab-btn tab-center" id="tab-home-btn" aria-label="Torna alla home">
      <div class="tab-center-circle">
        <img src="Logo%20Trasparente.png" alt="Il Geco Zen" class="tab-center-gecko"/>
      </div>
      <span class="tab-label">home</span>
    </button>

    <!-- Destra: Lista -->
    <button class="tab-btn tab-active" id="tab-list" aria-label="Lista sogni">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"/>
        <line x1="8" y1="12" x2="21" y2="12"/>
        <line x1="8" y1="18" x2="21" y2="18"/>
        <line x1="3" y1="6" x2="3.01" y2="6"/>
        <line x1="3" y1="12" x2="3.01" y2="12"/>
        <line x1="3" y1="18" x2="3.01" y2="18"/>
      </svg>
      <span class="tab-label">lista</span>
    </button>

  </nav>

  <script>
    /* ── Tema ── */
    const htmlEl = document.documentElement;
    const btnTheme = document.getElementById('theme-toggle');
    const knob = document.getElementById('theme-knob');
    let isDark = localStorage.getItem('zen_theme') === 'dark';
    function applyTheme() {
      htmlEl.setAttribute('data-theme', isDark ? 'dark' : 'light');
      knob.textContent = isDark ? '🌙' : '☀️';
      document.querySelector('meta[name="theme-color"]').content = isDark ? '#111820' : '#f7f4f9';
      localStorage.setItem('zen_theme', isDark ? 'dark' : 'light');
    }
    applyTheme();
    btnTheme.addEventListener('click', () => { isDark = !isDark; applyTheme(); });

    /* ── Storage ── */
    const STORAGE_KEY = 'zen_bucket_list';
    function load() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; } }
    function save(items) { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }

    /* ── Stato ── */
    let items = load();
    let pendingImg = null; // data URL immagine

    /* ── Elementi DOM ── */
    const dreamsGrid    = document.getElementById('dreams-grid');
    const emptyDreams   = document.getElementById('empty-dreams');
    const completedList = document.getElementById('completed-list');
    const screenList      = document.getElementById('screen-list');
    const screenCompleted = document.getElementById('screen-completed');
    const tabList      = document.getElementById('tab-list');
    const tabCompleted = document.getElementById('tab-completed');
    const tabHomeBtn   = document.getElementById('tab-home-btn');

    /* ── Tab navigation ── */
    function showScreen(which) {
      if (which === 'list') {
        screenList.style.display = 'flex';
        screenCompleted.classList.remove('active');
        tabList.classList.add('tab-active');
        tabCompleted.classList.remove('tab-active');
      } else {
        screenList.style.display = 'none';
        screenCompleted.classList.add('active');
        tabCompleted.classList.add('tab-active');
        tabList.classList.remove('tab-active');
        renderCompleted();
      }
    }
    tabList.addEventListener('click', () => showScreen('list'));
    tabCompleted.addEventListener('click', () => showScreen('completed'));
    tabHomeBtn.addEventListener('click', () => { window.location.href = 'index.html'; });

    /* ── Upload immagine ── */
    const btnImgUpload = document.getElementById('btn-img-upload');
    const imgFileInput = document.getElementById('img-file-input');
    const imgPreview   = document.getElementById('img-preview');

    btnImgUpload.addEventListener('click', () => imgFileInput.click());
    imgFileInput.addEventListener('change', () => {
      const file = imgFileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        pendingImg = e.target.result;
        imgPreview.src = pendingImg;
        imgPreview.classList.add('visible');
        btnImgUpload.textContent = '✓ Immagine caricata';
      };
      reader.readAsDataURL(file);
    });

    /* ── Aggiungi sogno ── */
    document.getElementById('btn-add-dream').addEventListener('click', () => {
      const title = document.getElementById('dream-title-input').value.trim();
      if (!title) {
        document.getElementById('dream-title-input').focus();
        return;
      }
      const desc = document.getElementById('dream-desc-input').value.trim();
      const item = {
        id: Date.now(),
        title,
        desc,
        img: pendingImg || null,
        done: false,
        doneDate: null
      };
      items.push(item);
      save(items);
      renderGrid();

      /* reset form */
      document.getElementById('dream-title-input').value = '';
      document.getElementById('dream-desc-input').value = '';
      imgPreview.src = '';
      imgPreview.classList.remove('visible');
      btnImgUpload.textContent = '📷 Aggiungi immagine';
      imgFileInput.value = '';
      pendingImg = null;
    });

    /* ── Render griglia sogni ── */
    function renderGrid() {
      const active = items.filter(i => !i.done);
      dreamsGrid.innerHTML = '';

      if (active.length === 0) {
        emptyDreams.classList.add('visible');
        return;
      }
      emptyDreams.classList.remove('visible');

      active.forEach(item => {
        const card = document.createElement('div');
        card.className = 'dream-card';
        card.dataset.id = item.id;

        const imgHTML = item.img
          ? `<img class="dream-img" src="${item.img}" alt="${esc(item.title)}" loading="lazy"/>`
          : `<div class="dream-img-placeholder">✨</div>`;

        const descHTML = item.desc
          ? `<div class="dream-desc">${esc(item.desc)}</div>`
          : '';

        card.innerHTML = `
          ${imgHTML}
          <div class="dream-title">${esc(item.title)}</div>
          ${descHTML}
          <div class="dream-check">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                 stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>`;

        /* tap sul check = completa */
        card.querySelector('.dream-check').addEventListener('click', e => {
          e.stopPropagation();
          toggleDone(item.id);
        });

        dreamsGrid.appendChild(card);
      });
    }

    /* ── Toggle completamento ── */
    function toggleDone(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      item.done = true;
      item.doneDate = new Date().toLocaleDateString('it-IT', {
        day: '2-digit', month: 'long', year: 'numeric'
      });
      save(items);
      renderGrid();
    }

    /* ── Render completati ── */
    function renderCompleted() {
      const done = items.filter(i => i.done).reverse();
      completedList.innerHTML = '';

      if (done.length === 0) {
        completedList.innerHTML =
          '<div class="completed-empty">Nessun sogno realizzato ancora.<br>Spunta un sogno dalla lista ✨</div>';
        return;
      }

      done.forEach(item => {
        const el = document.createElement('div');
        el.className = 'completed-item';

        const imgHTML = item.img
          ? `<img class="completed-img" src="${item.img}" alt="${esc(item.title)}" loading="lazy"/>`
          : `<div class="completed-img-placeholder">✨</div>`;

        el.innerHTML = `
          ${imgHTML}
          <div class="completed-info">
            <div class="completed-title">${esc(item.title)}</div>
            <div class="completed-date">✓ ${item.doneDate || ''}</div>
          </div>
          <div class="completed-check">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                 stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>`;

        completedList.appendChild(el);
      });
    }

    /* ── Helper escape ── */
    function esc(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /* ── Init ── */
    renderGrid();
  </script>
</body>
</html>
