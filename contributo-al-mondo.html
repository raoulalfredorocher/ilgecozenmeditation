<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Il Geco Zen"/>
  <meta name="theme-color" content="#FAF7F2"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" href="assets/icons/favicon-48.png"/>
  <title>Il Geco Zen — Contributo al mondo</title>
  <script src="js/ui/theme-boot.js"></script>
  <link rel="stylesheet" href="styles/tokens.css"/>
  <link rel="stylesheet" href="styles/zen.css"/>
</head>
<body class="zen zen-native" data-title="Contributo al mondo" style="visibility:hidden">
  <script type="module" src="js/core/auth-guard.js"></script>
  <script type="module" src="js/ui/shell.js"></script>
  <main class="zen-main">
    <div class="page-tabs">
      <div class="segmented" role="group" aria-label="Ambito">
        <button type="button" data-area="itai" aria-pressed="true">IT e AI</button>
        <button type="button" data-area="geco">Il Geco Zen</button>
        <button type="button" data-area="volontariato">Volontariato</button>
      </div>
    </div>
    <section class="coming" id="area">
      <span class="dot-icon leaf"><svg class="icon" aria-hidden="true"><use href="#i-globe"/></svg></span>
      <h2 class="zen-h2" id="area-title"></h2>
      <p id="area-text"></p>
    </section>
  </main>
  <script type="module">
    const AREAS = {
      itai: ['IT e AI', 'Progetti, idee e impatto nel lavoro con la tecnologia e l\'intelligenza artificiale. In costruzione.'],
      geco: ['Il Geco Zen', 'Il percorso del Geco Zen: contenuti, persone raggiunte, obiettivi. In costruzione.'],
      volontariato: ['Volontariato', 'Le attività di volontariato e il tempo donato agli altri. In costruzione.'],
    };
    function show(key) {
      document.querySelectorAll('[data-area]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.area === key)));
      document.getElementById('area-title').textContent = AREAS[key][0];
      document.getElementById('area-text').textContent = AREAS[key][1];
    }
    document.querySelector('.segmented').addEventListener('click', e => {
      const b = e.target.closest('[data-area]');
      if (b) show(b.dataset.area);
    });
    show('itai');
  </script>
</body>
</html>
