<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Il Geco Zen"/>
  <meta name="theme-color" content="#FAF7F2"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" href="assets/icons/favicon-48.png"/>
  <title>Il Geco Zen — Salute mentale</title>
  <script src="js/ui/theme-boot.js"></script>
  <link rel="stylesheet" href="styles/tokens.css"/>
  <link rel="stylesheet" href="styles/zen.css"/>
  <style>
    /* ── Salute mentale ────────────────────────────────────────────────────
       Poche linee sottili, molto spazio, il serif per ciò che scrivi tu. */
    .mh-main { gap: var(--space-6); }
    .seg-wrap {
      position: sticky; top: calc(var(--safe-top) + var(--header-h)); z-index: 50;
      margin: calc(-1 * var(--space-2)) 0 0; padding: var(--space-2) 0;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
    }
    .view { display: flex; flex-direction: column; gap: var(--space-6); }
    .view[hidden] { display: none !important; }

    .block-title { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); }
    .block-title .zen-eyebrow { margin: 0; }
    .text-btn { background: none; border: 0; padding: 4px 2px; cursor: pointer; font-size: var(--fs-sm); color: var(--geco-blue); font-weight: 500; }
    .text-btn:active { opacity: .6; }
    .text-btn.danger { color: var(--danger); }
    .text-btn.armed { background: var(--danger); color: #fff; border-radius: 999px; padding: 6px 14px; }
    .btn.armed { background: var(--danger); border-color: var(--danger); color: #fff; }
    .note { font-size: var(--fs-xs); color: var(--muted); line-height: 1.5; }
    .field-lbl { font-size: .625rem; letter-spacing: .2em; text-transform: uppercase; color: var(--cat-label); margin-bottom: var(--space-2); }
    .chips-wrap { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .pill {
      height: 36px; padding: 0 var(--space-4); border-radius: 999px; cursor: pointer;
      background: var(--surface); border: 0; color: var(--text); font-size: var(--fs-sm);
      display: inline-flex; align-items: center; transition: background-color .2s, color .2s;
    }
    .pill:active { transform: scale(.96); }
    .pill[aria-pressed="true"] { background: var(--text); color: var(--bg); }
    .fam-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: hsl(var(--h) 55% 62%); }
    .empty-line { font-size: var(--fs-sm); color: var(--muted); font-style: italic; padding: var(--space-2) 0; line-height: 1.6; }

    /* Voci di appunto/diario: testo che si tocca per modificarlo */
    .entries { display: flex; flex-direction: column; }
    .entry { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: .5px solid var(--border); padding: var(--space-3) 0; cursor: pointer; color: inherit; }
    .entry:first-child { border-top: 0; }
    .entry:active { opacity: .6; }
    .entry-text { display: block; font-family: var(--font-serif); font-size: var(--fs-md); line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
    .entry-date { display: block; font-size: var(--fs-xs); color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
    #emo-felt .entry-date { font-size: var(--fs-md); color: var(--text); font-weight: 500; margin: 0; }
    #emo-felt .entry-text { font-size: var(--fs-sm); color: var(--muted); margin-top: 2px; }
    .composer-row { margin-top: var(--space-2); }
    .zen textarea.composer {
      width: 100%; border: 0 !important; border-bottom: .5px solid var(--border) !important; border-radius: 0; background: none !important; resize: none; outline: none; min-height: 0;
      padding: var(--space-3) 0; font-family: var(--font-serif); font-size: var(--fs-md); line-height: 1.7; color: var(--text);
      transition: border-color .2s;
    }
    .zen textarea.composer:focus { border-bottom-color: var(--geco-blue) !important; }
    .composer::placeholder { color: var(--muted); font-style: italic; }
    .composer-row .text-btn { display: block; margin-left: auto; }

    /* ── Storia ── */
    .s-sec { border-bottom: .5px solid var(--border); }
    .s-sec:first-child { border-top: .5px solid var(--border); }
    .s-head { display: flex; align-items: center; gap: var(--space-3); width: 100%; padding: 18px 0; background: none; border: 0; cursor: pointer; text-align: left; color: inherit; }
    .s-title { flex: 1; font-size: var(--fs-lg); font-weight: 500; letter-spacing: -.01em; }
    .s-count { font-size: var(--fs-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
    .s-chev { color: var(--muted); transform: rotate(-90deg); transition: transform .3s var(--ease); }
    .s-sec.open .s-chev { transform: rotate(90deg); }
    .s-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s var(--ease); }
    .s-sec.open .s-body { grid-template-rows: 1fr; }
    .s-body > div { overflow: hidden; min-height: 0; }
    .s-sec.open .s-body > div { padding-bottom: var(--space-4); }
    .s-foot { margin-top: var(--space-2); }

    /* ── Diario ── */
    .j-stats { font-size: var(--fs-xs); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-align: center; }
    .j-search { margin-top: var(--space-3); }
    .j-month { font-size: .6875rem; letter-spacing: .2em; text-transform: uppercase; color: var(--cat-label); margin: var(--space-6) 0 var(--space-1); }
    .j-month:first-child { margin-top: 0; }
    .j-row { display: grid; grid-template-columns: 44px 1fr; gap: var(--space-3); width: 100%; text-align: left; background: none; border: 0; border-bottom: .5px solid var(--border); padding: var(--space-4) 0; cursor: pointer; color: inherit; }
    .j-row:active { opacity: .6; }
    .j-day { text-align: center; line-height: 1.1; }
    .j-day b { display: block; font-size: 1.625rem; font-weight: 300; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .j-day span { font-size: .625rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .j-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .j-title { font-family: var(--font-serif); font-size: var(--fs-lg); font-weight: 600; letter-spacing: -.01em; line-height: 1.3; }
    .j-prev { font-size: var(--fs-sm); color: var(--muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .j-moods { font-size: var(--fs-xs); color: var(--cat-label); letter-spacing: .04em; margin-top: 2px; }
    .j-empty { text-align: center; padding: var(--space-8) var(--space-4); color: var(--muted); font-size: var(--fs-sm); line-height: 1.7; }
    .j-empty .zen-quote { color: var(--text); font-size: var(--fs-xl); margin-bottom: var(--space-3); }

    /* Editor a tutto schermo */
    .editor { position: fixed; top: 0; left: 0; right: 0; bottom: 0; height: 100vh; height: 100dvh; z-index: 300; background: var(--bg); display: none; flex-direction: column; }
    .editor.on { display: flex; }
    .ed-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--space-2); padding: calc(var(--safe-top) + var(--space-2)) var(--space-5) var(--space-2); }
    .ed-bar .l { justify-self: start; } .ed-bar .r { justify-self: end; }
    .ed-bar .text-btn { padding: var(--space-3) 0; font-size: var(--fs-md); }
    #ed-cancel { color: var(--muted); font-weight: 400; }
    #ed-save { font-weight: 600; }
    .ed-date { position: relative; font-size: var(--fs-sm); color: var(--muted); letter-spacing: .02em; padding: var(--space-3) var(--space-2); }
    .ed-date span { display: inline-block; }
    .ed-date span::first-letter { text-transform: uppercase; }
    .ed-date input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    .ed-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: var(--space-4) var(--space-6) calc(var(--safe-bottom) + var(--space-8)); max-width: 640px; width: 100%; margin: 0 auto; }
    .zen input.ed-title { width: 100%; border: 0 !important; background: none !important; outline: none; border-radius: 0; padding: 0; margin-bottom: var(--space-4); font: 600 1.625rem/1.3 var(--font-serif); letter-spacing: -.015em; color: var(--text); }
    .zen textarea.ed-text { width: 100%; border: 0 !important; background: none !important; outline: none; resize: none; padding: 0; display: block; font: 400 1.0625rem/1.85 var(--font-serif); color: var(--text); min-height: 38vh; border-radius: 0; }
    .ed-title::placeholder, .ed-text::placeholder { color: var(--muted); opacity: .6; }
    .ed-meta { margin-top: var(--space-8); display: flex; flex-direction: column; gap: var(--space-6); padding-top: var(--space-5); border-top: .5px solid var(--border); }
    .ed-att img { display: block; max-width: 100%; border-radius: var(--radius-md); margin-bottom: var(--space-2); }
    .ed-count { font-size: var(--fs-xs); color: var(--muted); letter-spacing: .08em; text-align: center; min-height: 1em; }

    /* ── Ruota ── */
    .wheel-wrap { margin: 0 calc(-1 * var(--space-2)); }
    .wheel { display: block; width: 100%; max-width: 100%; height: auto; --s: 55%; --l1: 66%; --l2: 79%; --l3: 90%; }
    html[data-theme="dark"] .wheel { --s: 36%; --l1: 36%; --l2: 28%; --l3: 21%; }
    .wheel .r1 { --l: var(--l1); } .wheel .r2 { --l: var(--l2); } .wheel .r3 { --l: var(--l3); }
    .wheel .cell { cursor: pointer; -webkit-tap-highlight-color: transparent; outline: none; }
    .wheel .cell path { fill: hsl(var(--h) var(--s) var(--l)); stroke: var(--bg); stroke-width: .9; transition: filter .15s; }
    .wheel .cell:active path { filter: brightness(.9); }
    .wheel text { fill: var(--text); font-family: var(--font); font-weight: 500; letter-spacing: .01em; pointer-events: none; }
    .wheel .r3 text { font-weight: 400; }
    .wheel .hub { fill: var(--bg); } .wheel .hub-dot { fill: var(--sakura); }

    .zoom { position: fixed; top: 0; left: 0; right: 0; bottom: 0; height: 100vh; height: 100dvh; z-index: 300; background: var(--bg); display: none; flex-direction: column; }
    .zoom.on { display: flex; }
    .zoom-bar { display: flex; justify-content: space-between; align-items: center; padding: calc(var(--safe-top) + var(--space-2)) var(--space-5) var(--space-2); }
    .zoom-bar span { font-size: .6875rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
    .zoom-scroll { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    .zoom-scroll .wheel { width: 1200px; max-width: none; margin: 0; }

    /* ── Fogli ── */
    .sheet-body { display: flex; flex-direction: column; gap: var(--space-5); }
    .emo-head { display: flex; align-items: center; gap: var(--space-2); }
    .emo-crumb { font-size: .6875rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .emo-about { font-family: var(--font-serif); font-style: italic; font-size: var(--fs-md); line-height: 1.7; border-left: 2px solid var(--sakura); padding-left: var(--space-4); }
    .emo-log-actions { display: flex; flex-direction: column; align-items: center; gap: var(--space-1); }
    #pick-list { max-height: 52dvh; overflow-y: auto; }
  </style>
</head>
<body class="zen zen-native" data-title="Salute mentale" data-back="index.html" data-add="#btn-add" data-add-label="Aggiungi">
  <script type="module" src="js/core/auth-guard.js"></script>
  <script type="module" src="js/ui/shell.js"></script>

  <!-- Il + della barra in basso preme questo pulsante: l'azione dipende dalla scheda -->
  <button id="btn-add" type="button" hidden aria-hidden="true" tabindex="-1"></button>

  <main class="zen-main mh-main">
    <div class="seg-wrap">
      <div class="segmented" role="group" aria-label="Sezione">
        <button type="button" data-tab="storia" aria-pressed="false">Storia</button>
        <button type="button" data-tab="diario" aria-pressed="true">Diario</button>
        <button type="button" data-tab="emozioni" aria-pressed="false">Emozioni</button>
      </div>
    </div>
    <section class="view" id="view-storia" hidden></section>
    <section class="view" id="view-diario"></section>
    <section class="view" id="view-emozioni" hidden></section>
  </main>

  <!-- Scrittura del diario, a tutto schermo -->
  <div class="editor" id="editor" role="dialog" aria-modal="true" aria-label="Nuova voce del diario">
    <div class="ed-bar">
      <div class="l"><button type="button" class="text-btn" id="ed-cancel">Annulla</button></div>
      <label class="ed-date"><span id="ed-date-label"></span><input type="date" id="ed-date-input" aria-label="Data della voce"/></label>
      <div class="r"><button type="button" class="text-btn" id="ed-save">Fatto</button></div>
    </div>
    <div class="ed-scroll" id="ed-scroll">
      <input class="ed-title" id="ed-title" type="text" placeholder="Titolo" autocomplete="off" enterkeyhint="next"/>
      <textarea class="ed-text" id="ed-text" placeholder="Cosa ti passa per la testa?"></textarea>
      <div class="ed-meta">
        <div><div class="field-lbl">Come ti senti?</div><div class="chips-wrap" id="ed-moods"></div></div>
        <div id="ed-attach"></div>
        <input type="file" id="ed-file" accept="image/*" hidden/>
        <div id="ed-del" hidden></div>
        <div class="ed-count" id="ed-count"></div>
      </div>
    </div>
  </div>

  <!-- Ruota ingrandita: si scorre con il dito, ogni emozione è toccabile -->
  <div class="zoom" id="wheel-zoom" role="dialog" aria-modal="true" aria-label="Ruota delle emozioni ingrandita">
    <div class="zoom-bar"><span>Trascina per esplorare</span><button type="button" class="text-btn" id="zoom-close">Chiudi</button></div>
    <div class="zoom-scroll" id="zoom-scroll"></div>
  </div>

  <!-- Fogli: A per i contenuti, B (sopra) per modifiche e conferme -->
  <div class="zen-sheet-overlay" id="sheet-a">
    <div class="zen-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-a-title">
      <div class="zen-sheet-handle"></div>
      <div class="zen-sheet-title" id="sheet-a-title"></div>
      <div class="sheet-body" id="sheet-a-body"></div>
    </div>
  </div>
  <div class="zen-sheet-overlay" id="sheet-b">
    <div class="zen-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-b-title">
      <div class="zen-sheet-handle"></div>
      <div class="zen-sheet-title" id="sheet-b-title"></div>
      <div class="sheet-body" id="sheet-b-body"></div>
    </div>
  </div>

  <script type="module" src="js/pages/mentale/main.js"></script>
</body>
</html>
