<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Il Geco Zen"/>
  <meta name="theme-color" content="#FAF7F2"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" href="assets/icons/favicon-48.png"/>
  <title>Il Geco Zen — Salute mentale</title>
  <script src="js/ui/theme-boot.js"></script>
  <link rel="stylesheet" href="styles/tokens.css"/>
  <link rel="stylesheet" href="styles/zen.css"/>
  <style>
    /* ── Salute mentale ────────────────────────────────────────────────────
       Poche linee sottili, molto spazio, il serif per ciò che scrivi tu. */
    .mh-main { gap: var(--space-6); }
    .seg-wrap {
      position: sticky; top: calc(var(--safe-top) + var(--header-h)); z-index: 50;
      margin: calc(-1 * var(--space-2)) 0 0; padding: var(--space-2) 0;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
    }
    .view { display: flex; flex-direction: column; gap: var(--space-6); }
    .view[hidden] { display: none !important; }

    .block-title { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); }
    .block-title .zen-eyebrow { margin: 0; }
    .text-btn { background: none; border: 0; padding: 4px 2px; cursor: pointer; font-size: var(--fs-sm); color: var(--geco-blue); font-weight: 500; }
    .text-btn:active { opacity: .6; }
    .text-btn.danger { color: var(--danger); }
    .text-btn.armed { background: var(--danger); color: #fff; border-radius: 999px; padding: 6px 14px; }
    .btn.armed { background: var(--danger); border-color: var(--danger); color: #fff; }
    .note { font-size: var(--fs-xs); color: var(--muted); line-height: 1.5; }
    .field-lbl { font-size: .625rem; letter-spacing: .2em; text-transform: uppercase; color: var(--cat-label); margin-bottom: var(--space-2); }
    .chips-wrap { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .pill {
      height: 36px; padding: 0 var(--space-4); border-radius: 999px; cursor: pointer;
      background: var(--surface); border: 0; color: var(--text); font-size: var(--fs-sm);
      display: inline-flex; align-items: center; transition: background-color .2s, color .2s;
    }
    .pill:active { transform: scale(.96); }
    .pill[aria-pressed="true"] { background: var(--text); color: var(--bg); }
    .fam-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: var(--c, var(--muted)); }
    .empty-line { font-size: var(--fs-sm); color: var(--muted); font-style: italic; padding: var(--space-2) 0; line-height: 1.6; }

    /* ── Diario ── */
    .j-stats { font-size: var(--fs-xs); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-align: center; }
    .j-search { margin-top: var(--space-3); }
    .j-month { font-size: .6875rem; letter-spacing: .2em; text-transform: uppercase; color: var(--cat-label); margin: var(--space-6) 0 var(--space-1); }
    .j-month:first-child { margin-top: 0; }
    .j-row { display: grid; grid-template-columns: 44px 1fr; gap: var(--space-3); width: 100%; text-align: left; background: none; border: 0; border-bottom: .5px solid var(--border); padding: var(--space-4) 0; cursor: pointer; color: inherit; }
    .j-row:active { opacity: .6; }
    .j-day { text-align: center; line-height: 1.1; }
    .j-day b { display: block; font-size: 1.625rem; font-weight: 300; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .j-day span { font-size: .625rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .j-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .j-title { font-family: var(--font-serif); font-size: var(--fs-lg); font-weight: 600; letter-spacing: -.01em; line-height: 1.3; }
    .j-prev { font-size: var(--fs-sm); color: var(--muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .j-moods { font-size: var(--fs-xs); color: var(--cat-label); letter-spacing: .04em; margin-top: 2px; }
    .j-empty { text-align: center; padding: var(--space-8) var(--space-4); color: var(--muted); font-size: var(--fs-sm); line-height: 1.7; }
    .j-empty .zen-quote { color: var(--text); font-size: var(--fs-xl); margin-bottom: var(--space-3); }

    /* Editor a tutto schermo */
    .editor { position: fixed; top: 0; left: 0; right: 0; bottom: 0; height: 100vh; height: calc(100dvh + var(--deficit, 0px)); z-index: 300; background: var(--bg); display: none; flex-direction: column; }
    .editor.on { display: flex; }
    .ed-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--space-2); padding: calc(var(--safe-top) + var(--space-2)) var(--space-5) var(--space-2); }
    .ed-bar .l { justify-self: start; } .ed-bar .r { justify-self: end; }
    .ed-bar .text-btn { padding: var(--space-3) 0; font-size: var(--fs-md); }
    #ed-cancel { color: var(--muted); font-weight: 400; }
    #ed-save { font-weight: 600; }
    .ed-date { position: relative; font-size: var(--fs-sm); color: var(--muted); letter-spacing: .02em; padding: var(--space-3) var(--space-2); }
    .ed-date span { display: inline-block; }
    .ed-date span::first-letter { text-transform: uppercase; }
    .ed-date input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    .ed-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: var(--space-4) var(--space-6) calc(var(--safe-bottom) + var(--space-8)); max-width: 640px; width: 100%; margin: 0 auto; }
    .zen input.ed-title { width: 100%; border: 0 !important; background: none !important; outline: none; border-radius: 0; padding: 0; margin-bottom: var(--space-4); font: 600 1.625rem/1.3 var(--font-serif); letter-spacing: -.015em; color: var(--text); }
    .zen textarea.ed-text { width: 100%; border: 0 !important; background: none !important; outline: none; resize: none; padding: 0; display: block; font: 400 1.0625rem/1.85 var(--font-serif); color: var(--text); min-height: 38vh; border-radius: 0; }
    .ed-title::placeholder, .ed-text::placeholder { color: var(--muted); opacity: .6; }
    .ed-meta { margin-top: var(--space-8); display: flex; flex-direction: column; gap: var(--space-6); padding-top: var(--space-5); border-top: .5px solid var(--border); }
    .ed-att img { display: block; max-width: 100%; border-radius: var(--radius-md); margin-bottom: var(--space-2); }
    .ed-count { font-size: var(--fs-xs); color: var(--muted); letter-spacing: .08em; text-align: center; min-height: 1em; }

    /* ── Riquadri di scrittura e schede degli appunti: bordo sempre ben visibile ── */
    .note-box { border: 1px solid var(--border); background: var(--card); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); transition: border-color .2s; }
    .note-box:focus-within { border-color: var(--geco-blue); }
    .zen .note-box textarea { width: 100%; border: 0 !important; background: none !important; outline: none; resize: none; min-height: 0; padding: 0; border-radius: 0; font: 400 var(--fs-md)/1.7 var(--font-serif); color: var(--text); display: block; }
    .note-box textarea::placeholder { color: var(--muted); font-style: italic; }
    .foot-tags { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; min-width: 0; }
    .tag { display: inline-block; font-size: var(--fs-xs); line-height: 1; letter-spacing: .02em; padding: 6px 10px; border-radius: 999px; color: var(--text); background: color-mix(in srgb, var(--c, var(--muted)) 24%, var(--card)); border: .5px solid color-mix(in srgb, var(--c, var(--muted)) 45%, var(--border)); }
    .sel-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-3); }
    .nc-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); margin-top: 6px; }
    .nc-foot .nc-date { margin: 0; }
    .note-box-foot { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); margin-top: var(--space-2); padding-top: var(--space-2); border-top: .5px solid var(--border); }
    .date-chip { position: relative; font-size: var(--fs-sm); color: var(--muted); padding: 6px 12px; border-radius: 999px; background: var(--surface); }
    .date-chip input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
    .note-list { display: flex; flex-direction: column; gap: var(--space-2); margin-top: var(--space-4); }
    .note-card { display: block; width: 100%; text-align: left; cursor: pointer; color: inherit; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); }
    .note-card:active { opacity: .7; }
    .nc-text { display: block; font-family: var(--font-serif); font-size: var(--fs-md); line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
    .nc-date { display: block; margin-top: 6px; font-size: var(--fs-xs); color: var(--muted); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
    .empty-line { font-size: var(--fs-sm); color: var(--muted); font-style: italic; padding: var(--space-2) 0; line-height: 1.6; }
    .back-link { align-self: flex-start; font-size: var(--fs-md); }

    /* ── Storia: grandi schede colorate ── */
    .s-grid { display: flex; flex-direction: column; gap: var(--space-3); }
    .s-card {
      position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 4px; width: 100%; text-align: left; cursor: pointer; color: var(--text);
      padding: var(--space-5) var(--space-5) var(--space-5) calc(var(--space-5) + 6px);
      border: .5px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
      background: linear-gradient(120deg, color-mix(in srgb, var(--t) 17%, var(--card)), var(--card) 72%);
      transition: transform .15s var(--ease);
    }
    .s-card::before { content: ''; position: absolute; left: 0; top: 16px; bottom: 16px; width: 4px; border-radius: 0 4px 4px 0; background: var(--t); }
    .s-card:active { transform: scale(.985); }
    .s-num { position: absolute; right: var(--space-4); top: 0; font: 200 4.5rem/1 var(--font-serif); letter-spacing: -.05em; color: var(--t); opacity: .2; pointer-events: none; }
    .s-card-title { font: 600 1.375rem/1.25 var(--font-serif); letter-spacing: -.015em; padding-right: 56px; }
    .s-card-meta { font-size: var(--fs-xs); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .s-card-prev { margin-top: var(--space-2); font-family: var(--font-serif); font-style: italic; font-size: var(--fs-sm); line-height: 1.6; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .s-new { align-items: center; justify-content: center; background: none; border: 1px dashed var(--border); box-shadow: none; color: var(--muted); padding: var(--space-4); font-size: var(--fs-md); }
    .s-new::before { display: none; }
    .sp-head { display: flex; flex-direction: column; gap: 4px; margin-bottom: var(--space-5); }
    .sp-kicker { font: 300 .875rem var(--font-serif); color: var(--t); letter-spacing: .24em; }
    .sp-title { font: 600 2rem/1.15 var(--font-serif); letter-spacing: -.02em; border-left: 4px solid var(--t); padding-left: var(--space-4); }
    .sp-meta { font-size: var(--fs-xs); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding-left: calc(var(--space-4) + 4px); }

    /* ── Diario: vista calendario ── */
    .j-views { margin-top: var(--space-3); }
    .jc-head { display: flex; align-items: center; justify-content: space-between; margin-top: var(--space-2); }
    .jc-title { font-size: var(--fs-lg); font-weight: 600; letter-spacing: -.01em; text-transform: capitalize; }
    .jc-head .icon-btn .icon { width: 20px; height: 20px; }
    .jc-head .next .icon { transform: rotate(180deg); }
    .jc-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 6px; text-align: center; margin-top: var(--space-3); }
    .jc-dow { font-size: .625rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-bottom: 4px; }
    .jc-day { position: relative; aspect-ratio: 1; width: 100%; max-width: 46px; margin: 0 auto; border-radius: 50%; border: 0; background: none; font-size: var(--fs-md); color: var(--text); cursor: pointer; font-variant-numeric: tabular-nums; transition: background-color .15s; }
    .jc-day:active { background: var(--surface); }
    .jc-day.has { background: var(--geco-mist); color: var(--geco-blue); font-weight: 600; }
    .jc-day.has::after { content: ''; position: absolute; left: 50%; bottom: 5px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--sakura); }
    .jc-day.today { box-shadow: inset 0 0 0 1.5px var(--text); }
    .jc-day.sel { box-shadow: 0 0 0 2px var(--sakura); }

    /* Nota vocale */
    .aud-actions { display: flex; gap: var(--space-5); flex-wrap: wrap; }
    .rec { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--card); }
    .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); animation: rec-pulse 1.2s ease-in-out infinite; }
    @keyframes rec-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.8); } }
    .rec-time { font-size: var(--fs-lg); font-variant-numeric: tabular-nums; font-weight: 500; }
    .aud { display: flex; flex-direction: column; gap: var(--space-2); }
    .aud audio { width: 100%; }
    .aud-row { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); }
    .aud-err { font-size: var(--fs-sm); color: var(--danger); line-height: 1.5; }
    @media (prefers-reduced-motion: reduce) { .rec-dot { animation: none; } }

    /* ── Ruote: petali con sfumatura, il colore è più pieno al centro ── */
    .wheel-wrap { margin: 0 calc(-1 * var(--space-2)); }
    .wheel { display: block; width: 100%; height: auto; --s0: 82%; --s1: 52%; --s2: 24%; overflow: visible; }
    html[data-theme="dark"] .wheel { --s0: 70%; --s1: 46%; --s2: 26%; }
    .wheel .cell { cursor: pointer; -webkit-tap-highlight-color: transparent; outline: none; animation: bloom .55s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 28ms); transition: transform .25s var(--ease), opacity .25s; }
    .wheel .cell path { stroke-width: 5; stroke-linejoin: round; transition: filter .2s; }
    .wheel .cell:active path { filter: brightness(.93); }
    .wheel .cell.r1 path { filter: drop-shadow(0 3px 5px color-mix(in srgb, var(--c) 35%, transparent)); }
    .wheel .cell.sel { transform: scale(1.03); }
    .wheel .cell.sel path { stroke: var(--text); stroke-width: 2; paint-order: stroke; filter: brightness(1.05) drop-shadow(0 2px 4px rgba(0,0,0,.25)); }
    .wheel.has-sel .cell:not(.sel) { opacity: .5; }
    .wheel text { fill: var(--text); font-family: var(--font-serif); font-weight: 500; letter-spacing: .005em; pointer-events: none; }
    .wheel .r1 text { font-weight: 600; letter-spacing: .01em; }
    html[data-theme="dark"] .wheel .r1 text { fill: #F4F8FA; }
    .wheel .guide { fill: none; stroke: var(--text); stroke-opacity: .08; stroke-width: 1; stroke-dasharray: 2 5; pointer-events: none; }
    .wheel .hub { fill: var(--card); stroke: color-mix(in srgb, var(--sakura) 55%, var(--border)); stroke-width: 1.5; }
    .wheel .hub-g { cursor: pointer; }
    .wheel .hub-halo { fill: none; stroke: var(--sakura); stroke-width: 1.5; opacity: .55; transform-origin: 0 0; animation: breathe 4.2s ease-in-out infinite; pointer-events: none; }
    .wheel .hub-q { font-style: italic; font-weight: 400; fill: var(--muted); }
    .wheel .fhub { stroke-width: 3; stroke-linejoin: round; cursor: pointer; }
    .wheel .fhub-text { font-weight: 600; }
    .wheel .fhub-sub { font-style: italic; font-weight: 400; opacity: .75; }
    html[data-theme="dark"] .wheel .fhub-text { fill: #F4F8FA; }
    .family-wheel { margin: 0 calc(-1 * var(--space-5)); padding: var(--space-2) 0; background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--fc, var(--sakura)) 14%, transparent), transparent 68%); }
    @keyframes bloom { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: scale(1); } }
    @keyframes breathe { 0%, 100% { transform: scale(1); opacity: .5; } 50% { transform: scale(1.12); opacity: .15; } }
    @media (prefers-reduced-motion: reduce) { .wheel .cell, .wheel .hub-halo { animation: none; } }

    /* ── Fogli ── */
    .sheet-body { display: flex; flex-direction: column; gap: var(--space-5); }
    #pick-list { max-height: 52dvh; overflow-y: auto; }
  </style>
</head>
<body class="zen zen-native" data-title="Salute mentale" data-back="index.html" data-add="#btn-add" data-add-label="Aggiungi">
  <script type="module" src="js/core/auth-guard.js"></script>
  <script type="module" src="js/ui/shell.js"></script>

  <!-- Il + della barra in basso preme questo pulsante: l'azione dipende dalla scheda -->
  <button id="btn-add" type="button" hidden aria-hidden="true" tabindex="-1"></button>

  <template id="zen-header-actions">
    <button class="icon-btn" type="button" id="btn-more" aria-label="Altre azioni" hidden><svg class="icon" aria-hidden="true"><use href="#i-more"/></svg></button>
  </template>

  <main class="zen-main mh-main">
    <div class="seg-wrap">
      <div class="segmented" role="group" aria-label="Sezione">
        <button type="button" data-tab="storia" aria-pressed="false">Storia</button>
        <button type="button" data-tab="diario" aria-pressed="true">Diario</button>
        <button type="button" data-tab="emozioni" aria-pressed="false">Emozioni</button>
      </div>
    </div>
    <section class="view" id="view-storia" hidden></section>
    <section class="view" id="view-diario"></section>
    <section class="view" id="view-emozioni" hidden></section>
  </main>

  <!-- Scrittura del diario, a tutto schermo -->
  <div class="editor" id="editor" data-no-outside-close role="dialog" aria-modal="true" aria-label="Nuova voce del diario">
    <div class="ed-bar">
      <div class="l"><button type="button" class="text-btn" id="ed-cancel">Annulla</button></div>
      <label class="ed-date"><span id="ed-date-label"></span><input type="date" id="ed-date-input" aria-label="Data della voce"/></label>
      <div class="r"><button type="button" class="text-btn" id="ed-save">Fatto</button></div>
    </div>
    <div class="ed-scroll" id="ed-scroll">
      <input class="ed-title" id="ed-title" type="text" placeholder="Titolo" autocomplete="off" enterkeyhint="next"/>
      <textarea class="ed-text" id="ed-text" placeholder="Cosa ti passa per la testa?"></textarea>
      <div class="ed-meta">
        <div><div class="field-lbl">Come ti senti?</div><div class="chips-wrap" id="ed-moods"></div></div>
        <div id="ed-audio"></div>
        <input type="file" id="ed-audio-file" accept="audio/*" hidden/>
        <div id="ed-attach"></div>
        <input type="file" id="ed-file" accept="image/*" hidden/>
        <div id="ed-del" hidden></div>
        <div class="ed-count" id="ed-count"></div>
      </div>
    </div>
  </div>

  <!-- Pagina di un titolo della Storia -->
  <div class="editor" id="story-page" data-no-outside-close role="dialog" aria-modal="true" aria-label="Titolo">
    <div class="ed-bar">
      <div class="l"><button type="button" class="text-btn" id="sp-back">‹ Indietro</button></div>
      <span></span>
      <div class="r"><button type="button" class="text-btn" id="sp-edit">Titolo</button></div>
    </div>
    <div class="ed-scroll" id="sp-scroll">
      <div class="sp-head" id="sp-head"></div>
      <div id="sp-body"></div>
    </div>
  </div>

  <!-- Fogli: A per i contenuti, B (sopra) per modifiche e conferme -->
  <div class="zen-sheet-overlay" id="sheet-a">
    <div class="zen-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-a-title">
      <div class="zen-sheet-handle"></div>
      <div class="zen-sheet-title" id="sheet-a-title"></div>
      <div class="sheet-body" id="sheet-a-body"></div>
    </div>
  </div>
  <div class="zen-sheet-overlay" id="sheet-b">
    <div class="zen-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-b-title">
      <div class="zen-sheet-handle"></div>
      <div class="zen-sheet-title" id="sheet-b-title"></div>
      <div class="sheet-body" id="sheet-b-body"></div>
    </div>
  </div>

  <script type="module" src="js/pages/mentale/main.js"></script>
</body>
</html>
